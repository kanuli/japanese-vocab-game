name: Weekly dependency maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-dependency-maintenance.yml'

permissions:
  contents: write

concurrency:
  group: weekly-dependency-maintenance
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Discover current and latest versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(tr -d '[:space:]' < maintenance-playwright-version.txt)
          LATEST=$(npm view playwright version)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "checkout=$(gh api repos/actions/checkout/releases/latest --jq .tag_name 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          echo "setup_python=$(gh api repos/actions/setup-python/releases/latest --jq .tag_name 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          echo "configure_pages=$(gh api repos/actions/configure-pages/releases/latest --jq .tag_name 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          echo "upload_pages=$(gh api repos/actions/upload-pages-artifact/releases/latest --jq .tag_name 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          echo "deploy_pages=$(gh api repos/actions/deploy-pages/releases/latest --jq .tag_name 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          echo "voicevox=$(gh api repos/VOICEVOX/voicevox_engine/releases/latest --jq .tag_name 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          echo "Playwright: $CURRENT -> $LATEST"

      - name: Test latest Playwright against every page before any update
        id: candidate
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          if [ "$CURRENT" = "$LATEST" ]; then echo 'safe=true' >> "$GITHUB_OUTPUT"; echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          npm init -y >/dev/null 2>&1
          npm install --silent "playwright@$LATEST"
          RC=$?
          if [ "$RC" -eq 0 ]; then npx playwright install --with-deps chromium >/dev/null; RC=$?; fi
          if [ "$RC" -eq 0 ]; then
            python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dependency-http.log 2>&1 & SERVER=$!
            for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
            cat >/tmp/dependency-smoke.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright'),fs=require('fs');const pages=require('child_process').execSync("git ls-files '*.html'",{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);(async()=>{const b=await chromium.launch({headless:true}),c=await b.newContext({serviceWorkers:'block'});let bad=false;for(const p of pages){const x=await c.newPage(),errs=[];x.on('pageerror',e=>errs.push(String(e)));try{const r=await x.goto('http://127.0.0.1:4173/'+p,{waitUntil:'domcontentloaded',timeout:30000});if(!r||r.status()>=400)throw Error('HTTP');await x.waitForTimeout(1200);const s=await x.evaluate(()=>({t:document.title.trim(),n:(document.body?.innerText||'').trim().length,h:!!document.querySelector('#siteHealthBadge')}));if(!s.t||s.n<20||!s.h||errs.length)throw Error(JSON.stringify({s,errs}));console.log('CANDIDATE PASS',p);}catch(e){bad=true;console.error('CANDIDATE FAIL',p,e.message)}await x.close();}await b.close();if(bad)process.exit(1)})();
          NODE
            node /tmp/dependency-smoke.cjs; RC=$?
            kill "$SERVER" 2>/dev/null || true
          fi
          set -e
          if [ "$RC" -eq 0 ]; then echo 'safe=true' >> "$GITHUB_OUTPUT"; else echo 'safe=false' >> "$GITHUB_OUTPUT"; fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Adopt tested Playwright version
        if: steps.candidate.outputs.changed == 'true' && steps.candidate.outputs.safe == 'true'
        run: printf '%s\n' '${{ steps.versions.outputs.latest }}' > maintenance-playwright-version.txt

      - name: Write dependency status
        env:
          CUR: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
          SAFE: ${{ steps.candidate.outputs.safe }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
          CHECKOUT: ${{ steps.versions.outputs.checkout }}
          SETUP_PYTHON: ${{ steps.versions.outputs.setup_python }}
          CONFIGURE_PAGES: ${{ steps.versions.outputs.configure_pages }}
          UPLOAD_PAGES: ${{ steps.versions.outputs.upload_pages }}
          DEPLOY_PAGES: ${{ steps.versions.outputs.deploy_pages }}
          VOICEVOX: ${{ steps.versions.outputs.voicevox }}
        run: |
          python - <<'PY'
          import json,os,datetime,pathlib
          adopted=pathlib.Path('maintenance-playwright-version.txt').read_text().strip()
          d={'version':1,'status':'ok','checkedAt':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'playwright':{'previous':os.environ['CUR'],'latest':os.environ['LATEST'],'current':adopted,'candidateTest':'pass' if os.environ.get('SAFE')=='true' else 'fail','autoUpdated':adopted!=os.environ['CUR']},'githubActions':{'checkout':os.environ['CHECKOUT'],'setupPython':os.environ['SETUP_PYTHON'],'configurePages':os.environ['CONFIGURE_PAGES'],'uploadPagesArtifact':os.environ['UPLOAD_PAGES'],'deployPages':os.environ['DEPLOY_PAGES'],'policy':'report-only; major workflow actions are not blindly replaced'},'voicevoxEngine':{'latest':os.environ['VOICEVOX'],'policy':'report-only for already-hosted audio; checked before future regeneration'},'supertonic':{'policy':'pinned','reason':'Production browser/hosted audio is validated; no blind automatic upgrade.'}}
          open('dependency-status.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n');print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - name: Commit safe maintenance updates
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dependency-status.json maintenance-playwright-version.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update tested maintenance dependencies'
          git pull --rebase origin main
          git push origin main
