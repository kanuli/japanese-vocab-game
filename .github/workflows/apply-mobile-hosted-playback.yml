name: Apply mobile hosted playback fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/patch-mobile-hosted-playback.py'
      - '.mobile-hosted-playback-trigger'

permissions:
  contents: write

concurrency:
  group: apply-mobile-hosted-playback
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply mobile hosted playback patch
        run: python .github/patch-mobile-hosted-playback.py
      - name: Validate patched JavaScript
        run: |
          node --check mobile-supertonic-guard.js
          node --check wordaudio-multivoice.js
          node --check wordlist-voicevox.js
          node --check listening-supertonic-hosted.js
          node --check conversation-hosted-audio.js
          node --check translator-hosted-voice.js
          python - <<'PY'
          from pathlib import Path
          required=['wordaudio.html','wordlist.html','listening.html','conversation.html','pronunciation.html','translator.html']
          for p in required:
              s=Path(p).read_text(encoding='utf-8')
              assert 'mobile-supertonic-guard.js?v=20260817v4' in s, p
          assert 'playHostedBytes' in Path('wordaudio-multivoice.js').read_text(encoding='utf-8')
          assert 'playHostedBytes' in Path('listening-supertonic-hosted.js').read_text(encoding='utf-8')
          assert 'playHostedBytes' in Path('conversation-hosted-audio.js').read_text(encoding='utf-8')
          assert 'playSharedUrl' in Path('listening.html').read_text(encoding='utf-8')
          print('Hosted mobile player integration validated.')
          PY
      - name: Commit playback fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' wordaudio-multivoice.js wordlist-voicevox.js listening-supertonic-hosted.js conversation-hosted-audio.js translator-hosted-voice.js
          if git diff --cached --quiet; then
            echo 'No playback patch changes required.'
            exit 0
          fi
          git commit -m 'Fix hosted audio playback on mobile'
          git pull --rebase origin main
          git push origin main
