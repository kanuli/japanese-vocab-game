name: Delete ghost workflow runs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-ghost-runs.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-ghost-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel and delete stale ghost workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          failed=0
          for run_id in 32985738882 32985487405 32985427909; do
            echo "Force-cancelling workflow run ${run_id}"
            force_code="$(curl -sS -o "/tmp/force-${run_id}.txt" -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/force-cancel")"
            cat "/tmp/force-${run_id}.txt" || true
            echo
            echo "force-cancel HTTP ${force_code}"
            sleep 2
            echo "Deleting workflow run ${run_id}"
            delete_code="$(curl -sS -o "/tmp/delete-${run_id}.txt" -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}")"
            cat "/tmp/delete-${run_id}.txt" || true
            echo
            echo "delete HTTP ${delete_code}"
            if [[ "${delete_code}" != "204" && "${delete_code}" != "404" ]]; then
              failed=1
            fi
          done
          exit "${failed}"

# Trigger force-cancel then delete cleanup.
