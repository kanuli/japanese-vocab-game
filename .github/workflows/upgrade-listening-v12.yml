name: Upgrade listening v1.2

on:
  push:
    paths:
      - '.github/workflows/upgrade-listening-v12.yml'

permissions:
  contents: write

jobs:
  upgrade-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply listening v1.2 patch
        run: |
          python scripts/upgrade-listening-v12.py
          python scripts/strict-listening-distractors.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pinned official Supertonic browser helper and license
        run: |
          mkdir -p src vendor/ort vendor/licenses
          curl -fL --retry 3 'https://raw.githubusercontent.com/supertone-inc/supertonic/912c54b435276d68d41c7347c9aac5cf4f8aa4b7/web/helper.js' -o src/supertonic-helper.js
          curl -fL --retry 3 'https://raw.githubusercontent.com/supertone-inc/supertonic/912c54b435276d68d41c7347c9aac5cf4f8aa4b7/LICENSE' -o vendor/licenses/SUPERTONIC-MIT.txt

      - name: Build browser AI module
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund onnxruntime-web@1.24.3 esbuild@0.25.9
          npx esbuild src/listening-supertonic-entry.js --bundle --format=esm --platform=browser --target=es2022 --outfile=vendor/supertonic-browser.js
          find node_modules/onnxruntime-web/dist -maxdepth 1 -type f \( -name 'ort-wasm*.wasm' -o -name 'ort-wasm*.mjs' -o -name 'ort-wasm*.js' \) -exec cp {} vendor/ort/ \;
          test -s vendor/supertonic-browser.js
          test "$(find vendor/ort -type f -name '*.wasm' | wc -l)" -gt 0
          test "$(find vendor/ort -type f -name '*.mjs' | wc -l)" -gt 0

      - name: JavaScript syntax and UI assertions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('listening.html').read_text(encoding='utf-8')
          assert '日本語聽解挑戰 v1.2' in s
          assert '聲線風格（模擬）' not in s
          assert '✨ AI 日語語音' in s
          assert 'Supertonic 3 AI 聲線' in s
          assert '👩 F1' in s and '👨 M5' in s
          assert 'prepareChineseChoices' in s
          assert 'data-v="${encodeURIComponent(x.jp)}"' in s
          assert '${esc(x.zh)}' in s
          assert '同一句只改一個關鍵細節' in s
          assert '相似 Web 例句＋細節變化' not in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/listening-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/listening-inline.js
          node --check vendor/supertonic-browser.js

      - name: Install Chromium test dependency
        run: |
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Browser integration test
        run: |
          python3 -m http.server 8765 >/tmp/listening-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > test-listening.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{ if(m.type()==='error') errors.push('console: '+m.text()); });
            await page.goto('http://127.0.0.1:8765/listening.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.SupertonicAI && typeof window.SupertonicAI.preflight==='function',{timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#webStatus')?.textContent!=='載入中…',{timeout:60000});
            await page.waitForFunction(()=>!document.querySelector('#start')?.disabled,{timeout:60000});

            const preflight=await page.evaluate(()=>window.SupertonicAI.preflight());
            if(!preflight || !preflight.voices || preflight.voices.length!==10) throw new Error('Supertonic preflight failed');

            await page.click('#start');
            await page.waitForFunction(()=>document.querySelectorAll('.choice').length===4,{timeout:90000});
            const rows=await page.$$eval('.choice',els=>els.map(e=>({zh:e.textContent.replace(/^[A-D]\.\s*/, '').trim(),jp:decodeURIComponent(e.dataset.v)})));
            if(rows.length!==4) throw new Error('Expected four choices');
            const zh=rows.map(x=>x.zh);
            if(new Set(zh).size!==4) throw new Error('Chinese choices are duplicated: '+JSON.stringify(zh));
            for(const t of zh){
              if(/[ぁ-ゖァ-ヺ]/.test(t)) throw new Error('Japanese kana leaked into choice: '+t);
              if(/[A-Za-z]/.test(t)) throw new Error('English leaked into choice: '+t);
            }
            // Strict distractors must stay structurally close to one another.
            function bg(s){const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return new Set(a)}
            function sim(a,b){const A=bg(a),B=bg(b);let n=0;for(const x of A)if(B.has(x))n++;return n/Math.max(1,A.size+B.size-n)}
            for(let i=0;i<rows.length;i++)for(let j=i+1;j<rows.length;j++){
              const v=sim(rows[i].jp,rows[j].jp);
              if(v<0.35)throw new Error(`Distractors too dissimilar (${v.toFixed(2)}): ${rows[i].jp} || ${rows[j].jp}`);
            }
            console.log('Traditional-Chinese close choices OK:',rows);

            // Full model initialization + a short genuine Japanese AI synthesis.
            const ai=await page.evaluate(async()=>{
              await window.SupertonicAI.init(()=>{});
              const r=await window.SupertonicAI.synthesize('こんにちは。',{voice:'F1',speed:1,totalSteps:3});
              return {ready:window.SupertonicAI.isReady(),voice:r.voice,duration:r.duration,urlPrefix:r.url.slice(0,5)};
            });
            if(!ai.ready || ai.voice!=='F1' || ai.duration<=0 || ai.urlPrefix!=='blob:') throw new Error('Real AI synthesis failed: '+JSON.stringify(ai));
            console.log('Real Supertonic synthesis OK:',ai);

            if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          timeout 420s node test-listening.cjs

      - name: Commit only verified update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening.html src/listening-supertonic-entry.js src/supertonic-helper.js vendor/supertonic-browser.js vendor/ort vendor/licenses/SUPERTONIC-MIT.txt
          git commit -m 'Listening v1.2: Chinese choices and real Supertonic AI voices'
          git push
