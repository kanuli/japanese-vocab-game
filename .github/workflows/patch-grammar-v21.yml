name: Patch grammar game v2.1

on:
  push:
    paths:
      - '.github/workflows/patch-grammar-v21.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch grammar game
        run: python3 scripts/patch_grammar_v21.py

      - name: Add local Kuromoji dictionary
        shell: bash
        run: |
          npm pack kuromoji@0.1.2 > /tmp/pkg.txt
          PKG=$(tail -n 1 /tmp/pkg.txt)
          rm -rf /tmp/kuromoji-package
          mkdir -p /tmp/kuromoji-package dict
          tar -xzf "$PKG" -C /tmp/kuromoji-package
          cp -f /tmp/kuromoji-package/package/dict/*.dat.gz dict/
          rm -f "$PKG"

      - name: Commit patched game
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grammar.html dict/
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix grammar Chinese output and furigana"
          git push
