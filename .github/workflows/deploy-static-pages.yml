name: Deploy static site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-static-pages.yml'
      - 'index.html'
      - 'grammar.html'
      - 'listening.html'
      - 'mocktest.html'
      - 'pronunciation.html'
      - 'translator.html'
      - 'conversation.html'
      - 'wordaudio.html'
      - 'wordlist.html'
      - 'vocab-plus-game.html'
      - 'vocabulary-plus.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - 'data/**'
      - 'vendor/**'

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Stop obsolete sequential M3 backup run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/kanuli/japanese-vocab-game/actions/runs/32017010108/cancel)
          if [ "$code" = 202 ] || [ "$code" = 409 ]; then
            echo "Obsolete backup cancellation endpoint returned HTTP $code"
          else
            cat /tmp/cancel.json >&2
            exit 1
          fi

      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify production-critical assets before deployment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=['index.html','grammar.html','listening.html','mocktest.html','pronunciation.html','translator.html','conversation.html','wordaudio.html','wordlist.html','conversation-hosted-audio.js','conversation-voicevox-index.json','conversation-supertonic-index.json']
          missing=[p for p in required if not Path(p).is_file()]
          assert not missing, missing
          vv=json.load(open('conversation-voicevox-index.json',encoding='utf-8'))
          st=json.load(open('conversation-supertonic-index.json',encoding='utf-8'))
          assert (vv.get('version'),vv.get('speakerCount'),vv.get('utteranceCount'),vv.get('recordingCount'))==(2,43,2677,115111)
          assert (st.get('version'),st.get('voiceCount'),st.get('utteranceCount'),st.get('recordingCount'))==(2,10,2677,26770)
          print('Production assets validated before Pages deployment.')
          PY

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
