name: Export JLPT teacher review queue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/export_teacher_review_queue.py'
      - '.github/workflows/export-teacher-review-queue.yml'
      - 'data/jlpt_teacher_audit.tsv'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export every grade-C row
        run: python tools/export_teacher_review_queue.py
      - name: Verify queue coverage
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          meta=json.loads(Path('data/jlpt_teacher_review_queue.json').read_text(encoding='utf-8'))
          with Path('data/jlpt_teacher_review_queue.tsv').open(encoding='utf-8',newline='') as f:
            rows=list(csv.DictReader(f,delimiter='\t'))
          assert meta['status']=='complete'
          assert len(rows)==meta['reviewRows']
          assert all(r['grade']=='C' for r in rows)
          print('TEACHER REVIEW QUEUE PASS',meta)
          PY
      - name: Commit review queue
        run: |
          if git diff --quiet -- data/jlpt_teacher_review_queue.tsv data/jlpt_teacher_review_queue.json; then
            echo 'Review queue already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jlpt_teacher_review_queue.tsv data/jlpt_teacher_review_queue.json
          git commit -m 'Update complete JLPT teacher review queue'
          git push
