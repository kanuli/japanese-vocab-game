name: Fix VOICEVOX selection

on:
  push:
    paths:
      - '.github/workflows/fix-voicevox-selection.yml'

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Apply VOICEVOX selection fix
        run: python scripts/fix-voicevox-selection.py

      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('listening.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/listening-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'radio.disabled=false;connect.disabled=true;setup.disabled=true;' in s
          PY
          node --check /tmp/listening-inline.js

      - name: Install browser tester
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser smoke test
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cat > test-voicevox-selection.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/listening.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#onedriveStatus')?.textContent!=='正在檢查 OneDrive 設定…',{timeout:30000});
            if(await page.isDisabled('#engineVoicevox')) throw new Error('VOICEVOX radio is still disabled before Client ID setup');
            await page.check('#engineVoicevox');
            if(!(await page.isChecked('#engineVoicevox'))) throw new Error('VOICEVOX radio could not be selected');
            const panelDisplay=await page.$eval('#voicevoxPanel',e=>getComputedStyle(e).display);
            if(panelDisplay==='none') throw new Error('VOICEVOX setup panel did not open');
            if(!(await page.isEditable('#onedriveClientId'))) throw new Error('Client ID field is not editable');
            if(!(await page.isDisabled('#onedriveConnect'))) throw new Error('Connect button should stay disabled until Client ID is configured');
            const st=await page.textContent('#onedriveStatus');
            if(!st.includes('Client ID')) throw new Error('Client ID guidance missing: '+st);
            if(errors.length) throw new Error(errors.join(' | '));
            console.log('VOICEVOX selectable before setup: OK');
            console.log('Setup status:',st);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          timeout 120s node test-voicevox-selection.cjs

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening.html scripts/patch-listening-onedrive-voicevox.py
          git commit -m 'Allow VOICEVOX selection before OneDrive setup'
          git push
