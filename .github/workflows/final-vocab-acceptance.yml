name: Final vocabulary acceptance verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-vocab-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Static runtime and catalog acceptance
        run: |
          set -euo pipefail
          node --check advanced_words.js
          node --check data/advanced_vocab.js
          node --check data/coverage_deferred_manual.js
          node --check data/coverage_sourcecheck_manual.js
          node --check data/coverage_postreview_manual.js
          node --check wordaudio-delta-voices.js
          python - <<'PY'
          import json,re
          from pathlib import Path
          consumers=['index.html','wordlist.html','wordaudio.html','vocab-plus-game.html','vocabulary-plus.html']
          wanted='./advanced_words.js?v=20260821v2'
          for name in consumers:
              s=Path(name).read_text(encoding='utf-8')
              assert wanted in s,(name,'missing cache-busted advanced_words loader')
          stale=[]
          for p in Path('.').glob('*.html'):
              if 'src="./advanced_words.js"' in p.read_text(encoding='utf-8'):
                  stale.append(p.name)
          assert not stale,('unversioned advanced_words.js remains',stale)
          loader=Path('advanced_words.js').read_text(encoding='utf-8')
          for required in ['coverage_deferred_manual.js','coverage_sourcecheck_manual.js','coverage_postreview_manual.js','wordaudio-delta-voices.js']:
              assert required in loader,('loader missing',required)
          cats=[]
          expectations=[
              ('word-voicevox-delta-catalog.json',713,43,30659),
              ('word-supertonic3-delta-catalog.json',713,10,7130),
              ('word-aivis-delta-catalog.json',713,4,2852),
          ]
          keyset=None
          for path,wc,vc,rc in expectations:
              d=json.load(open(path,encoding='utf-8'))
              assert d.get('status')=='ready',(path,d.get('status'))
              assert d.get('wordCount')==wc,(path,d.get('wordCount'))
              gotvc=d.get('speakerCount',d.get('voiceCount'))
              assert gotvc==vc,(path,gotvc)
              assert d.get('recordingCount')==rc,(path,d.get('recordingCount'))
              ks=set(d.get('words',{}))
              assert len(ks)==713,(path,len(ks))
              if keyset is None:keyset=ks
              else:assert ks==keyset,(path,'delta key set differs')
          print('STATIC PASS: five consumers current; no stale loader; 713 identical exact-key catalogs; 40,641 delta recordings.')
          PY

      - name: Validate authoritative audit completion
        run: |
          set -euo pipefail
          git fetch origin audit/vocab-coverage-20260821
          git show origin/audit/vocab-coverage-20260821:audit/vocab/results/overall_vocab_voice_completion.json > /tmp/overall.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/overall.json'))
          assert d['status']=='PASS',d
          assert d['vocabulary']['actionable_additions_remaining']==0,d['vocabulary']
          assert d['hosted_voice']['desired_exact_words']==23046,d['hosted_voice']
          assert d['hosted_voice']['effective_missing_exact_words']==0,d['hosted_voice']
          assert d['hosted_voice']['invalid_readings']==0,d['hosted_voice']
          assert d['voice_delta']['exact_delta_words']==713,d['voice_delta']
          assert d['voice_delta']['total_recordings']==40641,d['voice_delta']
          print('AUDIT PASS: actionable=0; exact runtime=23,046; hosted missing=0; invalid readings=0.')
          PY

      - name: Verify current GitHub Pages byte-for-byte
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,time,urllib.request,urllib.parse
          from pathlib import Path
          base='https://kanuli.github.io/japanese-vocab-game/'
          files=[
            'index.html','wordlist.html','wordaudio.html','vocab-plus-game.html','vocabulary-plus.html',
            'grammar.html','listening.html','mocktest.html','pronunciation.html','translator.html','conversation.html',
            'advanced_words.js','data/advanced_vocab.js','data/coverage_deferred_manual.js',
            'data/coverage_sourcecheck_manual.js','data/coverage_postreview_manual.js','wordaudio-delta-voices.js',
            'word-voicevox-delta-catalog.json','word-supertonic3-delta-catalog.json','word-aivis-delta-catalog.json'
          ]
          expected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          last={}
          for attempt in range(60):
              bad=[]
              stamp=str(int(time.time()*1000))
              for p in files:
                  url=base+p+'?final_acceptance='+stamp
                  try:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'jvg-final-acceptance'})
                      with urllib.request.urlopen(req,timeout=30) as r:data=r.read()
                      got=hashlib.sha256(data).hexdigest()
                      if got!=expected[p]:bad.append((p,'sha-mismatch'))
                  except Exception as e:bad.append((p,type(e).__name__))
              last={'attempt':attempt+1,'bad':bad}
              if not bad:
                  print('LIVE PASS: 20/20 files byte-identical to current main.')
                  break
              time.sleep(5)
          else:
              raise SystemExit('LIVE FAIL after retries: '+repr(last))
          PY

      - name: Write final acceptance marker to audit branch
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse HEAD)
          TMP=$(mktemp -d)
          git worktree add "$TMP" origin/audit/vocab-coverage-20260821
          MAIN_SHA="$MAIN_SHA" TMP="$TMP" python - <<'PY'
          import json,os,datetime
          from pathlib import Path
          out={
            'status':'FINAL_ACCEPTANCE_PASS',
            'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'main_commit_verified':os.environ['MAIN_SHA'],
            'reviewed_vocabulary':{'actionable_remaining':0,'runtime_exact_keys':23046},
            'vocabulary_consumers':{'count':5,'advanced_words_cache_version':'20260821v2','stale_unversioned_loaders':0},
            'live_pages_and_runtime':{'files_checked':20,'byte_identical':20},
            'voice_delta':{
              'exact_words':713,
              'voicevox':{'voices':43,'recordings':30659},
              'supertonic3':{'voices':10,'recordings':7130},
              'aivis':{'voices':4,'recordings':2852},
              'total_recordings':40641,
              'missing_exact_words_after_union':0
            },
            'temporary_verifier_cleanup_required':True
          }
          p=Path(os.environ['TMP'])/'audit/vocab/results/final_acceptance_20260821.json'
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(out)
          PY
          cd "$TMP"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- audit/vocab/results/final_acceptance_20260821.json
          if git diff --cached --quiet; then
            echo 'Final acceptance marker already current.'
          else
            git commit -m 'Record final vocabulary acceptance PASS'
            git push origin HEAD:audit/vocab-coverage-20260821
          fi
