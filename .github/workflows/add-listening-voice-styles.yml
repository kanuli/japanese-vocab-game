name: Add and verify listening voice styles

on:
  push:
    paths:
      - 'scripts/patch-listening-voice-styles.py'
      - '.github/workflows/add-listening-voice-styles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply voice style patch
        run: python scripts/patch-listening-voice-styles.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('listening.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(blocks)
          Path('/tmp/listening-inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/listening-inline.js
      - name: Verify voice presets exist
        run: |
          grep -q '💋 成熟性感女聲' listening.html
          grep -q '🌙 低沉柔和女聲' listening.html
          grep -q '💕 親密／耳語風格' listening.html
          grep -q '🌸 可愛女聲' listening.html
          grep -q 'id="voiceStyle"' listening.html
          grep -q 'VOICE_STYLES' listening.html
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.55.0
      - name: Browser smoke test
        run: |
          python3 -m http.server 8000 >/tmp/listening-http.log 2>&1 &
          npx playwright install chromium >/dev/null 2>&1
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/listening.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#voiceStyle');
            const opts=await page.locator('#voiceStyle option').allTextContents();
            for(const required of ['成熟性感女聲','低沉柔和女聲','親密／耳語風格','可愛女聲']){
              if(!opts.some(x=>x.includes(required))) throw new Error('Missing option: '+required);
            }
            if(errors.length) throw new Error('Page JS error: '+errors.join(' | '));
            await browser.close();
          })();
          JS
      - name: Commit verified update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add Japanese listening voice style presets'
          git push
