name: Generate Listening AivisSpeech / Style-Bert-VITS — by level

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.listening-aivis-full-trigger'

permissions:
  contents: write
  id-token: write

env:
  HF_DATASET_REPO: kanuli1983/japanese-listening-voicevox-backup
  RELEASE_TAG: listening-aivis-v1

jobs:
  generate-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact 3,310-sentence Listening catalog
        run: node scripts/build_listening_audio_catalog.mjs
      - name: Validate generator
        run: python -m py_compile scripts/generate_listening_aivis_level.py scripts/build_listening_aivis_index.py
      - name: Install ffmpeg and Hugging Face CLI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --disable-pip-version-check 'huggingface_hub>=1.19,<2'
      - name: Prepare and start official AivisSpeech
        run: |
          mkdir -p "$HOME/.local/share/AivisSpeech-Engine"
          sudo chown -R 1000:1000 "$HOME/.local/share/AivisSpeech-Engine"
          docker pull ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          docker run --rm -d --name aivis-engine -p 127.0.0.1:10101:10101 -v "$HOME/.local/share/AivisSpeech-Engine:/home/user/.local/share/AivisSpeech-Engine-Dev" ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          for i in $(seq 1 300); do curl -fsS http://127.0.0.1:10101/speakers >/dev/null && break; test "$i" != 300 || { docker logs aivis-engine; exit 1; }; sleep 2; done
      - name: Audit model/license before any Listening generation
        run: |
          curl -fsS http://127.0.0.1:10101/aivm_models -o /tmp/aivm.json
          python - <<'PY'
          import json,re
          d=json.load(open('/tmp/aivm.json'));m=next((x for x in d.values() if x.get('is_default_model')),None);assert m
          x=m.get('manifest') or {};lic=str(x.get('license') or '');arch=str(x.get('model_architecture') or '')
          assert 'Style-Bert-VITS2' in arch
          assert any(k in lic.lower() for k in ('acml','aivis common model license','cc0','creative commons zero','パブリックドメイン')), re.sub(r'\s+',' ',lic)[:500]
          print(x.get('name'),x.get('version'),arch);print(re.sub(r'\s+',' ',lic)[:500])
          PY
      - name: Create persistent storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title 'AivisSpeech Listening — Style-Bert-VITS' --notes 'Licensed AivisSpeech / Style-Bert-VITS2 audio for the existing 3,310 Listening sentence set. Generated and uploaded one JLPT level at a time.'

      - name: Generate and publish N5
        env: {LEVEL: N5, MAX_STYLES: '4', OUT_DIR: listening-aivis-out, GH_TOKEN: '${{ github.token }}', HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup, HF_XET_HIGH_PERFORMANCE: '1'}
        run: |
          python scripts/generate_listening_aivis_level.py
          for p in listening-aivis-out/a*-N5.tar; do f=$(basename "$p"); hf upload "$HF_DATASET_REPO" "$p" "listening/aivis/v1/$f" --repo-type dataset --commit-message "Aivis Listening N5 $f"; gh release upload "$RELEASE_TAG" "$p" --clobber; done
      - name: Generate and publish N4
        env: {LEVEL: N4, MAX_STYLES: '4', OUT_DIR: listening-aivis-out, GH_TOKEN: '${{ github.token }}', HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup, HF_XET_HIGH_PERFORMANCE: '1'}
        run: |
          python scripts/generate_listening_aivis_level.py
          for p in listening-aivis-out/a*-N4.tar; do f=$(basename "$p"); hf upload "$HF_DATASET_REPO" "$p" "listening/aivis/v1/$f" --repo-type dataset --commit-message "Aivis Listening N4 $f"; gh release upload "$RELEASE_TAG" "$p" --clobber; done
      - name: Generate and publish N3
        env: {LEVEL: N3, MAX_STYLES: '4', OUT_DIR: listening-aivis-out, GH_TOKEN: '${{ github.token }}', HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup, HF_XET_HIGH_PERFORMANCE: '1'}
        run: |
          python scripts/generate_listening_aivis_level.py
          for p in listening-aivis-out/a*-N3.tar; do f=$(basename "$p"); hf upload "$HF_DATASET_REPO" "$p" "listening/aivis/v1/$f" --repo-type dataset --commit-message "Aivis Listening N3 $f"; gh release upload "$RELEASE_TAG" "$p" --clobber; done
      - name: Generate and publish N2
        env: {LEVEL: N2, MAX_STYLES: '4', OUT_DIR: listening-aivis-out, GH_TOKEN: '${{ github.token }}', HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup, HF_XET_HIGH_PERFORMANCE: '1'}
        run: |
          python scripts/generate_listening_aivis_level.py
          for p in listening-aivis-out/a*-N2.tar; do f=$(basename "$p"); hf upload "$HF_DATASET_REPO" "$p" "listening/aivis/v1/$f" --repo-type dataset --commit-message "Aivis Listening N2 $f"; gh release upload "$RELEASE_TAG" "$p" --clobber; done
      - name: Generate and publish N1
        env: {LEVEL: N1, MAX_STYLES: '4', OUT_DIR: listening-aivis-out, GH_TOKEN: '${{ github.token }}', HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup, HF_XET_HIGH_PERFORMANCE: '1'}
        run: |
          python scripts/generate_listening_aivis_level.py
          for p in listening-aivis-out/a*-N1.tar; do f=$(basename "$p"); hf upload "$HF_DATASET_REPO" "$p" "listening/aivis/v1/$f" --repo-type dataset --commit-message "Aivis Listening N1 $f"; gh release upload "$RELEASE_TAG" "$p" --clobber; done

      - name: Build final Listening Aivis index only after all levels pass
        env:
          MANIFEST_DIR: listening-aivis-out
          GITHUB_REPO: kanuli/japanese-vocab-game
          HF_DATASET_REPO: kanuli1983/japanese-listening-voicevox-backup
          RELEASE_TAG: listening-aivis-v1
        run: |
          cp listening-aivis-out/aivis-model.json listening-aivis-out/aivis-model.json
          python scripts/build_listening_aivis_index.py
          python - <<'PY'
          import json
          d=json.load(open('listening-aivis-index.json'))
          assert d['status']=='ready' and d['questionCount']==3310 and 1<=d['voiceCount']<=4
          assert d['recordingCount']==3310*d['voiceCount']
          PY
      - name: Commit final index
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening-aivis-index.json
          if git diff --cached --quiet; then echo current; else git commit -m 'Publish Listening AivisSpeech index'; git pull --rebase origin main; git push origin main; fi
      - if: always()
        run: docker stop aivis-engine || true
