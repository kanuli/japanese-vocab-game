name: Audit vocabulary pronunciation — VOICEVOX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.word-voicevox-audit-trigger'
      - 'scripts/audit_tts_pronunciation.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        start: [0,9,18,27,36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start official VOICEVOX Engine
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run --rm -d --name voicevox-engine -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            if [ "$i" = 120 ]; then docker logs voicevox-engine || true; exit 1; fi
            sleep 2
          done
      - name: Audit VOICEVOX voice batch
        env:
          START: ${{ matrix.start }}
        run: python scripts/audit_tts_pronunciation.py --engine voicevox --base http://127.0.0.1:50021 --start "$START" --limit 9 --out "voicevox-pronunciation-audit-$START.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voicevox-pronunciation-audit-${{ matrix.start }}
          path: voicevox-pronunciation-audit-${{ matrix.start }}.json
          retention-days: 14
      - if: always()
        run: docker stop voicevox-engine || true
