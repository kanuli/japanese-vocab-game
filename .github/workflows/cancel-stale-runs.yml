name: Cancel stale workflow runs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cancel-stale-runs.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale queued workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for run_id in 32985738882 32985487405 32985427909; do
            echo "Cancelling workflow run ${run_id}"
            http_code="$(curl -sS -o "/tmp/cancel-${run_id}.txt" -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/cancel")"
            cat "/tmp/cancel-${run_id}.txt" || true
            echo
            echo "HTTP ${http_code}"
            if [[ "${http_code}" != "202" && "${http_code}" != "409" ]]; then
              failed=1
            fi
          done
          exit "${failed}"
