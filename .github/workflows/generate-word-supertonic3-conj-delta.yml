name: Generate Word SuperTonic 3 conjugation unique readings - 10 voices

on:
  workflow_dispatch:
    inputs:
      allow_mega_generation:
        description: 'DANGEROUS. Default false. Giant 10-voice x shard matrix is disabled. Use generate-conjugation-chunk.yml.'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.word-supertonic3-conj-trigger'

permissions:
  contents: read

jobs:
  mega-disabled:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.allow_mega_generation != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Giant matrix is disabled
        run: |
          echo 'Giant SuperTonic conjugation generation is disabled.'
          echo 'Use .github/workflows/generate-conjugation-chunk.yml'
          echo 'Do not workflow_dispatch this matrix. Old job history is preserved in git.'
  refuse-mega:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.allow_mega_generation == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mega generation retired
        run: |
          echo 'allow_mega_generation=true is not enough to relaunch 10 voices x 20 shards.'
          echo 'Use generate-conjugation-chunk.yml for small resumable chunks.'
          exit 1
