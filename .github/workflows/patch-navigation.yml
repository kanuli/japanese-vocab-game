name: Publish translator and synchronize navigation
on:
  push:
    paths:
      - '.github/workflows/patch-navigation.yml'
      - '.github/patch-navigation.py'
      - '.github/patch-translator-ui.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate translator and patch navigation
        run: python .github/patch-navigation.py
      - name: Refine translator voice UI
        run: python .github/patch-translator-ui.py
      - name: Commit public page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html wordaudio.html grammar.html listening.html mocktest.html translator.html
          if git diff --cached --quiet; then
            echo "No page changes needed"
          else
            git commit -m "Improve translator voice controls"
            git pull --rebase origin main
            git push origin main
          fi
