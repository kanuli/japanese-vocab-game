name: Fix grammar question quality v2.7

on:
  push:
    branches:
      - fix/grammar-quality-v27
    paths:
      - '.github/workflows/fix-grammar-quality-v27.yml'
      - '.github/scripts/fix_grammar_quality_v27.py'
      - '.github/scripts/audit_grammar_quality_v27.mjs'

permissions:
  contents: write

jobs:
  fix-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Patch grammar game
        run: python3 .github/scripts/fix_grammar_quality_v27.py

      - name: Audit N1-N5 generated questions and answers
        run: node .github/scripts/audit_grammar_quality_v27.mjs

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated grammar update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grammar.html data/grammar_quality_v27_report.txt data/grammar_quality_v27_runtime_report.json
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix grammar question and answer quality v2.7"
          git push

# trigger-v2.7-quality-audit
