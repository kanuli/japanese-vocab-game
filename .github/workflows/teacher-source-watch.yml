name: Japanese teacher authoritative source watch

on:
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * 1'
  push:
    branches: [main]
    paths:
      - 'TEACHER_ROBOT_MAINTENANCE.md'
      - 'teacher-source-watch.json'
      - 'scripts/robot_regression_guard.py'
      - '.github/workflows/teacher-source-watch.yml'

permissions:
  contents: write

concurrency:
  group: japanese-teacher-source-watch
  cancel-in-progress: true

jobs:
  teacher-source-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Run Robot regression guard
        run: python scripts/robot_regression_guard.py

      - name: Check authoritative Japanese-learning sources
        run: |
          python - <<'PY'
          from __future__ import annotations
          import datetime, hashlib, json, re, subprocess
          from html.parser import HTMLParser
          from pathlib import Path

          SIGNATURE_VERSION=2

          class VisibleText(HTMLParser):
              SKIP={'script','style','noscript','template','svg'}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.skip_depth=0
                  self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower() in self.SKIP:
                      self.skip_depth+=1
              def handle_endtag(self,tag):
                  if tag.lower() in self.SKIP and self.skip_depth:
                      self.skip_depth-=1
              def handle_data(self,data):
                  if not self.skip_depth:
                      s=re.sub(r'\s+',' ',data).strip()
                      if s:
                          self.parts.append(s)

          def semantic_signature(body:bytes):
              raw=body.decode('utf-8','replace')
              parser=VisibleText()
              parser.feed(raw)
              # Hash learner-visible/semantic page text instead of volatile scripts,
              # inline JSON, cache tokens, tracking parameters or HTML attributes.
              semantic=re.sub(r'\s+',' ',' '.join(parser.parts)).strip()
              return hashlib.sha256(semantic.encode('utf-8')).hexdigest(),len(semantic)

          cfg=json.load(open('teacher-source-watch.json',encoding='utf-8'))
          old={}
          if Path('teacher-source-status.json').is_file():
              try:
                  prev=json.load(open('teacher-source-status.json',encoding='utf-8'))
                  old={x.get('id'):x for x in prev.get('sources',[]) if x.get('id')}
              except Exception:
                  old={}

          checked=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          out=[]
          for src in cfg['sources']:
              row={k:src[k] for k in ('id','name','url','authority','sections','purpose') if k in src}
              try:
                  p=subprocess.run(
                      ['curl','-fsSL','--compressed','--max-time','30','-A','Mozilla/5.0 JapaneseTeacherRobot/1.0',src['url']],
                      stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False
                  )
                  if p.returncode:
                      raise RuntimeError(p.stderr.decode('utf-8','replace').strip() or f'curl exit {p.returncode}')
                  body=p.stdout
                  sig,semantic_chars=semantic_signature(body)
                  prior_row=old.get(src['id'],{})
                  prior=prior_row.get('sha256')
                  comparable=prior_row.get('signatureVersion')==SIGNATURE_VERSION
                  row.update({
                      'reachable':True,
                      'bytes':len(body),
                      'semanticChars':semantic_chars,
                      'signatureVersion':SIGNATURE_VERSION,
                      'sha256':sig,
                      'changed':bool(comparable and prior and prior!=sig),
                      'error':None,
                  })
              except Exception as e:
                  row.update({
                      'reachable':False,
                      'bytes':0,
                      'semanticChars':0,
                      'signatureVersion':SIGNATURE_VERSION,
                      'sha256':None,
                      'changed':False,
                      'error':str(e)[:500],
                  })
              out.append(row)

          errors=[x['id'] for x in out if not x['reachable']]
          changed_sources=[x['id'] for x in out if x['changed']]
          state='error' if errors else ('review_required' if changed_sources else 'ok')
          status={
              'version':1,
              'signatureVersion':SIGNATURE_VERSION,
              'status':state,
              'checkedAt':checked,
              'sourceCount':len(out),
              'reachableCount':sum(1 for x in out if x['reachable']),
              'changedSources':changed_sources,
              'errors':errors,
              'teacherReviewRequired':bool(changed_sources),
              'policy':'TEACHER_ROBOT_MAINTENANCE.md',
              'sources':out,
          }
          Path('teacher-source-status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:status[k] for k in ('status','signatureVersion','sourceCount','reachableCount','changedSources','errors','teacherReviewRequired')},ensure_ascii=False))
          PY

      - name: Publish source-watch status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teacher-source-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Japanese teacher source watch status"
          git pull --rebase origin main
          git push origin main
