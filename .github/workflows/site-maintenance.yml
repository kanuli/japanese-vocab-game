name: Full-site maintenance and browser smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'conversation-supertonic-index.json'
      - '.site-maintenance-trigger'
      - 'site-health.js'
      - 'generic-voice-test.js'
      - 'page-voice-audition.js'
      - 'result-history.js'

permissions:
  contents: write

concurrency:
  group: daily-site-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Inventory all web pages
        id: inventory
        run: |
          mapfile -t PAGES < <(git ls-files '*.html' | sort)
          test "${#PAGES[@]}" -ge 11
          printf 'Pages under maintenance (%s):\n' "${#PAGES[@]}"
          printf ' - %s\n' "${PAGES[@]}"
          printf '%s\n' "${PAGES[@]}" > /tmp/site-pages.txt
          echo "count=${#PAGES[@]}" >> "$GITHUB_OUTPUT"

      - name: Static HTML, local resource, duplicate-ID and syntax maintenance
        id: static
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import sys
          root=Path('.').resolve(); pages=[Path(x.strip()) for x in Path('/tmp/site-pages.txt').read_text().splitlines() if x.strip()]; failures=[]
          class Scan(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.refs=[]; self.title=False; self.body=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='title': self.title=True
                  if tag=='body': self.body=True
                  if a.get('id'): self.ids.append(a['id'])
                  if tag in {'script','img','audio','video','source','link','iframe'}:
                      k='href' if tag=='link' else 'src'
                      if a.get(k): self.refs.append(a[k])
                  if tag=='a' and a.get('href'): self.refs.append(a['href'])
          for page in pages:
              text=page.read_text(encoding='utf-8'); s=Scan(); s.feed(text)
              if not s.title or not s.body: failures.append(f'{page}: missing title/body')
              if len(text)<300: failures.append(f'{page}: unexpectedly small')
              seen=set(); dup=[]
              for x in s.ids:
                  if x in seen and x not in dup: dup.append(x)
                  seen.add(x)
              if dup: failures.append(f'{page}: duplicate static IDs {dup}')
              if text.count('site-health.js')!=1: failures.append(f'{page}: site-health.js count={text.count("site-health.js")}')
              for raw in s.refs:
                  raw=raw.strip()
                  if not raw or raw.startswith(('#','mailto:','tel:','javascript:','data:','blob:')): continue
                  u=urlsplit(raw)
                  if u.scheme or u.netloc or raw.startswith('//'): continue
                  path=unquote(u.path)
                  if not path: continue
                  target=(page.parent/path).resolve() if not path.startswith('/') else (root/path.lstrip('/')).resolve()
                  try: target.relative_to(root)
                  except ValueError: failures.append(f'{page}: reference escapes repo {raw}'); continue
                  if not target.exists(): failures.append(f'{page}: missing local reference {raw}')
          required=['site-health.js','generic-voice-test.js','page-voice-audition.js','result-history.js','maintenance-playwright-version.txt','conversation.js','conversation-hosted-audio.js','mocktest.js','wordaudio-ai.js','wordaudio-controller.js','wordaudio-data.js','wordaudio-init.js','wordaudio-multivoice.js','wordaudio-player.js','wordaudio-voice.js','wordlist-audio.js','wordlist-voicevox.js','wordlist.js','translator-hosted-voice.js','pronunciation-furigana.js']
          missing=[x for x in required if not Path(x).is_file()]
          if missing: failures.append('Missing core file: '+', '.join(missing))
          if Path('wordaudio.html').read_text(encoding='utf-8').count('wordaudio-multivoice.js?v=20260817v4')!=1:
              failures.append('wordaudio.html: wordaudio-multivoice.js must load exactly once')
          if failures:
              print('\n'.join('FAIL '+x for x in failures),file=sys.stderr); raise SystemExit(1)
          print(f'Static maintenance OK: {len(pages)} pages; resources, IDs and health integration clean.')
          PY
          for f in site-health.js generic-voice-test.js page-voice-audition.js result-history.js conversation.js conversation-hosted-audio.js mocktest.js wordaudio-ai.js wordaudio-controller.js wordaudio-data.js wordaudio-init.js wordaudio-list.js wordaudio-multivoice.js wordaudio-player.js wordaudio-voice.js wordlist-audio.js wordlist-voicevox.js wordlist.js translator-hosted-voice.js pronunciation-furigana.js; do node --check "$f"; done

      - name: Validate full learning databases and hosted conversation audio
        id: data
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'); global.window={};
          for(let i=1;i<=5;i++)vm.runInThisContext(fs.readFileSync(`conversation-data-${i}.js`,'utf8'));
          for(const f of ['conversation-expansion.js','conversation-world-expansion.js'])vm.runInThisContext(fs.readFileSync(f,'utf8'));
          const scenes=window.SITUATION_SCENES||[]; if(scenes.length!==61)throw Error(`scenes ${scenes.length}/61`);
          let groups=0,lines=0; const ids=new Set();
          for(const s of scenes){if(ids.has(s.id))throw Error('duplicate '+s.id);ids.add(s.id);if(!Array.isArray(s.items)||s.items.length!==25)throw Error(`${s.id} groups`);for(const lv of ['N1','N2','N3','N4','N5'])if(s.items.filter(x=>x.level===lv).length!==5)throw Error(`${s.id} ${lv}`);for(const x of s.items){if(!Array.isArray(x.lines)||x.lines.length!==2)throw Error(`${s.id} dialogue`);for(const l of x.lines){if(!l.jp||!l.zh)throw Error(`${s.id} missing text`);lines++;}}groups+=25;}
          if(groups!==1525||lines!==3050)throw Error(`${groups}/${lines}`); console.log('Conversation OK',scenes.length,groups,lines);
          NODE
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');global.window={};vm.runInThisContext(fs.readFileSync('conversation-furigana.js','utf8'));const m=window.CONVERSATION_FURIGANA_META||{};if(m.sceneCount!==61||m.totalLines!==3050||m.uniqueLines!==2677||m.mappedLines!==2677||Object.keys(window.CONVERSATION_FURIGANA||{}).length!==2677)throw Error(JSON.stringify(m));console.log('Furigana OK',m.mappedLines);
          NODE
          python - <<'PY'
          import json
          vv=json.load(open('conversation-voicevox-index.json',encoding='utf-8')); st=json.load(open('conversation-supertonic-index.json',encoding='utf-8'))
          assert (vv['version'],vv['status'],vv['sceneCount'],vv['conversationCount'],vv['sourceLineCount'],vv['utteranceCount'],vv['speakerCount'],vv['recordingCount'])==(2,'ready',61,1525,3050,2677,43,115111)
          assert len(vv['speakers'])==43 and all(len(v['members'])==2677 for v in vv['speakers'].values())
          assert (st['version'],st['status'],st['sceneCount'],st['conversationCount'],st['sourceLineCount'],st['utteranceCount'],st['voiceCount'],st['recordingCount'])==(2,'ready',61,1525,3050,2677,10,26770)
          assert set(st['voices'])=={'F1','F2','F3','F4','F5','M1','M2','M3','M4','M5'} and all(len(v['members'])==2677 for v in st['voices'].values())
          print('Hosted audio OK: VOICEVOX',vv['recordingCount'],'Supertonic',st['recordingCount'])
          PY

      - name: Install Chromium browser test runtime
        id: browser_runtime
        run: |
          PW_VERSION=$(tr -d '[:space:]' < maintenance-playwright-version.txt)
          test -n "$PW_VERSION"
          echo "Using Playwright $PW_VERSION"
          npm init -y >/dev/null 2>&1
          npm install --silent "playwright@$PW_VERSION"
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser smoke test every local HTML page
        id: browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site-http.log 2>&1 & echo $! >/tmp/site-http.pid
          trap 'kill $(cat /tmp/site-http.pid) 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          cat >/tmp/maintenance-smoke.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright'),fs=require('fs');const pages=fs.readFileSync('/tmp/site-pages.txt','utf8').trim().split(/\r?\n/).filter(Boolean);const historyPages=new Set(['index.html','grammar.html','listening.html','mocktest.html']);
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({serviceWorkers:'block'});let failed=false;for(const p of pages){const page=await context.newPage(),errors=[],bad=[];page.on('pageerror',e=>errors.push(String(e)));page.on('response',r=>{if(r.url().startsWith('http://127.0.0.1:4173/')&&r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});try{const res=await page.goto('http://127.0.0.1:4173/'+p+'?maintenance='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});if(!res||res.status()>=400)throw Error('HTTP '+(res?.status()||'none'));await page.waitForTimeout(2600);const s=await page.evaluate(()=>({title:document.title.trim(),text:(document.body?.innerText||'').trim().length,health:!!document.querySelector('#siteHealthBadge'),voiceTest:!!document.querySelector('#genericVoiceTest,#pageSampleVoice,#sampleVoice'),history:!!document.querySelector('#resultHistoryPanel')}));if(!s.title||s.text<20||!s.health)throw Error('invalid DOM/health '+JSON.stringify(s));if(p==='mocktest.html'&&s.voiceTest)throw Error('mocktest must not expose generic voice test');if(p!=='mocktest.html'&&!s.voiceTest)throw Error('missing voice test '+JSON.stringify(s));if(historyPages.has(p)!==s.history)throw Error('result history coverage mismatch '+JSON.stringify(s));if(errors.length)throw Error(errors.join(' | '));if(bad.length)throw Error(bad.join(' | '));console.log('PASS',p,s.title,'voice='+s.voiceTest,'history='+s.history);}catch(e){failed=true;console.error('FAIL',p,e.message);}await page.close();}await browser.close();if(failed)process.exit(1);})();
          NODE
          node /tmp/maintenance-smoke.cjs

      - name: Verify every live GitHub Pages page
        id: live
        run: |
          while IFS= read -r p; do
            code=$(curl -sS -L --max-time 30 -o /tmp/live-page.html -w '%{http_code}' "https://kanuli.github.io/japanese-vocab-game/$p?maintenance=${{ github.run_id }}")
            test "$code" = 200 || { echo "LIVE FAIL $p HTTP $code" >&2; exit 1; }
            grep -qi '<title' /tmp/live-page.html || { echo "LIVE FAIL $p missing title" >&2; exit 1; }
            echo "LIVE PASS $p"
          done < /tmp/site-pages.txt
          curl -fsSL --max-time 30 "https://kanuli.github.io/japanese-vocab-game/conversation-supertonic-index.json?maintenance=${{ github.run_id }}" -o /tmp/live-st.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/live-st.json')); assert (d.get('version'),d.get('voiceCount'),d.get('utteranceCount'),d.get('recordingCount'))==(2,10,2677,26770)
          PY

      - name: Maintenance summary
        if: success()
        run: |
          echo 'FULL-SITE MAINTENANCE PASSED'
          echo 'Conversation: 61 scenes / 1,525 dialogues / 3,050 lines'
          echo 'Furigana: 2,677 / 2,677'
          echo 'VOICEVOX: 43 × 2,677 = 115,111'
          echo 'Supertonic: 10 × 2,677 = 26,770'
          echo 'Voice Test: all 10 non-mock pages covered; mock excluded'
          echo 'Result history: vocab / grammar / listening / mock test covered'
          echo 'HTML pages tested: ${{ steps.inventory.outputs.count }}'

      - name: Publish machine-readable maintenance status
        if: always()
        env:
          OVERALL: ${{ job.status }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          PAGE_COUNT: ${{ steps.inventory.outputs.count }}
        run: |
          python - <<'PY'
          import json,os,datetime
          ok=lambda x:x=='success'
          status={'version':1,'status':'ok' if os.environ['OVERALL']=='success' else 'error','checkedAt':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'runId':int(os.environ['GITHUB_RUN_ID']),'pages':int(os.environ.get('PAGE_COUNT') or 0),'conversation':{'scenes':61,'groups':1525,'lines':3050},'furigana':{'mapped':2677,'unique':2677},'voicevox':{'voices':43,'utterances':2677,'recordings':115111},'supertonic':{'voices':10,'utterances':2677,'recordings':26770},'checks':{'static':ok(os.environ.get('STATIC_OUTCOME')),'browser':ok(os.environ.get('BROWSER_OUTCOME')),'live':ok(os.environ.get('LIVE_OUTCOME'))}}
          open('maintenance-status.json','w',encoding='utf-8').write(json.dumps(status,ensure_ascii=False,indent=2)+'\n');print(json.dumps(status,ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maintenance-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update automated site maintenance status"
          git pull --rebase origin main
          git push origin main
