name: Improve JLPT mock reading listening diversity
on:
  push:
    paths:
      - '.github/scripts/improve_mocktest_diversity.py'
      - '.github/workflows/improve-mocktest-diversity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reading and listening diversity
        run: python .github/scripts/improve_mocktest_diversity.py
      - name: Validate JavaScript
        run: node --check mocktest.js
      - name: Verify diversity controls
        run: |
          grep -q 'function semanticUnique' mocktest.js
          grep -q 'function takeDiverse' mocktest.js
          grep -q 'スポーツセンター利用案内' mocktest.js
          grep -q '市立美術館' mocktest.js
          grep -q '駅前バス時刻表' mocktest.js
          grep -q '予定が変わり' mocktest.js
          grep -q 'mocktest.js?v=20260813-diversity1' mocktest.html
      - name: Commit improvement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mocktest.js mocktest.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Improve JLPT reading and listening diversity'
            git push
          fi
