name: Build expanded JLPT-style Listening catalog

on:
  workflow_dispatch:
  push:
    paths:
      - '.listening-no-repeat-trigger'
      - '.github/workflows/fix-listening-no-repeat.yml'
      - 'scripts/listening_jlpt_style_core.py'
      - 'scripts/test_small_generator.py'

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build original N1-N5 Listening catalog
        run: |
          python -m py_compile scripts/listening_jlpt_style_core.py scripts/test_small_generator.py
          python scripts/test_small_generator.py
      - name: Validate exact 10000 target and Japanese-content uniqueness
        run: |
          python - <<'PY'
          import json,re,urllib.request
          d=json.load(open('listening-original-catalog.json',encoding='utf-8'))
          assert d['combinedTotal']==10000
          assert d['combinedCounts']=={'N5':2000,'N4':2000,'N3':2000,'N2':2000,'N1':2000}
          assert d['originalTotal']==len(d['items'])
          assert len({x['id'] for x in d['items']})==len(d['items'])
          assert all(len(x['choicesZh'])==4 and len(set(x['choicesZh']))==4 and x['correctZh'] in x['choicesZh'] for x in d['items'])
          def norm(s): return re.sub(r'[\s　。、，,.！？!?「」『』（）()：:]','',s)
          keys=[norm(x['jp']) for x in d['items']]
          dup=len(keys)-len(set(keys))
          assert dup==0, f'Original Japanese-content duplicates: {dup}'
          type_labels=set(d['typeLabels'])
          for lv in ['N5','N4','N3','N2','N1']:
              rows=[x for x in d['items'] if x['level']==lv]
              assert set(x['type'] for x in rows)==type_labels
              print(lv,'original',len(rows),'unique',len({norm(x['jp']) for x in rows}),
                    'types',{t:sum(x['type']==t for x in rows) for t in sorted(type_labels)})
          print('CATALOG STRICT PASS:',d['baseTotal'],'existing +',d['originalTotal'],'unique original =',d['combinedTotal'])
          for lv in ['N5','N3','N1']:
              print('\nSAMPLES',lv)
              rows=[x for x in d['items'] if x['level']==lv]
              for x in rows[:5]:
                  print(x['typeZh'],'|',x['jp'],'|',x['choicesZh'],'| ANSWER',x['correctZh'])
          PY
      - name: Commit validated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening-original-catalog.json
          if git diff --cached --quiet; then
            echo 'Catalog already current'
            exit 0
          fi
          git commit -m 'Rebuild 10000-question Listening catalog with unique content'
          git pull --rebase origin main
          git push origin main
