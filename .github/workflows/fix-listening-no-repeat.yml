name: Fix Listening repeated questions

on:
  workflow_dispatch:
  push:
    paths:
      - '.listening-no-repeat-trigger'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Listening no-repeat logic
        run: python scripts/patch-listening-no-repeat.py

      - name: Static JavaScript checks
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('listening.html').read_text(encoding='utf-8')
          assert '日本語聽解挑戰 v1.6' in s
          assert 'function jpKey' in s
          assert 'function uniqueBySentence' in s
          assert 'game.order.shift()' in s
          assert '目前選擇：${p.length.toLocaleString()} 個不重複句子。' in s
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in blocks if x.strip())
          Path('/tmp/listening-inline.js').write_text(inline,encoding='utf-8')
          print('Static no-repeat anchors verified')
          PY
          node --check /tmp/listening-inline.js

      - name: Install Playwright Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Browser regression test — duplicated source sentences never repeat
        run: |
          python -m http.server 8765 >/tmp/listening-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          import json
          import urllib.parse
          from playwright.sync_api import sync_playwright

          unique = [
              '今日は学校で勉強します。','今日は図書館で勉強します。','今日は家で勉強します。',
              '今日は教室で勉強します。','今日は公園で勉強します。','今日は駅で勉強します。',
              '今日は会社で勉強します。','今日は大学で勉強します。','今日は喫茶店で勉強します。',
              '今日はホテルで勉強します。','今日は空港で勉強します。','今日は病院で勉強します。'
          ]
          points=[]
          for i,jp in enumerate(unique):
              points.append({'title':f'測試文法{i}','short_explanation':'time example','long_explanation':'','examples':[{'jp':jp,'en':''}]})
          # Deliberately duplicate source records with different grammar IDs.
          points += [
              {'title':'重複A','short_explanation':'time example','long_explanation':'','examples':[{'jp':unique[0],'en':''}]},
              {'title':'重複B','short_explanation':'time example','long_explanation':'','examples':[{'jp':unique[1],'en':''}]},
              {'title':'重複C','short_explanation':'time example','long_explanation':'','examples':[{'jp':unique[0]+'  ','en':''}]},
          ]

          def grammar_route(route):
              url=route.request.url
              body=points if 'N5_' in url else []
              route.fulfill(status=200,content_type='application/json',body=json.dumps(body,ensure_ascii=False))

          def translation_route(route):
              q=urllib.parse.parse_qs(urllib.parse.urlparse(route.request.url).query).get('q',[''])[0]
              if '昨日' in q: day='昨天'
              elif '明日' in q: day='明天'
              elif '今朝' in q: day='今早'
              else: day='今天'
              text=f'{day}正在進行日語聽解練習。'
              payload={'responseData':{'translatedText':text}}
              route.fulfill(status=200,content_type='application/json',body=json.dumps(payload,ensure_ascii=False))

          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              page=browser.new_page()
              page.route('**/grammar_ja_N*_full_alphabetical_0001.json',grammar_route)
              page.route('https://api.mymemory.translated.net/**',translation_route)
              errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)))
              page.goto('http://127.0.0.1:8765/listening.html',wait_until='domcontentloaded')
              page.wait_for_function("document.querySelector('#start') && !document.querySelector('#start').disabled",timeout=20000)
              for lv in ['#n1','#n2','#n3','#n4']:
                  page.uncheck(lv)
              page.check('#n5')
              page.check('#q10')
              page.check('#showFirst')
              page.click('#start')
              seen=[]
              for i in range(10):
                  page.wait_for_selector('.choice:not([disabled])',timeout=20000)
                  page.locator('.choice').first.click()
                  page.wait_for_selector('#sheet',state='visible',timeout=10000)
                  sentence=page.locator('#aSentence').inner_text().strip()
                  assert sentence not in seen, f'Repeated question detected: {sentence!r}; seen={seen!r}'
                  seen.append(sentence)
                  if i<9:
                      page.click('#next')
              assert len(seen)==10 and len(set(seen))==10, seen
              assert not errors, errors
              print('Browser smoke PASS: 10/10 Japanese questions were unique despite duplicated source records')
              browser.close()
          PY

      - name: Commit verified Listening fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening.html
          if git diff --cached --quiet; then
            echo 'Listening page already contains no-repeat fix'
          else
            git commit -m 'Prevent repeated Listening questions'
            git pull --rebase origin main
            git push origin main
          fi
