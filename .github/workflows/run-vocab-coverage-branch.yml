name: Process reviewed vocabulary coverage branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-vocab-coverage-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-reviewed-vocab-coverage-branch
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/vocab-coverage-20260821
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Traditional Chinese converter
        run: python -m pip install --disable-pip-version-check opencc-python-reimplemented==0.1.7

      - name: Verify reviewed direct-add scope
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('audit/vocab/results/final_quality_review_all_missing.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig', newline='')))
          allowed={'ADD_HIGH_CONFIDENCE','ADD_DISTINCT_VARIANT'}
          direct=[r for r in rows if r.get('quality_decision') in allowed]
          counts={k:sum(r.get('quality_decision')==k for r in direct) for k in sorted(allowed)}
          print({'direct_add_rows':len(direct),'decision_counts':counts})
          if len(direct)!=337:
              raise SystemExit(f'Expected 337 direct-add rows, got {len(direct)}')
          PY

      - name: Materialize direct-reviewed additions
        run: python tools/materialize_coverage_additions.py --results audit/vocab/results --output data/coverage_additions.json

      - name: Check materialization accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('audit/vocab/results/coverage_additions_summary.json').read_text(encoding='utf-8'))
          print(s)
          eligible=int(s.get('eligible_add_rows',-1))
          materialized=int(s.get('materialized_count',-1))
          deferred=int(s.get('deferred_count',-1))
          if eligible!=337:
              raise SystemExit(f'Expected eligible_add_rows=337, got {eligible}')
          if materialized+deferred!=337:
              raise SystemExit(f'Materialization accounting mismatch: {materialized}+{deferred} != 337')
          PY

      - name: Apply exact written-form additions
        run: python tools/apply_coverage_additions.py --bundle data/advanced_vocab.js --additions data/coverage_additions.json

      - name: Validate generated JavaScript
        run: node --check data/advanced_vocab.js

      - name: Validate materialized additions
        run: python tools/validate_coverage_additions.py --bundle data/advanced_vocab.js --additions data/coverage_additions.json --report audit/vocab/results/coverage_additions_validation.json

      - name: Commit processed results to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/advanced_vocab.js data/coverage_additions.json audit/vocab/results/coverage_additions_summary.json audit/vocab/results/coverage_additions_deferred.csv audit/vocab/results/coverage_additions_validation.json
          if git diff --cached --quiet; then
            echo 'No vocabulary changes to commit.'
            exit 0
          fi
          git commit -m 'Materialize reviewed JLPT coverage additions'
          git push origin HEAD:audit/vocab-coverage-20260821
