name: Verify Pronunciation Hosted Audio — 10,000 coverage (manual read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pronunciation-hosted-10000-readonly
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify combined hosted coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(p):
              return json.loads(Path(p).read_text(encoding='utf-8'))
          def qcount(d):
              return int(d.get('questionCount') or d.get('indexed') or len(d.get('questions') or {}))

          new_st=load('pronunciation-supertonic-original-index.json')
          new_vv=load('pronunciation-voicevox-original-index.json')
          old_st=load('listening-supertonic-index.json')
          old_vv=load('voicevox-full-index.json')
          status=load('pronunciation-hosted-status.json')

          assert new_st.get('status')=='ready'
          assert (new_st.get('questionCount'),new_st.get('voiceCount'),new_st.get('recordingCount'))==(6690,10,66900)
          assert set(new_st.get('voices') or {})=={'F1','F2','F3','F4','F5','M1','M2','M3','M4','M5'}
          assert {int(v.get('questionCount',0)) for v in new_st['voices'].values()}=={6690}

          assert new_vv.get('status')=='ready'
          assert (new_vv.get('questionCount'),new_vv.get('speakerCount'),new_vv.get('recordingCount'))==(6690,43,287670)
          assert len(new_vv.get('speakers') or {})==43
          assert {int(v.get('questionCount',0)) for v in new_vv['speakers'].values()}=={6690}

          assert qcount(old_st)+qcount(new_st)==10000
          assert qcount(old_vv)+qcount(new_vv)==10000
          assert status.get('status')=='ready' and status.get('sentenceCount')==10000
          assert status.get('supertonic',{}).get('recordingCount')==100000
          assert status.get('voicevox',{}).get('recordingCount')==430000
          print('PASS: hosted pronunciation coverage is complete and read-only.')
          PY

      - name: Validate pronunciation playback client
        run: |
          node --check pronunciation-reference-audio.js
          grep -q "pronunciation-supertonic-original-index.json" pronunciation-reference-audio.js
          grep -q "pronunciation-voicevox-original-index.json" pronunciation-reference-audio.js
          grep -q "10,000" pronunciation.html
