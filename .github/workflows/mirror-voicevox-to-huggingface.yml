name: Mirror VOICEVOX to Hugging Face

on:
  workflow_run:
    workflows: ["Generate VOICEVOX audio pack"]
    types: [completed]
  push:
    branches: [main]
    paths: [.voicevox-hf-recovery]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Generate VOICEVOX workflow run ID containing the saved pack artifact
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  mirror:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve saved generation run
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            RUN_ID="$(tr -d '[:space:]' < .voicevox-hf-recovery)"
          else
            RUN_ID="${{ inputs.source_run_id }}"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using saved VOICEVOX pack from workflow run $RUN_ID"

      - name: Download saved VOICEVOX pack
        uses: actions/download-artifact@v4
        with:
          name: voicevox-pack-${{ steps.source.outputs.run_id }}
          path: voicevox-pack
          github-token: ${{ github.token }}
          repository: kanuli/japanese-vocab-game
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Validate saved pack and build multi-origin index
        env:
          PACK_DIR: voicevox-pack
          INDEX_OUT: voicevox-release-index.json
          RELEASE_NAMESPACE: voicevox-v1
          RELEASE_MAX_ASSETS: '800'
          HF_DATASET_REPO: kanuli1983/japanese-listening-voicevox-backup
        run: |
          python -m py_compile scripts/build_voicevox_multi_origin_index.py
          test -f voicevox-pack/voicevox-index.json
          COUNT=$(find voicevox-pack/voicevox -type f -name '*.mp3' | wc -l)
          echo "Recovered $COUNT MP3 files from saved artifact"
          test "$COUNT" -gt 0
          python scripts/build_voicevox_multi_origin_index.py
          python - <<'PY'
          import json
          d=json.load(open('voicevox-release-index.json',encoding='utf-8'))
          assert d.get('indexed') == 3310, d.get('indexed')
          assert len(d.get('items') or {}) == 3310
          assert all(len((r.get('urls') or [])) >= 2 for r in d['items'].values())
          print('Built complete 3310-question GitHub + Hugging Face index')
          PY
          rm -rf hf-mirror
          mkdir -p hf-mirror
          cp -a voicevox-pack/voicevox hf-mirror/voicevox
          cp voicevox-release-index.json hf-mirror/voicevox-release-index.json

      - name: Install Hugging Face CLI
        run: python -m pip install --quiet --disable-pip-version-check 'huggingface_hub>=1.19,<2'

      - name: Upload N5 backup
        env:
          HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup
          HF_XET_HIGH_PERFORMANCE: '1'
        run: hf upload kanuli1983/japanese-listening-voicevox-backup hf-mirror/voicevox/N5 voicevox/N5 --repo-type dataset --commit-message "Mirror N5 VOICEVOX from saved GitHub Actions pack"

      - name: Upload N4 backup
        env:
          HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup
          HF_XET_HIGH_PERFORMANCE: '1'
        run: hf upload kanuli1983/japanese-listening-voicevox-backup hf-mirror/voicevox/N4 voicevox/N4 --repo-type dataset --commit-message "Mirror N4 VOICEVOX from saved GitHub Actions pack"

      - name: Upload N3 backup
        env:
          HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup
          HF_XET_HIGH_PERFORMANCE: '1'
        run: hf upload kanuli1983/japanese-listening-voicevox-backup hf-mirror/voicevox/N3 voicevox/N3 --repo-type dataset --commit-message "Mirror N3 VOICEVOX from saved GitHub Actions pack"

      - name: Upload N2 backup
        env:
          HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup
          HF_XET_HIGH_PERFORMANCE: '1'
        run: hf upload kanuli1983/japanese-listening-voicevox-backup hf-mirror/voicevox/N2 voicevox/N2 --repo-type dataset --commit-message "Mirror N2 VOICEVOX from saved GitHub Actions pack"

      - name: Upload N1 backup
        env:
          HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup
          HF_XET_HIGH_PERFORMANCE: '1'
        run: hf upload kanuli1983/japanese-listening-voicevox-backup hf-mirror/voicevox/N1 voicevox/N1 --repo-type dataset --commit-message "Mirror N1 VOICEVOX from saved GitHub Actions pack"

      - name: Upload backup index
        env:
          HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup
        run: hf upload kanuli1983/japanese-listening-voicevox-backup hf-mirror/voicevox-release-index.json voicevox-release-index.json --repo-type dataset --commit-message "Update complete VOICEVOX backup index"

      - name: Verify public Hugging Face fallback
        run: |
          URL=$(python - <<'PY'
          import json
          d=json.load(open('voicevox-release-index.json',encoding='utf-8'))
          print(next(iter(d['items'].values()))['backupUrl'])
          PY
          )
          echo "Checking public backup URL: $URL"
          curl -fsSL --retry 8 --retry-delay 3 --range 0-255 "$URL" -o /tmp/hf-sample.mp3
          test -s /tmp/hf-sample.mp3

      - name: Commit complete multi-origin index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add voicevox-release-index.json
          if git diff --cached --quiet; then
            echo 'Multi-origin index already current'
          else
            git commit -m 'Publish complete VOICEVOX multi-origin index'
            git pull --rebase origin main
            git push origin main
          fi
