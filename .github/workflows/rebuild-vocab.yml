name: Rebuild audited vocabulary data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.teacher-review-rebuild-trigger'
      - tools/build_vocab_bundle.py
      - tools/build_vocab_bundle_exact.py
      - tools/refine_core_ambiguity.py
      - tools/expand_advanced_vocab_stage12.py
      - tools/recalibrate_jlpt_world.py
      - tools/recalibrate_jlpt_world_v2.py
      - tools/recalibrate_jlpt_world_v3.py
      - tools/recalibrate_jlpt_teacher_v4.py
      - tools/teacher_jlpt_policy_v5.py
      - tools/teacher_manual_review.py
      - tools/run_teacher_jlpt_audit.py
      - tools/audit_runtime_supplements.py
      - tools/run_runtime_supplement_audit.py
      - tools/classify_vocab_audit.py
      - tools/check_vocab_sentinels.py
      - tools/export_teacher_review_queue.py
      - advanced_words_curated.js
      - data/coverage_deferred_manual.js
      - data/coverage_sourcecheck_manual.js
      - data/coverage_postreview_manual.js
      - data/vocab_common_fixups.js
      - data/vocab_external_crosscheck.js
      - data/vocab_stage2_external_validation.json
      - data/jlpt_teacher_manual_review.tsv
      - large_vocab_sources.js
      - large_vocab_build.js
      - large_vocab_matchers.js
      - large_vocab_loader.js
      - .github/workflows/rebuild-vocab.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder dependency
        run: pip install opencc-python-reimplemented
      - name: Download structured Traditional Chinese dictionary
        run: |
          curl -L --fail --retry 3 -o /tmp/tomoshi.db.zst https://github.com/tomoshi-app/tomoshi-dict-data/releases/download/v2026-08-12/tomoshi-dict-open.db.zst
          zstd -d -f /tmp/tomoshi.db.zst -o /tmp/tomoshi.db
      - name: Build, refine, expand, teacher-audit and classify generated vocabulary
        env:
          TOMOSHI_DB: /tmp/tomoshi.db
          VOCAB_ADVANCED_TARGET: '22000'
        run: |
          set +e
          python tools/build_vocab_bundle_exact.py
          build_rc=$?
          set -e
          if [ ! -f data/vocab_audit.json ]; then
            echo "Builder failed before producing an audit."
            exit "$build_rc"
          fi
          python tools/refine_core_ambiguity.py
          python tools/expand_advanced_vocab_stage12.py
          python tools/run_teacher_jlpt_audit.py
          python tools/classify_vocab_audit.py
      - name: Verify generated core and advanced teacher audit
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          audit=json.loads(Path('data/vocab_audit.json').read_text(encoding='utf-8'))
          assert audit['fatalIssueCount']==0, audit['fatalIssues']
          assert audit.get('refinementFatalIssueCount',0)==0
          assert audit.get('expansionFatalIssueCount',0)==0
          assert audit['counts']['core']>=10000, audit['counts']
          assert audit['counts']['advanced']>=22000, audit['counts']
          assert audit['counts']['runtimeUnique']>=32000, audit['counts']
          assert audit['counts']['stage1AdvancedAddedVs12500']>=9500, audit['counts']
          assert audit['counts']['stage1SafeCandidatePool']>=22000, audit['counts']
          assert audit['coreAudit']['tomoshiMeaningsApplied']>=10000, audit['coreAudit']
          assert audit['coreAudit']['manualSecondaryCrosscheckApplied']>=46, audit['coreAudit']
          assert audit['coreAudit']['originalMeaningFallback']==0, audit['coreAudit']
          assert audit['counts']['coreMeaningFallbackAfterRefinement']==0, audit['counts']
          assert len(audit.get('coreUnresolvedAll',[]))==0, audit.get('coreUnresolvedAll',[])[:10]
          assert len(audit.get('stage2ExternalValidation',{}).get('reviewSample',[]))>=24
          r=audit.get('jlptRecalibration',{})
          assert r.get('status')=='complete', r
          assert r.get('version')=='20260826-teacher-v5-source-lineage', r
          assert r.get('policyRevision')=='v5-source-lineage', r
          assert 'never counted as independent votes' in r.get('sourceIndependence',''), r
          assert r.get('independentTeacherAnchors',0)>=80, r
          assert r.get('scope')=='every core+advanced runtime word exact key', r
          assert r.get('rowCount',0)>=32000, r
          assert r.get('directRows',0)>=10000, r
          assert r.get('estimatedN1WithoutRarityEvidence')==0, r
          assert r.get('duplicateExactKeys')==0, r
          assert r.get('manualSecondaryExactConfigured',0)>=56, r
          assert r.get('coreDeckExactEvidence',0)>=10000, r
          c=r.get('combinedCountsByLevel',{})
          assert sum(c.values())==r['rowCount'],(c,r['rowCount'])
          assert all(c.get(x,0)>0 for x in ['N1','N2','N3','N4','N5']),c
          assert c.get('N1',999999)<12000,c
          assert c.get('N5',0)>=1800 and c.get('N4',0)>=1500 and c.get('N3',0)>=4000,c
          expected={
            'まい|まい':'N2','まい|舞':'N2','まい|枚':'N5','まい|毎':'N5',
            'すいか|西瓜':'N5','これ|これ':'N5','それ|それ':'N5',
            'おもしろい|面白い':'N5','あかるい|明るい':'N5','おわる|終わる':'N5',
            'べんきょう|勉強':'N5','さんぽ|散歩':'N5','だんだん|だんだん':'N5','もし|もし':'N4',
            'ふん|分':'N5','キロ|キロ':'N5','さらいげつ|再来月':'N5','さらいねん|再来年':'N5',
            'まんなか|真ん中':'N4','つくる|造る':'N5',
            'ぎん|銀':'N5','けいかん|警官':'N5','レコード|レコード':'N3','じしん|地震':'N4',
            'こうちょう|校長':'N5','たて|縦':'N5','じてん|辞典':'N4','つる|釣る':'N4',
            'どろぼう|泥棒':'N4','れいぼう|冷房':'N3','アクセサリー|アクセサリー':'N4','ソフト|ソフト':'N4',
            'がいこう|外交':'N2','きんゆう|金融':'N2','したぎ|下着':'N5','ちり|地理':'N4','ちじ|知事':'N1'
          }
          s=r.get('teacherSentinels',{})
          for key,level in expected.items():
            assert s.get(key,{}).get('level')==level,(key,s.get(key))
          path=Path('data/jlpt_teacher_audit.tsv')
          assert path.exists(), 'missing base teacher audit artifact'
          with path.open(encoding='utf-8',newline='') as f:
            rows=list(csv.DictReader(f,delimiter='\t'))
          assert len(rows)==r['rowCount'],(len(rows),r['rowCount'])
          assert all(x['level'] in {'N1','N2','N3','N4','N5'} for x in rows)
          assert all(x['grade'] in {'A','B','C','D'} for x in rows)
          assert all(x['basis'] for x in rows)
          assert not [x for x in rows if x['level']=='N1' and x['status'].startswith('estimated')]
          print('BASE V5 TEACHER JLPT AUDIT PASS',json.dumps(c,ensure_ascii=False))
          print('rows=',len(rows),'grades=',json.dumps(r.get('teacherGradeCounts',{}),ensure_ascii=False))
          PY
      - name: Extend teacher audit through every additive runtime vocabulary layer
        env:
          TOMOSHI_DB: /tmp/tomoshi.db
        run: python tools/run_runtime_supplement_audit.py
      - name: Verify complete runtime teacher audit
        run: |
          node --check data/vocab_teacher_runtime_overlay.js
          python - <<'PY'
          import csv,json
          from pathlib import Path
          audit=json.loads(Path('data/vocab_audit.json').read_text(encoding='utf-8'))
          base=audit['jlptRecalibration']
          r=audit.get('runtimeTeacherAudit',{})
          assert r.get('status')=='complete',r
          assert r.get('version')=='20260826-teacher-runtime-v2-lineage',r
          assert r.get('policyRevision')=='v5-source-lineage',r
          assert 'never counted as independent votes' in r.get('sourceIndependence',''),r
          assert r.get('rowCount',0)>=base['rowCount'],(r,base['rowCount'])
          assert r.get('supplementConfiguredUniqueKeys',0)>=200,r
          assert r.get('supplementUniqueKeysAddedToAudit',0)>0,r
          assert r.get('estimatedN1')==0,r
          assert r.get('duplicateExactKeys')==0,r
          assert r.get('overlay',{}).get('version')=='20260826-teacher-runtime-v2-lineage',r
          assert r.get('overlay',{}).get('configuredKeys')==r.get('supplementConfiguredUniqueKeys'),r
          path=Path('data/jlpt_teacher_audit.tsv')
          with path.open(encoding='utf-8',newline='') as f:
            rows=list(csv.DictReader(f,delimiter='\t'))
          assert len(rows)==r['rowCount'],(len(rows),r['rowCount'])
          assert len({(x['reading'],x['display']) for x in rows})==len(rows)
          assert not [x for x in rows if x['level']=='N1' and x['status'].startswith('estimated')]
          assert all(x['grade'] in {'A','B','C','D'} and x['basis'] for x in rows)
          print('FULL V5 RUNTIME TEACHER AUDIT PASS',json.dumps(r,ensure_ascii=False))
          PY
      - name: Verify blocking semantic sentinels
        run: python tools/check_vocab_sentinels.py
      - name: Refresh remaining grade-C teacher review queue
        run: |
          python tools/export_teacher_review_queue.py
          python - <<'PY'
          import csv,json
          from pathlib import Path
          meta=json.loads(Path('data/jlpt_teacher_review_queue.json').read_text(encoding='utf-8'))
          with Path('data/jlpt_teacher_review_queue.tsv').open(encoding='utf-8',newline='') as f:
            rows=list(csv.DictReader(f,delimiter='\t'))
          assert meta['status']=='complete',meta
          assert len(rows)==meta['reviewRows'],(len(rows),meta)
          assert all(r['grade']=='C' for r in rows)
          print('TEACHER REVIEW QUEUE PASS',json.dumps(meta,ensure_ascii=False))
          PY
      - name: Commit regenerated teacher-audited vocabulary
        run: |
          if git diff --quiet -- data/advanced_vocab.js data/vocab_core_verified.js data/vocab_audit.json data/jlpt_teacher_audit.tsv data/vocab_teacher_runtime_overlay.js data/jlpt_teacher_review_queue.tsv data/jlpt_teacher_review_queue.json; then
            echo "Vocabulary data and review queue already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/advanced_vocab.js data/vocab_core_verified.js data/vocab_audit.json data/jlpt_teacher_audit.tsv data/vocab_teacher_runtime_overlay.js data/jlpt_teacher_review_queue.tsv data/jlpt_teacher_review_queue.json
          git commit -m "Rebuild v5 source-lineage teacher-audited JLPT data"
          git pull --rebase origin main
          git push
