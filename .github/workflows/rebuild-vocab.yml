name: Rebuild audited vocabulary data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_vocab_bundle.py
      - tools/build_vocab_bundle_exact.py
      - tools/refine_core_ambiguity.py
      - tools/expand_advanced_vocab_stage12.py
      - tools/recalibrate_jlpt_world.py
      - tools/recalibrate_jlpt_world_v2.py
      - tools/recalibrate_jlpt_world_v3.py
      - tools/classify_vocab_audit.py
      - tools/check_vocab_sentinels.py
      - data/vocab_external_crosscheck.js
      - data/vocab_stage2_external_validation.json
      - large_vocab_sources.js
      - large_vocab_build.js
      - large_vocab_matchers.js
      - large_vocab_loader.js
      - .github/workflows/rebuild-vocab.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder dependency
        run: pip install opencc-python-reimplemented
      - name: Download structured Traditional Chinese dictionary
        run: |
          curl -L --fail --retry 3 -o /tmp/tomoshi.db.zst https://github.com/tomoshi-app/tomoshi-dict-data/releases/download/v2026-08-12/tomoshi-dict-open.db.zst
          zstd -d -f /tmp/tomoshi.db.zst -o /tmp/tomoshi.db
      - name: Build, refine, expand, recalibrate and classify all vocabulary data
        env:
          TOMOSHI_DB: /tmp/tomoshi.db
          VOCAB_ADVANCED_TARGET: '22000'
        run: |
          set +e
          python tools/build_vocab_bundle_exact.py
          build_rc=$?
          set -e
          if [ ! -f data/vocab_audit.json ]; then
            echo "Builder failed before producing an audit."
            exit "$build_rc"
          fi
          python tools/refine_core_ambiguity.py
          python tools/expand_advanced_vocab_stage12.py
          python tools/recalibrate_jlpt_world_v3.py
          python tools/classify_vocab_audit.py
      - name: Verify coverage, weighted JLPT consensus and audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('data/vocab_audit.json').read_text(encoding='utf-8'))
          assert audit['fatalIssueCount']==0, audit['fatalIssues']
          assert audit.get('refinementFatalIssueCount',0)==0
          assert audit.get('expansionFatalIssueCount',0)==0
          assert audit['counts']['core']>=10000, audit['counts']
          assert audit['counts']['advanced']>=22000, audit['counts']
          assert audit['counts']['runtimeUnique']>=32000, audit['counts']
          assert audit['counts']['stage1AdvancedAddedVs12500']>=9500, audit['counts']
          assert audit['counts']['stage1SafeCandidatePool']>=22000, audit['counts']
          assert audit['coreAudit']['tomoshiMeaningsApplied']>=10000, audit['coreAudit']
          assert audit['coreAudit']['manualSecondaryCrosscheckApplied']>=46, audit['coreAudit']
          assert audit['coreAudit']['originalMeaningFallback']==0, audit['coreAudit']
          assert audit['counts']['coreMeaningFallbackAfterRefinement']==0, audit['counts']
          assert len(audit.get('coreUnresolvedAll',[]))==0, audit.get('coreUnresolvedAll',[])[:10]
          assert len(audit.get('stage2ExternalValidation',{}).get('reviewSample',[]))>=24
          r=audit.get('jlptRecalibration',{})
          assert r.get('status')=='complete', r
          assert r.get('version')=='20260826-world-v3-weighted-consensus', r
          assert r.get('trainingDirectRows',0)>=7000, r
          assert r.get('estimatedN1WithoutObservedRank')==0, r
          assert r.get('manualSecondaryExactConfigured',0)>=56, r
          assert r.get('coreDeckExactEvidence',0)>=10000, r
          c=r.get('combinedCountsByLevel',{})
          assert sum(c.values())>=32000,c
          assert c.get('N1',999999)<14500,c
          assert c.get('N5',0)>=1800 and c.get('N4',0)>=1500 and c.get('N3',0)>=4000,c
          expected={
            'すいか|西瓜':'N5','これ|これ':'N5','それ|それ':'N5',
            'おもしろい|面白い':'N5','あかるい|明るい':'N5','おわる|終わる':'N5',
            'べんきょう|勉強':'N5','さんぽ|散歩':'N5','だんだん|だんだん':'N5','もし|もし':'N4'
          }
          s=r.get('worldKnowledgeSentinels',{})
          for key,level in expected.items():
            assert s.get(key,{}).get('level')==level,(key,s.get(key))
          print('WEIGHTED JLPT PASS',json.dumps(c,ensure_ascii=False))
          print('overriddenDirect=',r.get('existingDirectLevelsOverridden'))
          print('conflicts=',r.get('weightedEvidenceConflictCount'))
          print('sentinels=',json.dumps(s,ensure_ascii=False))
          PY
      - name: Verify blocking semantic sentinels
        run: python tools/check_vocab_sentinels.py
      - name: Commit regenerated audited vocabulary
        run: |
          if git diff --quiet -- data/advanced_vocab.js data/vocab_core_verified.js data/vocab_audit.json; then
            echo "Vocabulary data already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/advanced_vocab.js data/vocab_core_verified.js data/vocab_audit.json
          git commit -m "Rebuild weighted-consensus JLPT vocabulary data"
          git push