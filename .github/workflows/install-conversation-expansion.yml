name: Install conversation expansion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.conversation-expansion-trigger'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install expansion into page
        run: python .github/patch-conversation-expansion.py
      - name: Validate JavaScript and exact coverage
        run: |
          node --check conversation-expansion.js
          node --check conversation.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.window={};
          for(let i=1;i<=5;i++)vm.runInThisContext(fs.readFileSync(`conversation-data-${i}.js`,'utf8'),{filename:`conversation-data-${i}.js`});
          vm.runInThisContext(fs.readFileSync('conversation-expansion.js','utf8'),{filename:'conversation-expansion.js'});
          const scenes=window.SITUATION_SCENES||[];
          if(scenes.length!==26)throw new Error(`Expected 26 scenes, got ${scenes.length}`);
          let dialogues=0,lines=0;
          for(const s of scenes){
            if(s.items.length!==25)throw new Error(`${s.id}: expected 25 conversations, got ${s.items.length}`);
            for(const lv of ['N1','N2','N3','N4','N5']){
              const n=s.items.filter(x=>x.level===lv).length;
              if(n!==5)throw new Error(`${s.id} ${lv}: expected 5, got ${n}`);
            }
            const keys=new Set();
            for(const x of s.items){
              const key=`${x.level}|${x.situation}`;
              if(keys.has(key))throw new Error(`${s.id}: duplicate situation ${key}`);
              keys.add(key);
              if(!Array.isArray(x.lines)||x.lines.length<2)throw new Error(`${s.id}: invalid lines for ${key}`);
              for(const l of x.lines){if(!l.jp||!l.zh)throw new Error(`${s.id}: missing JP/ZH for ${key}`);lines++}
            }
            dialogues+=s.items.length;
          }
          if(dialogues!==650)throw new Error(`Expected 650 conversations, got ${dialogues}`);
          if(lines!==1300)throw new Error(`Expected 1300 spoken lines, got ${lines}`);
          console.log(`Validated ${scenes.length} scenes / ${dialogues} conversations / ${lines} spoken lines`);
          NODE
          grep -q 'conversation-expansion.js' conversation.html
          grep -q '650 組會話' conversation.html
      - name: Commit page integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conversation.html
          if git diff --cached --quiet; then
            echo 'Expansion already integrated'
          else
            git commit -m 'Expand Situation Conversation to 650 dialogues'
            git pull --rebase origin main
            git push origin main
          fi
