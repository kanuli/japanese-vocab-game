name: Reference database upgrade

on:
  push:
    branches: [main]
    paths:
      - '.reference-database-upgrade-trigger'
      - 'grammar-reference-expansion.js'
      - 'grammar-gap-expansion.js'
      - 'listening-reference-expansion.js'
      - 'listening-gap-expansion.js'
      - 'conversation-reference-expansion.js'
      - 'conversation-gap-expansion.js'
      - 'tools/apply_reference_database_upgrade.py'
      - 'tools/fix_listening_gap_naturalness.py'
      - 'tools/audit_coverage_gaps.py'
      - 'tools/reconcile_coverage_report.py'
      - '.github/scripts/audit_reference_expansion.mjs'
      - 'data/CONTENT_REFERENCE_POLICY.md'
      - 'data/content_reference_map.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix generated Japanese inflections
        run: python tools/fix_listening_gap_naturalness.py
      - name: Apply deterministic integration patch
        run: python tools/apply_reference_database_upgrade.py
      - name: Audit reference expansion
        run: node .github/scripts/audit_reference_expansion.mjs
      - name: Audit cross-database coverage gaps
        run: python tools/audit_coverage_gaps.py
      - name: Reconcile deduplicated listening coverage
        run: python tools/reconcile_coverage_report.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit integrated database upgrade
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grammar.html listening.html conversation.html mocktest.html mocktest.js listening-gap-expansion.js data/reference_upgrade_manifest.json data/reference_expansion_quality_report.json data/coverage_gap_audit.json
          git commit -m 'Apply targeted Japanese coverage gap expansion'
          git push
