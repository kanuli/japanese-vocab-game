name: Reference database upgrade

on:
  push:
    branches: [main]
    paths:
      - '.reference-database-upgrade-trigger'
      - 'grammar-reference-expansion.js'
      - 'grammar-gap-expansion.js'
      - 'listening-reference-expansion.js'
      - 'listening-gap-expansion.js'
      - 'listening-gap-topup.js'
      - 'listening-gap-topup-batch2.js'
      - 'listening-quality-batch3.js'
      - 'conversation-reference-expansion.js'
      - 'conversation-gap-expansion.js'
      - 'conversation-function-topup.js'
      - 'conversation-quality-batch3.js'
      - 'conversation-quality-batch7.js'
      - 'tools/apply_reference_database_upgrade.py'
      - 'tools/apply_quality_depth_batch3.py'
      - 'tools/apply_quality_depth_batch4.py'
      - 'tools/repair_listening_catalog_batch5.py'
      - 'tools/repair_listening_catalog_batch5_v2.py'
      - 'tools/repair_listening_catalog_batch5_v3.py'
      - 'tools/audit_listening_repair_batch5.py'
      - 'tools/analyze_listening_length_batch6.py'
      - 'tools/repair_listening_length_batch6.py'
      - 'tools/audit_listening_completion_batch6.py'
      - 'tools/apply_conversation_quality_batch7.py'
      - '.github/scripts/analyze_full_conversation_batch7.mjs'
      - '.github/scripts/audit_full_conversation_batch7.mjs'
      - '.github/scripts/analyze_grammar_depth_batch8.mjs'
      - 'tools/fix_listening_gap_naturalness.py'
      - 'tools/audit_coverage_gaps.py'
      - 'tools/reconcile_coverage_report.py'
      - 'tools/reconcile_batch2_coverage.py'
      - '.github/scripts/audit_reference_expansion.mjs'
      - '.github/scripts/audit_quality_depth_batch3.mjs'
      - '.github/scripts/audit_full_listening_quality_batch4.mjs'
      - 'data/CONTENT_REFERENCE_POLICY.md'
      - 'data/content_reference_map.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix generated Japanese inflections
        run: python tools/fix_listening_gap_naturalness.py
      - name: Apply deterministic integration patch
        run: python tools/apply_reference_database_upgrade.py
      - name: Apply batch 3 quality-depth integration
        run: python tools/apply_quality_depth_batch3.py
      - name: Apply batch 4 full-listening quality integration
        run: python tools/apply_quality_depth_batch4.py
      - name: Repair batch 5 listening catalog
        run: python tools/repair_listening_catalog_batch5.py
      - name: Repair batch 5 composite answers and template reuse
        run: python tools/repair_listening_catalog_batch5_v2.py
      - name: Finalize batch 5 translated aliases and reuse cap
        run: python tools/repair_listening_catalog_batch5_v3.py
      - name: Analyze Batch 6 answer-length outliers
        run: python tools/analyze_listening_length_batch6.py
      - name: Repair Batch 6 answer-length outliers
        run: python tools/repair_listening_length_batch6.py
      - name: Audit Batch 6 full listening completion
        run: python tools/audit_listening_completion_batch6.py
      - name: Analyze Batch 7 full conversation database
        run: node .github/scripts/analyze_full_conversation_batch7.mjs
      - name: Apply Batch 7 full conversation quality layer
        run: python tools/apply_conversation_quality_batch7.py
      - name: Audit Batch 7 full conversation completion
        run: node .github/scripts/audit_full_conversation_batch7.mjs
      - name: Analyze Batch 8 grammar depth
        run: node .github/scripts/analyze_grammar_depth_batch8.mjs
      - name: Audit batch 5 listening repair
        run: python tools/audit_listening_repair_batch5.py
      - name: Audit reference expansion
        run: node .github/scripts/audit_reference_expansion.mjs
      - name: Audit cross-database coverage gaps
        run: python tools/audit_coverage_gaps.py
      - name: Reconcile deduplicated listening coverage
        run: python tools/reconcile_coverage_report.py
      - name: Reconcile and validate batch 2 coverage
        run: python tools/reconcile_batch2_coverage.py
      - name: Audit batch 3 quality depth
        run: node .github/scripts/audit_quality_depth_batch3.mjs
      - name: Audit full listening quality batch 4
        run: node .github/scripts/audit_full_listening_quality_batch4.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit integrated database upgrade
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grammar.html listening.html conversation.html mocktest.html mocktest.js listening-original-catalog.json listening-gap-expansion.js conversation-quality-batch7.js data/reference_upgrade_manifest.json data/reference_expansion_quality_report.json data/coverage_gap_audit.json data/quality_depth_batch3_report.json data/full_listening_quality_batch4_report.json data/listening_repair_batch5_preflight.json data/listening_repair_batch5_report.json data/listening_length_batch6_preflight.json data/listening_length_batch6_report.json data/listening_completion_batch6_report.json data/full_conversation_batch7_preflight.json data/full_conversation_batch7_report.json data/grammar_depth_batch8_preflight.json
          git commit -m 'Analyze Japanese grammar depth batch 8'
          git push
