name: Vocabulary DB + all 10 voices + website regression

# Production hard gate: one missing vocabulary key, voice index, website loader, or malformed lexical key fails the run.
# final-regression-trigger: canonical-cleanup-20260827-v3
on:
  workflow_dispatch:
  schedule:
    - cron: '35 18 * * *'
  push:
    branches: [main]
    paths:
      - 'data/jlpt_teacher_audit.tsv'
      - 'word-supertonic3-catalog.json'
      - 'word-supertonic3-*-index.json'
      - 'word-supertonic3-delta-catalog.json'
      - 'word-supertonic3-delta-*-index.json'
      - 'word-supertonic3-runtime-delta-catalog.json'
      - 'word-supertonic3-runtime-delta-*-index.json'
      - 'wordaudio-data.js'
      - 'wordaudio-multivoice.js'
      - 'wordaudio-delta-voices.js'
      - 'wordaudio.html'
      - 'wordlist.html'
      - '.github/workflows/vocab-all-voice-site-regression.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate JS syntax and website loader chain
        run: |
          node --check wordaudio-data.js
          node --check wordaudio-multivoice.js
          node --check wordaudio-delta-voices.js
          python - <<'PY'
          from pathlib import Path
          for name in ('wordlist.html','wordaudio.html'):
              s=Path(name).read_text(encoding='utf-8')
              assert s.count('wordaudio-multivoice.js') == 1, (name,'multivoice loader count')
              assert s.count('wordaudio-delta-voices.js') == 1, (name,'delta loader count')
              assert s.index('wordaudio-multivoice.js') < s.index('wordaudio-delta-voices.js'), (name,'loader order')
          js=Path('wordlist.js').read_text(encoding='utf-8')
          for v in ('F1','F2','F3','F4','F5','M1','M2','M3','M4','M5','random'):
              assert v in js, ('missing selectable voice',v)
          print('SITE LOADER + VOICE SELECTOR PASS')
          PY
      - name: Audit the full vocabulary keyspace and every voice index
        run: |
          python - <<'PY'
          import csv,json,re,urllib.request
          from pathlib import Path

          VOICES=('F1','F2','F3','F4','F5','M1','M2','M3','M4','M5')
          CATALOGS=(
            'word-supertonic3-catalog.json',
            'word-supertonic3-delta-catalog.json',
            'word-supertonic3-runtime-delta-catalog.json',
          )
          INLINE_RE=re.compile(r'\[[ぁ-ゖァ-ヺー]+\]')

          def load(p):
              return json.loads(Path(p).read_text(encoding='utf-8'))

          def local_candidate(raw):
              if not raw: return None
              clean=raw.split('?',1)[0]
              if clean.startswith('./'): return clean[2:]
              if not re.match(r'^https?://',clean): return clean
              m=re.search(r'/([^/]+-index\.json)$',clean)
              return m.group(1) if m else None

          def load_voice_index(meta):
              errors=[]
              for raw in (meta.get('indexGithubUrl'),meta.get('indexUrl'),meta.get('indexHfUrl')):
                  if not raw: continue
                  local=local_candidate(raw)
                  if local and Path(local).is_file():
                      return load(local),local
                  if re.match(r'^https?://',raw):
                      try:
                          req=urllib.request.Request(raw,headers={'User-Agent':'vocab-all-voice-regression/1.0'})
                          with urllib.request.urlopen(req,timeout=30) as response:
                              return json.loads(response.read().decode('utf-8')),raw
                      except Exception as exc:
                          errors.append((raw,repr(exc)))
              raise AssertionError(('no usable voice index',errors,meta))

          runtime=[]
          seen=set()
          normalized_seen={}
          malformed=[]
          collisions=[]
          with open('data/jlpt_teacher_audit.tsv',encoding='utf-8',newline='') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                  reading=(r.get('reading') or '').strip()
                  display=(r.get('display') or '').strip() or reading
                  assert reading and display, ('blank lexical key',r)
                  if re.search(r'[\[\]<>\r\n]',reading+display):
                      malformed.append((reading,display))
                  k=reading+'|'+display
                  assert k not in seen, ('duplicate exact key',k)
                  seen.add(k); runtime.append(k)
                  normalized_display=INLINE_RE.sub('',display)
                  nk=reading+'|'+normalized_display
                  previous=normalized_seen.get(nk)
                  if previous and previous!=k:
                      collisions.append((nk,previous,k))
                  else:
                      normalized_seen[nk]=k
          assert len(runtime)>=32000, ('runtime vocabulary unexpectedly small',len(runtime))

          if malformed:
              print('INLINE-READING NORMALIZATION COLLISIONS:',len(collisions))
              for x in collisions[:100]: print('COLLISION',repr(x))
              file_counts=[]
              for p in Path('.').rglob('*'):
                  if not p.is_file() or '.git' in p.parts: continue
                  if p.suffix.lower() not in {'.js','.json','.tsv','.py','.md','.html','.yml','.yaml'}: continue
                  try:
                      if p.stat().st_size>25_000_000: continue
                      text=p.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  n=len(INLINE_RE.findall(text))
                  if n: file_counts.append((n,str(p)))
              for n,p in sorted(file_counts,reverse=True): print('ANNOTATION_FILE',n,p)

          union=set()
          for cp in CATALOGS:
              c=load(cp)
              assert c.get('status')=='ready', (cp,'catalog not ready')
              words=c.get('words') or {}
              assert words, (cp,'no words')
              union.update(words)
              group=c.get('voices') or c.get('speakers') or {}
              missing_voices=[v for v in VOICES if v not in group]
              assert not missing_voices, (cp,'missing voices',missing_voices)
              if 'voiceCount' in c: assert int(c['voiceCount'])==10, (cp,'voiceCount',c.get('voiceCount'))
              if 'recordingCount' in c: assert int(c['recordingCount'])==len(words)*10, (cp,'recordingCount mismatch')

              for v in VOICES:
                  idx,source=load_voice_index(group[v])
                  bundles=idx.get('bundles') or {}
                  miss=[]
                  for key,(wid,shard) in words.items():
                      b=bundles.get(str(shard)) or {}
                      if wid not in (b.get('members') or {}):
                          miss.append(key)
                          if len(miss)>=10: break
                  assert not miss, (cp,v,'catalog/index coverage gap',source,miss)
                  if 'wordCount' in idx: assert int(idx['wordCount'])==len(words), (cp,v,'index wordCount mismatch',source)
              print(cp,':',len(words),'words x 10 voices PASS')

          missing=set(runtime)-union
          assert not missing, ('CURRENT WEBSITE VOCAB WITHOUT SUPERTONIC AUDIO',len(missing),sorted(missing)[:30])
          print('FULL VOCAB KEYSPACE:',len(runtime),'exact keys')
          print('ALL CURRENT VOCAB COVERED BY BASE + DELTA + RUNTIME DELTA')
          print('ALL 10 VOICES F1-F5/M1-M5 INDEXED FOR EVERY CATALOG WORD')
          if malformed:
              print('MALFORMED LEXICAL KEYS:',len(malformed))
              for pair in malformed[:200]: print('MALFORMED',repr(pair[0]),repr(pair[1]))
          assert not collisions, ('INLINE-READING NORMALIZATION WOULD COLLIDE',len(collisions),collisions[:30])
          assert not malformed, ('MALFORMED LEXICAL KEYS',len(malformed),malformed[:30])
          print('LEXICAL KEY FORMAT PASS')
          PY
