name: Add grammar end-of-game review

on:
  push:
    paths:
      - '.github/workflows/patch-review-v25.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch grammar review
        run: python3 .github/scripts/patch_review_v25.py
      - name: Commit grammar update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grammar.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add end-of-game grammar review"
          git push

# trigger v2.5
