# Trigger revision 3: calculate same-reading reuse before any heavy audio synthesis.
name: Reviewed vocabulary audio reuse plan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-reviewed-word-audio-smoke.yml'

permissions:
  contents: write

jobs:
  reuse-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/vocab-coverage-20260821
          fetch-depth: 0
      - name: Validate delta source and build same-reading reuse plan
        env:
          CATALOG_OUT: audit/vocab/results/desired_word_voice_catalog.json
        run: |
          node scripts/build_word_voicevox_catalog.mjs
          python tools/audit_vocab_voice_coverage.py --results audit/vocab/results
          python scripts/build_word_audio_delta_catalog.py
          python scripts/build_word_audio_reuse_plan.py
          python - <<'PY'
          import json
          d=json.load(open('audit/vocab/results/voice_delta_reuse_plan.json',encoding='utf-8'))
          assert d['status']=='PASS' and d['reviewed_exact_keys']==713
          assert d['reuse_base_reading_count']+d['synthesis_required_exact_keys']==713
          print({k:v for k,v in d.items() if k not in ('reuse','synthesis_keys')})
          PY
      - name: Commit reuse plan to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- audit/vocab/results/voice_delta_reuse_plan.json word-audio-synthesis-delta-catalog.json
          git commit -m 'Plan same-reading reuse for reviewed vocabulary audio'
          git pull --rebase origin audit/vocab-coverage-20260821
          git push origin HEAD:audit/vocab-coverage-20260821
