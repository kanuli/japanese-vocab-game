name: Trigger conjugation v1 merge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-conjugation-v1-merge-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v1 status merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run merge-conjugation-status.yml --repo "$GH_REPO" --ref main -f inventory_version=v1

# Final rerun after SuperTonic M2 chunk106 durable repair.
