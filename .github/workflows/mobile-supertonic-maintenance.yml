name: Mobile hosted audio maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'
  push:
    branches: [main]
    paths:
      - 'mobile-supertonic-guard.js'
      - 'generic-voice-test.js'
      - 'site-health.js'
      - 'page-voice-audition.js'
      - 'wordaudio-multivoice.js'
      - 'wordlist-voicevox.js'
      - 'listening-supertonic-hosted.js'
      - 'conversation-hosted-audio.js'
      - 'translator-hosted-voice.js'
      - 'index.html'
      - 'grammar.html'
      - 'wordaudio.html'
      - 'wordlist.html'
      - 'listening.html'
      - 'conversation.html'
      - 'pronunciation.html'
      - 'translator.html'
      - 'vocab-plus-game.html'
      - 'vocabulary-plus.html'
      - 'mocktest.html'
      - '.github/mobile-hosted-audio-test.cjs'
      - '.mobile-hosted-playback-trigger'
      - '.mobile-supertonic-safety-trigger'

permissions:
  contents: write

concurrency:
  group: mobile-hosted-audio-maintenance
  cancel-in-progress: true

jobs:
  mobile-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Static hosted-audio validation
        run: |
          node --check mobile-supertonic-guard.js
          node --check generic-voice-test.js
          node --check page-voice-audition.js
          node --check site-health.js
          node --check wordaudio-multivoice.js
          node --check wordlist-voicevox.js
          node --check listening-supertonic-hosted.js
          node --check conversation-hosted-audio.js
          node --check translator-hosted-voice.js
          node --check .github/mobile-hosted-audio-test.cjs
          python - <<'PY'
          import json
          from pathlib import Path
          guarded=['index.html','grammar.html','wordaudio.html','wordlist.html','listening.html','conversation.html','pronunciation.html','translator.html','vocab-plus-game.html','vocabulary-plus.html']
          for p in guarded:
              s=Path(p).read_text(encoding='utf-8')
              assert s.count('mobile-supertonic-guard.js')==1, (p,'mobile guard')
              assert 'mobile-supertonic-guard.js?v=20260817v4' in s, (p,'stale mobile guard cache key')
          sh=Path('site-health.js').read_text(encoding='utf-8')
          for p in ['index.html','grammar.html','wordaudio.html','vocab-plus-game.html','vocabulary-plus.html']:
              assert p in sh, (p,'generic voice loader missing')
          assert 'mocktest.html' not in sh.split('function loadGenericVoiceTest',1)[1].split('function loadResultHistory',1)[0], 'mocktest must be excluded from generic voice test'
          assert Path('wordaudio.html').read_text(encoding='utf-8').count('wordaudio-multivoice.js?v=20260827v2')==1
          vv=json.load(open('word-voicevox-catalog.json',encoding='utf-8'))
          st=json.load(open('word-supertonic3-catalog.json',encoding='utf-8'))
          assert vv['status']=='ready' and vv['speakerCount']==43 and vv['wordCount']>22000 and vv['recordingCount']>900000
          assert st['status']=='ready' and st['voiceCount']==10 and st['wordCount']>22000 and st['recordingCount']>220000
          guard=Path('mobile-supertonic-guard.js').read_text(encoding='utf-8')
          for token in ['unlockHostedAudio','playHostedBytes','playSharedUrl','AudioContext']:
              assert token in guard, token
          for f in ['generic-voice-test.js','wordaudio-multivoice.js','listening-supertonic-hosted.js','conversation-hosted-audio.js','translator-hosted-voice.js']:
              assert 'playHostedBytes' in Path(f).read_text(encoding='utf-8'), f
          assert 'playSharedUrl' in Path('listening.html').read_text(encoding='utf-8')
          print('Static hosted-audio validation PASS')
          print('VOICEVOX',vv['speakerCount'],vv['wordCount'],vv['recordingCount'])
          print('Supertonic',st['voiceCount'],st['wordCount'],st['recordingCount'])
          PY

      - name: Install WebKit mobile browser runtime
        run: |
          PW_VERSION=$(tr -d '[:space:]' < maintenance-playwright-version.txt)
          npm init -y >/dev/null 2>&1
          npm install --silent "playwright@$PW_VERSION"
          npx playwright install --with-deps webkit >/dev/null

      - name: Real iPhone-WebKit hosted audio test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mobile-http.log 2>&1 &
          echo $! >/tmp/mobile-http.pid
          trap 'kill $(cat /tmp/mobile-http.pid) 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/wordaudio.html >/dev/null && break; sleep 1; done
          node .github/mobile-hosted-audio-test.cjs

      - name: Mobile hosted audio summary
        run: |
          echo 'MOBILE HOSTED AUDIO PASSED'
          echo 'iPhone/WebKit: real button tap unlock verified'
          echo 'VOICEVOX: real catalog -> index -> Range bytes -> shared player verified'
          echo 'Supertonic: real catalog -> index -> Range bytes -> shared player verified'
          echo 'Generic Voice Test: every non-mock page group covered; real playback verified'
          echo 'Mock Test: generic Voice Test exclusion verified'
          echo 'Local 400 MB Supertonic remains disabled only on mobile'

      - name: Publish observable mobile hosted-audio status
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          out={
            'version':2,
            'status':os.environ.get('RESULT','unknown'),
            'checkedAt':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'runId':os.environ.get('GITHUB_RUN_ID'),
            'headSha':os.environ.get('GITHUB_SHA'),
            'target':'mobile hosted audio stack',
            'checks':['static-hosted-audio','iphone-webkit-unlock','voicevox-range-playback','supertonic-range-playback','generic-voice-test','mocktest-exclusion'],
            'expected':{'voicevoxSpeakers':43,'supertonicVoices':10,'mobileLocalSupertonicDisabled':True}
          }
          p=Path('.mobile-hosted-audio-diagnostic.json')
          if p.is_file():
            try: out['diagnostic']=json.loads(p.read_text(encoding='utf-8'))
            except Exception as e: out['diagnostic']={'status':'unreadable','error':str(e)}
          Path('mobile-hosted-audio-status.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-hosted-audio-status.json
          git commit -m 'Update mobile hosted audio health status' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
