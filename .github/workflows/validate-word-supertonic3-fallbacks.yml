name: Validate vocabulary Supertonic 3 fallbacks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.word-supertonic3-fallback-trigger'
      - '.github/patch-word-supertonic3-fallbacks.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch vocabulary fallbacks only
        run: python .github/patch-word-supertonic3-fallbacks.py
      - name: Validate fallback quality and caches
        run: |
          node --check wordaudio-ai.js
          node --check wordlist-audio.js
          python - <<'PY'
          from pathlib import Path
          wa=Path('wordaudio-ai.js').read_text(encoding='utf-8')
          wl=Path('wordlist-audio.js').read_text(encoding='utf-8')
          wav=Path('wordaudio-voice.js').read_text(encoding='utf-8')
          wah=Path('wordaudio.html').read_text(encoding='utf-8')
          wlh=Path('wordlist.html').read_text(encoding='utf-8')
          assert 'totalSteps:5' not in wa and 'totalSteps:5' not in wl
          assert 'totalSteps:8' in wa and 'totalSteps:8' in wl
          assert 'wordaudio-ai.js?v=20260815v3' in wav
          assert 'wordaudio-voice.js?v=5' in wah and 'wordaudio-multivoice.js?v=20260815v2' in wah
          assert 'wordlist-audio.js?v=5' in wlh
          for x in (wa,wl,wah,wlh): assert '127.0.0.1' not in x
          print('Vocabulary fallback validation passed.')
          PY
      - name: Ensure mock test is untouched
        run: |
          if git diff --name-only | grep -Fx 'mocktest.html'; then exit 1; fi
      - name: Commit fallback changes
        run: |
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wordaudio-voice.js wordaudio.html wordlist-audio.js wordlist.html
          if git diff --cached --quiet; then echo current; else git commit -m 'Standardize vocabulary Supertonic 3 fallback quality'; git pull --rebase origin main; git push origin main; fi
