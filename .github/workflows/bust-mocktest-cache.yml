name: Refresh JLPT mock test cache

on:
  push:
    paths:
      - '.github/workflows/bust-mocktest-cache.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cache-busting version to mock test script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('mocktest.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'<script src="\./mocktest\.js(?:\?[^\"]*)?"></script>', '<script src="./mocktest.js?v=20260813-startfix2"></script>', s, count=1)
          if n!=1:
              raise SystemExit('mocktest script tag not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: grep -q 'mocktest.js?v=20260813-startfix2' mocktest.html
      - name: Commit cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mocktest.html
          git commit -m "Refresh JLPT mock test browser cache"
          git push
