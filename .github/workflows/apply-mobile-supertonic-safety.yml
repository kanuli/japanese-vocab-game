# Temporary registered-runner entry for reviewed vocabulary hosted-audio completion.
# Trigger revision 5: marker commits do not rebase over generated unstaged audit files.
name: Reviewed vocabulary audio preflight — registered runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-mobile-supertonic-safety.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: reviewed-vocabulary-audio-preflight-registered
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/vocab-coverage-20260821
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record preflight start
        run: |
          python - <<'PY'
          import json,datetime,os
          from pathlib import Path
          Path('audit/vocab/results/voice_delta_preflight_started.json').write_text(json.dumps({
            'status':'STARTED','run_id':os.environ.get('GITHUB_RUN_ID'),'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'started_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- audit/vocab/results/voice_delta_preflight_started.json
          git commit -m 'Record reviewed audio preflight start' || true
          git push origin HEAD:audit/vocab-coverage-20260821

      - id: catalog
        name: 1/5 Validate exact 713-word delta source
        continue-on-error: true
        timeout-minutes: 8
        env:
          CATALOG_OUT: audit/vocab/results/desired_word_voice_catalog.json
        run: |
          node scripts/build_word_voicevox_catalog.mjs
          python tools/audit_vocab_voice_coverage.py --results audit/vocab/results
          python scripts/build_word_audio_delta_catalog.py
          python - <<'PY'
          import json
          d=json.load(open('word-audio-delta-catalog.json',encoding='utf-8'))
          assert d['wordCount']==713 and len(d['items'])==713
          assert d.get('missingSetEqualsReviewedAdditions') is True
          print('sample',d['items'][0]['key'])
          PY

      - name: Record 1/5 Catalog outcome
        if: always()
        env:
          OUTCOME: ${{ steps.catalog.outcome }}
        run: |
          OUTCOME="$OUTCOME" NAME=catalog python - <<'PY'
          import json,datetime,os
          from pathlib import Path
          out={'check':os.environ['NAME'],'outcome':os.environ['OUTCOME'],'run_id':os.environ.get('GITHUB_RUN_ID'),'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
            d=json.load(open('word-audio-delta-catalog.json',encoding='utf-8'));out['delta_word_count']=d.get('wordCount');out['sample_key']=(d.get('items') or [{}])[0].get('key')
          except Exception as e:out['detail']=str(e)
          Path('audit/vocab/results/voice_delta_check_catalog.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git add -- audit/vocab/results/voice_delta_check_catalog.json
          git commit -m 'Record reviewed audio catalog check' || true
          git push origin HEAD:audit/vocab-coverage-20260821

      - id: permission
        name: 2/5 Verify GitHub write and release permission
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY --jq '.permissions.push')" = true
          gh release list --limit 1 >/dev/null
          echo 'GitHub write/release permission OK'

      - name: Record 2/5 Permission outcome
        if: always()
        env:
          OUTCOME: ${{ steps.permission.outcome }}
        run: |
          OUTCOME="$OUTCOME" NAME=permission python - <<'PY'
          import json,datetime,os
          from pathlib import Path
          Path('audit/vocab/results/voice_delta_check_permission.json').write_text(json.dumps({'check':os.environ['NAME'],'outcome':os.environ['OUTCOME'],'run_id':os.environ.get('GITHUB_RUN_ID'),'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git add -- audit/vocab/results/voice_delta_check_permission.json
          git commit -m 'Record reviewed audio permission check' || true
          git push origin HEAD:audit/vocab-coverage-20260821

      - id: voicevox
        name: 3/5 Synthesize one reviewed word with VOICEVOX
        if: always() && steps.catalog.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run --rm -d --name voicevox-preflight -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:50021/version >/dev/null && break; test "$i" != 120 || { docker logs voicevox-preflight; exit 1; }; sleep 2; done
          READING=$(python -c "import json;print(json.load(open('word-audio-delta-catalog.json'))['items'][0]['reading'])")
          STYLE=$(curl -fsS http://127.0.0.1:50021/speakers | python -c "import json,sys;d=json.load(sys.stdin);print(d[0]['styles'][0]['id'])")
          curl -fsS -X POST --get --data-urlencode "text=$READING" --data-urlencode "speaker=$STYLE" http://127.0.0.1:50021/audio_query -o /tmp/vv-query.json
          curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @/tmp/vv-query.json "http://127.0.0.1:50021/synthesis?speaker=$STYLE" -o /tmp/vv.wav
          test "$(stat -c%s /tmp/vv.wav)" -gt 1000
          echo "VOICEVOX sample OK: $READING"

      - if: always()
        run: docker stop voicevox-preflight >/dev/null 2>&1 || true

      - name: Record 3/5 VOICEVOX outcome
        if: always()
        env:
          OUTCOME: ${{ steps.voicevox.outcome }}
        run: |
          OUTCOME="$OUTCOME" NAME=voicevox python - <<'PY'
          import json,datetime,os
          from pathlib import Path
          Path('audit/vocab/results/voice_delta_check_voicevox.json').write_text(json.dumps({'check':os.environ['NAME'],'outcome':os.environ['OUTCOME'],'run_id':os.environ.get('GITHUB_RUN_ID'),'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git add -- audit/vocab/results/voice_delta_check_voicevox.json
          git commit -m 'Record reviewed audio VOICEVOX check' || true
          git push origin HEAD:audit/vocab-coverage-20260821

      - id: supertonic
        name: 4/5 Synthesize one reviewed word with Supertonic 3
        if: always() && steps.catalog.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python -m pip install --quiet --disable-pip-version-check 'supertonic==1.2.2'
          python - <<'PY'
          import json
          from supertonic import TTS
          reading=json.load(open('word-audio-delta-catalog.json'))['items'][0]['reading']
          t=TTS(auto_download=True);style=t.get_voice_style(voice_name='F3')
          wav,_=t.synthesize(text=reading,voice_style=style,total_steps=8,speed=1.0,max_chunk_length=100,silence_duration=.08,lang='ja',verbose=False)
          size=getattr(wav,'size',0)
          if wav is None or size<=0:raise SystemExit('empty Supertonic output')
          print('Supertonic sample OK:',reading,size)
          PY

      - name: Record 4/5 Supertonic outcome
        if: always()
        env:
          OUTCOME: ${{ steps.supertonic.outcome }}
        run: |
          OUTCOME="$OUTCOME" NAME=supertonic python - <<'PY'
          import json,datetime,os
          from pathlib import Path
          Path('audit/vocab/results/voice_delta_check_supertonic.json').write_text(json.dumps({'check':os.environ['NAME'],'outcome':os.environ['OUTCOME'],'run_id':os.environ.get('GITHUB_RUN_ID'),'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git add -- audit/vocab/results/voice_delta_check_supertonic.json
          git commit -m 'Record reviewed audio Supertonic check' || true
          git push origin HEAD:audit/vocab-coverage-20260821

      - id: aivis
        name: 5/5 Discover four Aivis styles and synthesize one reviewed word
        if: always() && steps.catalog.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          mkdir -p "$HOME/.local/share/AivisSpeech-Engine" && sudo chown -R 1000:1000 "$HOME/.local/share/AivisSpeech-Engine"
          docker pull ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          docker run --rm -d --name aivis-preflight -p 127.0.0.1:10101:10101 -v "$HOME/.local/share/AivisSpeech-Engine:/home/user/.local/share/AivisSpeech-Engine-Dev" ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          for i in $(seq 1 300); do curl -fsS http://127.0.0.1:10101/speakers >/dev/null && break; test "$i" != 300 || { docker logs aivis-preflight; exit 1; }; sleep 2; done
          MAX_STYLES=4 OUT=/tmp/aivis-model.json python scripts/discover_aivis_model.py
          python - <<'PY'
          import json,urllib.parse,urllib.request
          model=json.load(open('/tmp/aivis-model.json'));assert len(model['styles'])==4,len(model['styles'])
          reading=json.load(open('word-audio-delta-catalog.json'))['items'][0]['reading'];sid=model['styles'][0]['styleId']
          q=urllib.parse.urlencode({'text':reading,'speaker':sid})
          with urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:10101/audio_query?'+q,data=b'',method='POST'),timeout=240) as r:query=json.loads(r.read().decode())
          body=json.dumps(query,ensure_ascii=False).encode();url='http://127.0.0.1:10101/synthesis?'+urllib.parse.urlencode({'speaker':sid})
          with urllib.request.urlopen(urllib.request.Request(url,data=body,method='POST',headers={'Content-Type':'application/json'}),timeout=300) as r:wav=r.read()
          assert len(wav)>1000,len(wav)
          print('Aivis sample OK:',reading,'styles',len(model['styles']))
          PY

      - if: always()
        run: docker stop aivis-preflight >/dev/null 2>&1 || true

      - name: Record 5/5 Aivis outcome
        if: always()
        env:
          OUTCOME: ${{ steps.aivis.outcome }}
        run: |
          OUTCOME="$OUTCOME" NAME=aivis python - <<'PY'
          import json,datetime,os
          from pathlib import Path
          Path('audit/vocab/results/voice_delta_check_aivis.json').write_text(json.dumps({'check':os.environ['NAME'],'outcome':os.environ['OUTCOME'],'run_id':os.environ.get('GITHUB_RUN_ID'),'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git add -- audit/vocab/results/voice_delta_check_aivis.json
          git commit -m 'Record reviewed audio Aivis check' || true
          git push origin HEAD:audit/vocab-coverage-20260821

      - name: Record all preflight outcomes
        if: always()
        env:
          CATALOG: ${{ steps.catalog.outcome }}
          PERMISSION: ${{ steps.permission.outcome }}
          VOICEVOX: ${{ steps.voicevox.outcome }}
          SUPERTONIC: ${{ steps.supertonic.outcome }}
          AIVIS: ${{ steps.aivis.outcome }}
        run: |
          python - <<'PY'
          import json,os,datetime
          from pathlib import Path
          checks={k:os.environ[k] for k in ('CATALOG','PERMISSION','VOICEVOX','SUPERTONIC','AIVIS')}
          out={'status':'PASS' if all(v=='success' for v in checks.values()) else 'FAIL','checks':checks,'run_id':os.environ.get('GITHUB_RUN_ID'),'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
            d=json.load(open('word-audio-delta-catalog.json'));out['delta_word_count']=d.get('wordCount');out['sample_key']=(d.get('items') or [{}])[0].get('key')
          except Exception as e:out['catalog_read_error']=str(e)
          Path('audit/vocab/results/voice_delta_preflight.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(out)
          PY
          git add -- audit/vocab/results/voice_delta_preflight.json
          git commit -m 'Record reviewed vocabulary audio delta preflight' || true
          git push origin HEAD:audit/vocab-coverage-20260821

      - name: Enforce all five checks
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('audit/vocab/results/voice_delta_preflight.json',encoding='utf-8'))
          if d.get('status')!='PASS':raise SystemExit('Voice delta preflight failed: '+json.dumps(d,ensure_ascii=False))
          print('Voice delta preflight PASS')
          PY
