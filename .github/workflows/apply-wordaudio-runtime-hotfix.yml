name: Apply wordaudio runtime hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.wordaudio-runtime-hotfix-trigger'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate JavaScript syntax
        run: |
          node --check wordaudio-data.js
          node --check wordaudio-multivoice.js
      - name: Update cache keys and remove duplicate multivoice loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('wordlist.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('wordaudio-data.js?v=20260825v2','wordaudio-data.js?v=20260827v3')
          s=s.replace('wordaudio-multivoice.js?v=20260827v1','wordaudio-multivoice.js?v=20260827v2')
          p.write_text(s,encoding='utf-8')
          p=Path('wordaudio.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('wordaudio-data.js?v=20260825v2','wordaudio-data.js?v=20260827v3')
          s=s.replace('<script src="./wordaudio-multivoice.js?v=20260815v1"></script>\n','')
          s=s.replace('wordaudio-multivoice.js?v=20260817v4','wordaudio-multivoice.js?v=20260827v2')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Assert one multivoice loader and current cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('wordlist.html','wordaudio.html'):
              s=Path(name).read_text(encoding='utf-8')
              assert 'wordaudio-data.js?v=20260827v3' in s, name
              assert s.count('wordaudio-multivoice.js') == 1, (name,s.count('wordaudio-multivoice.js'))
              assert 'wordaudio-multivoice.js?v=20260827v2' in s, name
          print('cache/load regression PASS')
          PY
      - name: Commit page cache/load fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wordlist.html wordaudio.html
          if git diff --cached --quiet; then echo current; else git commit -m 'Publish word audio playback hotfix'; git pull --rebase origin main; git push origin main; fi
