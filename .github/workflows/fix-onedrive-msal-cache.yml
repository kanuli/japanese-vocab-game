name: Fix OneDrive MSAL cache recovery

on:
  push:
    paths:
      - '.github/workflows/fix-onedrive-msal-cache.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch MSAL recovery
        run: python scripts/fix-onedrive-msal-cache.py

      - name: Validate recovery source
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/listening-onedrive-entry.js').read_text(encoding='utf-8')
          required=[
              "ACCOUNT_HINT_KEY='jplistening_onedrive_login_hint'",
              'isLostRequestCacheError',
              'clearStaleAuthResponse',
              'recoverSilentSession',
              'a.ssoSilent({scopes:c.scopes,loginHint:hint})',
              "e.code='onedrive_reconnect_required'",
              "code==='no_account_error'",
              "c==='no_token_request_cache_error'"
          ]
          for x in required:
              assert x in s, x
          assert 'acquireTokenPopup' not in s
          print('MSAL cache recovery source checks: OK')
          PY

      - name: Rebuild OneDrive browser client
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --save-dev @azure/msal-browser@5.17.3 fflate@0.8.2 esbuild@0.25.9
          npx esbuild src/listening-onedrive-entry.js --bundle --format=esm --platform=browser --target=es2020 --minify --outfile=vendor/onedrive-voicevox.js
          node --check vendor/onedrive-voicevox.js

      - name: Verify Listening page syntax and automatic UI
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          h=Path('listening.html').read_text(encoding='utf-8')
          assert 'id="engineVoicevox" name="audioEngine" type="radio" value="voicevox" checked' in h
          assert 'id="voicevoxSettings"' in h
          assert 'VOICEVOX 已準備：OneDrive 已自動連接' in h
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          Path('/tmp/listening-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/listening-inline.js

      - name: Install browser tester
        run: |
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser smoke test
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cat > test-msal-page.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/listening.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.OneDriveVoicevox&&document.querySelector('#onedriveStatus')?.textContent!=='正在自動連接 OneDrive…',{timeout:30000});
            if(!(await page.isChecked('#engineVoicevox'))) throw new Error('VOICEVOX is not the default engine');
            const status=await page.textContent('#onedriveStatus');
            if(!status.includes('首次設定')) throw new Error('Unexpected first-run status: '+status);
            if(errors.length) throw new Error(errors.join(' | '));
            console.log('Listening page + rebuilt MSAL bundle smoke: OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          timeout 150s node test-msal-page.cjs

      - name: Commit verified recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/listening-onedrive-entry.js vendor/onedrive-voicevox.js
          git commit -m 'Recover OneDrive session after MSAL cache loss'
          git push
