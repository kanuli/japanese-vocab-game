name: Refresh Conversation hosted-audio client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.conversation-audio-client-refresh-trigger'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refresh cache-bust and verify v2 client contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('conversation.html')
          s=p.read_text(encoding='utf-8')
          old='./conversation-hosted-audio.js?v=20260815v2'
          new='./conversation-hosted-audio.js?v=20260817v2'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('conversation hosted-audio script reference not found')
          p.write_text(s,encoding='utf-8')
          PY
          node --check conversation-hosted-audio.js
          grep -q 'conversation-hosted-audio.js?v=20260817v2' conversation.html
          grep -q 'conversation-voicevox-index.json?v=20260817v2' conversation-hosted-audio.js
          grep -q 'conversation-supertonic-index.json?v=20260817v2' conversation-hosted-audio.js
          grep -q 'utteranceCount).*2677' conversation-hosted-audio.js
      - name: Commit cache refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conversation.html
          if git diff --cached --quiet; then
            echo 'Conversation client cache already current'
          else
            git commit -m 'Load full 61-scene hosted conversation audio client'
            git pull --rebase origin main
            git push origin main
          fi
