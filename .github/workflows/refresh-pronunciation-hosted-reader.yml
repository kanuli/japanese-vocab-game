name: Refresh Pronunciation Hosted Reader

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.pronunciation-hosted-reader-trigger'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust and validate pronunciation hosted reader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pronunciation.html');s=p.read_text(encoding='utf-8')
          s=s.replace('pronunciation-reference-audio.js?v=20260817v1','pronunciation-reference-audio.js?v=20260817v2')
          p.write_text(s,encoding='utf-8')
          r=Path('pronunciation-reference-audio.js').read_text(encoding='utf-8')
          for token in ['pronunciation-supertonic-original-index.json','pronunciation-voicevox-original-index.json','voicevox-full-index.json','listening-supertonic-index.json','bundleHit','fetchRange']:
              assert token in r, token
          assert 'pronunciation-reference-audio.js?v=20260817v2' in s
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pronunciation.html
          if git diff --cached --quiet; then echo current; else git commit -m 'Refresh pronunciation hosted audio reader'; git pull --rebase origin main; git push origin main; fi
