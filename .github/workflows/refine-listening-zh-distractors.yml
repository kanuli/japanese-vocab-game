name: Refine listening Chinese distractors

on:
  push:
    paths:
      - '.github/workflows/refine-listening-zh-distractors.yml'

permissions:
  contents: write

jobs:
  refine-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply refinement
        run: python scripts/refine-listening-zh-distractors.py
      - name: JavaScript and static checks
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('listening.html').read_text(encoding='utf-8')
          assert 'zhChoiceSim' in s
          assert 'mutations(x.jp).length>=3' in s
          assert '繁體中文翻譯也必須保持相似' in s
          assert '["ます","ません","ました","ませんでした"]' not in s
          assert 'Supertonic 3 AI 聲線' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/listening-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/listening-inline.js
      - name: Install browser tester
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Browser answer-quality test
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cat > test-refine.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/listening.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#webStatus')?.textContent!=='載入中…',{timeout:60000});
            await page.waitForFunction(()=>!document.querySelector('#start')?.disabled,{timeout:60000});
            await page.click('#showFirst');
            await page.click('#start');
            await page.waitForFunction(()=>document.querySelectorAll('.choice').length===4,{timeout:120000});
            const rows=await page.$$eval('.choice',els=>els.map(e=>({zh:e.textContent.replace(/^[A-D]\.\s*/, '').trim(),jp:decodeURIComponent(e.dataset.v)})));
            if(rows.length!==4||new Set(rows.map(x=>x.zh)).size!==4)throw new Error('Need four distinct choices');
            const bg=s=>new Set([...Array(Math.max(0,s.length-1))].map((_,i)=>s.slice(i,i+2)));
            const sim=(a,b)=>{const A=bg(a),B=bg(b);let n=0;for(const x of A)if(B.has(x))n++;return n/Math.max(1,A.size+B.size-n)};
            for(const r of rows){
              if(/[ぁ-ゖァ-ヺA-Za-z]/.test(r.zh))throw new Error('Non-Chinese learner-facing choice: '+r.zh);
              const peers=rows.filter(x=>x!==r).map(x=>sim(r.zh,x.zh));
              if(Math.max(...peers)<.18)throw new Error('Chinese choice is isolated / too dissimilar: '+r.zh);
            }
            for(let i=0;i<rows.length;i++)for(let j=i+1;j<rows.length;j++)if(sim(rows[i].jp,rows[j].jp)<.35)throw new Error('Japanese hidden choices too dissimilar');
            if(errors.length)throw new Error(errors.join(' | '));
            console.log('Refined close Traditional-Chinese choices:',rows);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          timeout 180s node test-refine.cjs
      - name: Commit verified refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening.html
          git commit -m 'Improve Traditional Chinese listening distractor quality'
          git push
