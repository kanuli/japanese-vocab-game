name: Fix Situation Conversation device voice
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.conversation-device-fix-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fix device voice refresh recursion
        run: |
          python .github/fix-conversation-device-voice.py
          node --check conversation.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conversation.js
          if git diff --cached --quiet; then
            echo "Fix already applied"
          else
            git commit -m "Fix Situation Conversation device voice refresh"
            git pull --rebase origin main
            git push origin main
          fi
