name: Japanese teacher page suitability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.teacher-page-suitability-trigger'
      - 'tools/apply_teacher_page_suitability.py'
      - 'tools/audit_teacher_page_suitability.py'
      - 'mocktest.html'
      - 'mocktest.js'
      - 'index.html'
      - 'wordaudio.html'
      - 'wordlist.html'
      - 'grammar.html'
      - 'listening.html'
      - 'conversation.html'
      - 'pronunciation.html'
      - 'translator.html'
      - 'vocab-plus-game.html'
      - 'vocabulary-plus.html'
      - 'advanced_words.js'
      - 'wordaudio-data.js'
      - 'data/jlpt_teacher_audit.tsv'
      - 'data/jlpt_teacher_review_queue.json'
      - 'data/grammar_quality_v27_runtime_report.json'
      - 'data/grammar_depth_batch8_report.json'
      - 'data/listening_completion_batch6_report.json'
      - 'data/full_listening_quality_batch4_report.json'
      - 'data/full_conversation_batch7_report.json'
      - 'data/listening_mock_quality_v3_report.json'
      - 'data/database_completion_report.json'

permissions:
  contents: write

concurrency:
  group: japanese-teacher-page-suitability
  cancel-in-progress: false

jobs:
  teacher-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply teacher page integration
        run: python tools/apply_teacher_page_suitability.py
      - name: Static teacher suitability audit
        run: python tools/audit_teacher_page_suitability.py
      - name: Install Chromium
        run: |
          PW_VERSION=$(tr -d '[:space:]' < maintenance-playwright-version.txt)
          npm init -y >/dev/null 2>&1
          npm install --silent "playwright@$PW_VERSION"
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser-check every user-facing page
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/teacher-pages-http.log 2>&1 &
          echo $! >/tmp/teacher-pages-http.pid
          trap 'kill $(cat /tmp/teacher-pages-http.pid) 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          cat >/tmp/teacher-pages.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const pages=['index.html','wordaudio.html','wordlist.html','grammar.html','listening.html','conversation.html','pronunciation.html','mocktest.html','translator.html','vocab-plus-game.html','vocabulary-plus.html'];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({serviceWorkers:'block'});
            const results=[];
            for(const name of pages){
              const page=await context.newPage();
              const fatal=[]; page.on('pageerror',e=>fatal.push(String(e)));
              const r=await page.goto(`http://127.0.0.1:4173/${name}?teacher=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              if(!r||r.status()>=400) throw Error(`${name} HTTP ${r?.status()||'none'}`);
              const title=await page.title();
              if(!title) throw Error(`${name}: empty title`);
              if(name!=='translator.html'){
                const body=await page.locator('body').innerText();
                for(const level of ['N1','N2','N3','N4','N5']) if(!body.includes(level)) throw Error(`${name}: ${level} UI missing`);
              }
              if(name==='wordlist.html'){
                await page.waitForFunction(()=>Array.isArray(window.WA?.words)&&window.WA.words.length>=32000,null,{timeout:30000});
                const v=await page.evaluate(()=>{const d=w=>w.kanji||w.displayWord||w.reading;const f=(r,k)=>window.WA.words.find(w=>w.reading===r&&d(w)===k);return {total:window.WA.words.length,mai:f('まい','枚')?.level,maiNeg:f('まい','まい')?.level,niwa:f('にわ','庭')?.level,overlay:window.VOCAB_TEACHER_RUNTIME_OVERLAY_META?.version||''}});
                if(v.total<32000||v.mai!=='N5'||v.maiNeg!=='N2'||v.niwa!=='N5'||!v.overlay.includes('teacher-runtime')) throw Error('wordlist teacher runtime mismatch '+JSON.stringify(v));
              }
              if(name==='mocktest.html'){
                await page.waitForFunction(()=>window.MOCKTEST_VOCAB_META?.count>=32000,null,{timeout:30000});
                const m=await page.evaluate(()=>window.MOCKTEST_VOCAB_META);
                if(m.source!=='teacher-runtime') throw Error('mocktest not using teacher runtime '+JSON.stringify(m));
              }
              results.push({name,status:r.status(),title,pageErrors:fatal.slice(0,5)});
              await page.close();
            }
            console.log('TEACHER PAGE BROWSER PASS',JSON.stringify(results));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/teacher-pages.cjs
      - name: Re-run teacher audit after browser acceptance
        run: python tools/audit_teacher_page_suitability.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit teacher suitability integration
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo 'No changes required.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mocktest.html mocktest.js data/teacher_page_suitability_report.json
          git commit -m 'Align every graded page with teacher JLPT calibration'
          git pull --rebase origin main
          git push origin HEAD:main
