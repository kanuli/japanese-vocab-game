name: Fix and smoke-test listening page
on:
  push:
    paths:
      - 'scripts/fix-listening-loading.py'
      - '.github/workflows/fix-listening-loading.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch syntax error
        run: python scripts/fix-listening-loading.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('listening.html').read_text(encoding='utf-8')
          parts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not parts:
              raise SystemExit('No inline script found')
          Path('/tmp/listening.js').write_text(parts[-1],encoding='utf-8')
          PY
          node --check /tmp/listening.js
      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install chromium
      - name: Browser smoke test
        run: |
          python -m http.server 8765 >/tmp/listening-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/listening.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(10000);
            const vals=await page.evaluate(()=>({
              web:document.querySelector('#webStatus')?.textContent?.trim(),
              voice:document.querySelector('#voiceStatus')?.textContent?.trim(),
              furi:document.querySelector('#furiganaStatus')?.textContent?.trim(),
              availability:document.querySelector('#availability')?.textContent?.trim(),
              startDisabled:document.querySelector('#start')?.disabled
            }));
            console.log(vals);
            if(errors.length) throw new Error('Page JS errors: '+errors.join(' | '));
            if(!vals.web || vals.web==='載入中…') throw new Error('Web status stuck');
            if(!vals.voice || vals.voice==='正在檢查瀏覽器日語語音…') throw new Error('Voice status stuck');
            if(!vals.furi || vals.furi==='準備中…') throw new Error('Furigana status stuck');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening.html
          if git diff --cached --quiet; then
            echo 'No listening.html change to commit'
          else
            git commit -m 'Fix listening page loading and verify browser startup'
            git push
          fi
