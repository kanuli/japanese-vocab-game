name: Build prebuilt vocabulary bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.vocab-bundle-trigger'

permissions:
  contents: write

concurrency:
  group: vocabulary-bundle-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Traditional Chinese converter
        run: python -m pip install --disable-pip-version-check opencc-python-reimplemented==0.1.7

      - name: Build and validate vocabulary bundle
        run: python tools/build_vocab_bundle.py

      - name: Validate generated JavaScript
        run: node --check data/advanced_vocab.js

      - name: Publish bundle to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/advanced_vocab.js
          if git diff --cached --quiet -- data/advanced_vocab.js; then
            echo 'Vocabulary bundle is already current.'
            exit 0
          fi
          git commit -m 'Publish prebuilt 20k vocabulary bundle'
          git pull --rebase origin main
          git push origin HEAD:main
