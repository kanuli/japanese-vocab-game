name: Audit vocabulary pronunciation — VOICEVOX + AivisSpeech

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.word-tts-audit-trigger'
      - 'scripts/audit_tts_pronunciation.py'

permissions:
  contents: read

jobs:
  voicevox:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pronunciation auditor
        run: python -m pip install --quiet --disable-pip-version-check 'faster-whisper>=1.1,<2'
      - name: Start official VOICEVOX Engine
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run --rm -d --name voicevox-engine -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:50021/version >/dev/null && break; test "$i" != 120 || { docker logs voicevox-engine; exit 1; }; sleep 2; done
      - name: Audit canonical 43 VOICEVOX voices
        run: python scripts/audit_tts_pronunciation.py --engine voicevox --base http://127.0.0.1:50021 --out voicevox-pronunciation-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voicevox-pronunciation-audit
          path: voicevox-pronunciation-audit.json
          retention-days: 14
      - if: always()
        run: docker stop voicevox-engine || true

  aivis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pronunciation auditor
        run: python -m pip install --quiet --disable-pip-version-check 'faster-whisper>=1.1,<2'
      - name: Start official AivisSpeech Engine
        run: |
          mkdir -p "$HOME/.local/share/AivisSpeech-Engine"
          sudo chown -R 1000:1000 "$HOME/.local/share/AivisSpeech-Engine"
          docker pull ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          docker run --rm -d --name aivis-engine -p 127.0.0.1:10101:10101 -v "$HOME/.local/share/AivisSpeech-Engine:/home/user/.local/share/AivisSpeech-Engine-Dev" ghcr.io/aivis-project/aivisspeech-engine:cpu-latest
          for i in $(seq 1 300); do curl -fsS http://127.0.0.1:10101/speakers >/dev/null && break; test "$i" != 300 || { docker logs aivis-engine; exit 1; }; sleep 2; done
      - name: Audit configured AivisSpeech styles
        run: python scripts/audit_tts_pronunciation.py --engine aivis --base http://127.0.0.1:10101 --out aivis-pronunciation-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aivis-pronunciation-audit
          path: aivis-pronunciation-audit.json
          retention-days: 14
      - if: always()
        run: docker stop aivis-engine || true
