name: Apply JLPT mock diversity v3
on:
  push:
    paths:
      - '.github/workflows/apply-mocktest-diversity-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply diversity patch
        run: python .github/scripts/improve_mocktest_diversity.py
      - name: Force new browser version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('mocktest.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'mocktest\.js\?v=[^"\s<]+','mocktest.js?v=20260813-diversity2',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check mocktest.js
      - name: Commit improvement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mocktest.js mocktest.html
          git commit -m 'Improve JLPT reading and listening diversity'
          git push
