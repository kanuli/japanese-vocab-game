name: Teacher JLPT runtime regression

on:
  workflow_dispatch:
  schedule:
    - cron: '12 4 * * *'
  workflow_run:
    workflows: ['Teacher audit artifact consistency']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/teacher-jlpt-runtime-regression.yml'
      - 'data/advanced_vocab.js'
      - 'data/vocab_core_verified.js'
      - 'data/jlpt_teacher_audit.tsv'
      - 'data/vocab_audit.json'
      - 'data/vocab_common_fixups.js'
      - 'data/vocab_external_crosscheck.js'
      - 'advanced_words.js'
      - 'core_vocab_fetch_patch.js'
      - 'large_vocab_loader.js'
      - 'large_vocab_build.js'
      - 'large_vocab_sources.js'
      - 'wordaudio-data.js'
      - 'wordlist.html'

jobs:
  teacher-runtime:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify committed teacher audit artifact
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          audit=json.loads(Path('data/vocab_audit.json').read_text(encoding='utf-8'))
          r=audit['jlptRecalibration']
          assert r.get('status')=='complete', r.get('status')
          assert isinstance(r.get('version'),str) and 'teacher' in r['version'], r.get('version')
          assert r['scope']=='every core+advanced runtime word exact key'
          assert int(r['rowCount'])>=32000, r['rowCount']
          assert r['estimatedN1WithoutRarityEvidence']==0
          assert r['duplicateExactKeys']==0
          with Path('data/jlpt_teacher_audit.tsv').open(encoding='utf-8',newline='') as f:
            rows=list(csv.DictReader(f,delimiter='\t'))
          assert len(rows)==r['rowCount'],('teacher artifact drift',len(rows),r['rowCount'])
          assert not [x for x in rows if x['level']=='N1' and x['status'].startswith('estimated')]
          print('STATIC TEACHER AUDIT PASS',r['version'],r['rowCount'],r['combinedCountsByLevel'],r['teacherGradeCounts'])
          PY

      - name: Install Chromium
        run: |
          PW_VERSION=$(tr -d '[:space:]' < maintenance-playwright-version.txt)
          npm init -y >/dev/null 2>&1
          npm install --silent "playwright@$PW_VERSION"
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify actual browser vocabulary against canonical Teacher audit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/teacher-http.log 2>&1 &
          echo $! >/tmp/teacher-http.pid
          trap 'kill $(cat /tmp/teacher-http.pid) 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/wordlist.html >/dev/null && break; sleep 1; done
          cat >/tmp/teacher-runtime.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const expected={
            'まい|まい':'N2','まい|舞':'N2','まい|枚':'N5','まい|毎':'N5',
            'すいか|西瓜':'N5','これ|これ':'N5','それ|それ':'N5',
            'おもしろい|面白い':'N5','あかるい|明るい':'N5','おわる|終わる':'N5',
            'べんきょう|勉強':'N5','さんぽ|散歩':'N5','だんだん|だんだん':'N5','もし|もし':'N4',
            'ふん|分':'N5','キロ|キロ':'N5','さらいげつ|再来月':'N5','さらいねん|再来年':'N5',
            'まんなか|真ん中':'N4','つくる|造る':'N5'
          };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({serviceWorkers:'block'});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const response=await page.goto('http://127.0.0.1:4173/wordlist.html?teacher='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            if(!response||response.status()>=400) throw Error('wordlist HTTP '+(response?.status()||'none'));
            await page.waitForFunction(()=>Array.isArray(window.WA?.words)&&window.WA.words.length>=32000,null,{timeout:30000});
            await page.waitForTimeout(1000);
            const result=await page.evaluate(async(expected)=>{
              const words=window.WA.words;
              const display=w=>w.kanji||w.displayWord||w.reading;
              const runtime=new Map(words.map(w=>[`${w.reading}|${display(w)}`,w]));
              const counts={N1:0,N2:0,N3:0,N4:0,N5:0};
              for(const w of words) if(counts[w.level]!==undefined) counts[w.level]++;

              const auditResp=await fetch('./data/jlpt_teacher_audit.tsv?teacher='+Date.now(),{cache:'no-store'});
              if(!auditResp.ok) throw Error('teacher TSV HTTP '+auditResp.status);
              const tsv=(await auditResp.text()).replace(/^\uFEFF/,'').trimEnd();
              const lines=tsv.split(/\r?\n/);
              const header=lines.shift().split('\t');
              const col=Object.fromEntries(header.map((x,i)=>[x,i]));
              for(const need of ['reading','display','level']) if(col[need]===undefined) throw Error('teacher TSV missing '+need);
              const audited=new Map();
              for(const line of lines){
                if(!line)continue;
                const f=line.split('\t');
                const k=`${f[col.reading]}|${f[col.display]}`;
                if(audited.has(k)) throw Error('duplicate canonical teacher key '+k);
                audited.set(k,f[col.level]);
              }

              const missingInRuntime=[],extraInRuntime=[],levelMismatch=[];
              for(const [k,level] of audited){
                const w=runtime.get(k);
                if(!w){if(missingInRuntime.length<100)missingInRuntime.push(k);continue;}
                if(w.level!==level&&levelMismatch.length<100)levelMismatch.push({key:k,audit:level,runtime:w.level});
              }
              for(const k of runtime.keys()) if(!audited.has(k)&&extraInRuntime.length<100) extraInRuntime.push(k);

              const sentinels={};
              for(const [key,level] of Object.entries(expected)){
                const w=runtime.get(key);
                sentinels[key]=w?{level:w.level,meaning:w.meaning,levelSource:w.levelSource||'',estimated:!!w.estimated}:null;
              }
              const estimatedN1=words.filter(w=>w.level==='N1'&&(w.estimated===true||String(w.levelSource||'').includes('estimate'))).map(w=>`${w.reading}|${display(w)}`);

              // Review-only heuristic: same reading, >=3 distinct written forms, identical
              // normalized Traditional-Chinese meaning AND level. Legitimate orthographic
              // variants exist, so generic collisions are queued for Teacher review.
              const groups=new Map();
              const norm=s=>String(s||'').replace(/[\s　、，,。；;（）()]/g,'').trim();
              for(const w of words){
                const r=String(w.reading||'').trim(),d=String(display(w)||'').trim();
                if(!r||!d) continue;
                if(!groups.has(r)) groups.set(r,[]);
                groups.get(r).push({display:d,meaning:String(w.meaning||''),level:String(w.level||'')});
              }
              const homophoneCollisions=[];
              for(const [reading,items] of groups){
                const distinct=[...new Map(items.map(x=>[x.display,x])).values()];
                if(distinct.length<3) continue;
                const buckets=new Map();
                for(const x of distinct){
                  const k=`${norm(x.meaning)}|${x.level}`;
                  if(!norm(x.meaning)) continue;
                  if(!buckets.has(k)) buckets.set(k,[]);
                  buckets.get(k).push(x);
                }
                for(const rows of buckets.values()) if(rows.length>=3) homophoneCollisions.push({reading,rows});
              }
              return {
                total:words.length,auditRows:audited.size,counts,sentinels,estimatedN1,
                missingInRuntime,extraInRuntime,levelMismatch,homophoneCollisions
              };
            },expected);
            if(errors.length) throw Error('page errors: '+errors.join(' | '));
            if(result.total<32000) throw Error('runtime vocabulary underfilled '+result.total);
            if(result.total!==result.auditRows||result.missingInRuntime.length||result.extraInRuntime.length||result.levelMismatch.length){
              throw Error('runtime/audit exact-key drift '+JSON.stringify({runtime:result.total,audit:result.auditRows,missing:result.missingInRuntime,extra:result.extraInRuntime,levelMismatch:result.levelMismatch}));
            }
            if(result.estimatedN1.length) throw Error('runtime estimated N1 forbidden '+JSON.stringify(result.estimatedN1.slice(0,30)));
            for(const [key,level] of Object.entries(expected)){
              const row=result.sentinels[key];
              if(!row||row.level!==level) throw Error(`teacher sentinel ${key}: expected ${level}, got ${JSON.stringify(row)}`);
            }
            const suika=result.sentinels['すいか|西瓜'];
            if(!String(suika.meaning||'').includes('西瓜')||String(suika.meaning||'').includes('天邊一朵雲')) throw Error('西瓜 meaning corrupted '+JSON.stringify(suika));
            const mai=result.sentinels['まい|まい'];
            if(!String(mai.meaning||'').includes('不會')) throw Error('まい meaning corrupted '+JSON.stringify(mai));

            // Permanent regression for the historical まい/舞/枚/毎 contamination.
            const maiKeys=['まい|まい','まい|舞','まい|枚','まい|毎'];
            const maiRows=maiKeys.map(k=>result.sentinels[k]);
            if(maiRows.some(x=>!x||!String(x.meaning||'').trim())) throw Error('まい homophone row missing '+JSON.stringify(maiRows));
            const maiMeanings=new Set(maiRows.map(x=>String(x.meaning||'').replace(/[\s　、，,。；;]/g,'').trim()));
            if(maiMeanings.size!==4) throw Error('まい/舞/枚/毎 meanings collapsed '+JSON.stringify(maiRows));

            if(result.counts.N1>=14500) throw Error('N1 regression '+JSON.stringify(result.counts));
            if(result.counts.N5<1800||result.counts.N4<1500||result.counts.N3<4000) throw Error('lower-level underfill '+JSON.stringify(result.counts));
            for(const c of result.homophoneCollisions.slice(0,100)) console.warn('TEACHER_REVIEW homophone-meaning-collision '+JSON.stringify(c));
            console.log('TEACHER REVIEW CANDIDATES',result.homophoneCollisions.length);
            console.log('TEACHER RUNTIME PASS',JSON.stringify({total:result.total,auditRows:result.auditRows,counts:result.counts,sentinels:result.sentinels,reviewCandidates:result.homophoneCollisions.length}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/teacher-runtime.cjs
