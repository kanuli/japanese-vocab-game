name: JLPT vocabulary coverage audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/vocab-coverage-20260821
    paths:
      - tools/audit_vocab_surface_forms.py
      - tools/final_quality_review.py
      - tools/materialize_coverage_additions.py
      - tools/apply_coverage_additions.py
      - tools/validate_coverage_additions.py
      - audit/vocab/.run
      - .github/workflows/vocab-coverage-audit.yml
      - advanced_words_curated.js
      - wordaudio-data.js

permissions:
  contents: write

concurrency:
  group: jlpt-vocab-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Traditional Chinese converter
        run: python -m pip install --disable-pip-version-check opencc-python-reimplemented==0.1.7

      - name: Run strict written-form + reading audit
        run: python tools/audit_vocab_surface_forms.py --results audit/vocab/results

      - name: Run final quality review on every strict missing form
        run: python tools/final_quality_review.py --results audit/vocab/results

      - name: Preserve pre-implementation review snapshot
        run: |
          rm -rf audit/vocab/results/pre_implementation
          mkdir -p audit/vocab/results/pre_implementation
          cp audit/vocab/results/surface_form_summary.json audit/vocab/results/pre_implementation/surface_form_summary.json
          cp audit/vocab/results/quality_review_summary.json audit/vocab/results/pre_implementation/quality_review_summary.json
          cp audit/vocab/results/final_quality_review_all_missing.csv audit/vocab/results/pre_implementation/final_quality_review_all_missing.csv
          cp audit/vocab/results/quality_review_recommended_add.csv audit/vocab/results/pre_implementation/quality_review_recommended_add.csv

      - name: Materialize direct reviewed additions with Traditional Chinese meanings
        run: python tools/materialize_coverage_additions.py --results audit/vocab/results --output data/coverage_additions.json

      - name: Add approved exact surface forms to existing advanced bundle
        run: python tools/apply_coverage_additions.py --bundle data/advanced_vocab.js --additions data/coverage_additions.json

      - name: Validate generated JavaScript
        run: node --check data/advanced_vocab.js

      - name: Validate every materialized addition survives in bundle
        run: python tools/validate_coverage_additions.py --bundle data/advanced_vocab.js --additions data/coverage_additions.json --report audit/vocab/results/coverage_additions_validation.json

      - name: Re-run strict surface-form audit after additions
        run: python tools/audit_vocab_surface_forms.py --results audit/vocab/results

      - name: Re-run final quality review on remaining gaps
        run: python tools/final_quality_review.py --results audit/vocab/results

      - name: Publish summary to workflow page
        if: always()
        run: |
          if [ -f audit/vocab/results/SURFACE_FORM_AUDIT.md ]; then
            cat audit/vocab/results/SURFACE_FORM_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f audit/vocab/results/QUALITY_REVIEW.md ]; then
            printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat audit/vocab/results/QUALITY_REVIEW.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f audit/vocab/results/coverage_additions_summary.json ]; then
            printf '\n\n## Coverage additions materialization\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat audit/vocab/results/coverage_additions_summary.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f audit/vocab/results/coverage_additions_validation.json ]; then
            printf '\n\n## Coverage additions validation\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat audit/vocab/results/coverage_additions_validation.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jlpt-vocabulary-coverage-audit
          path: |
            audit/vocab/results/
            data/coverage_additions.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit reports and additive vocabulary to audit branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audit/vocab/results data/coverage_additions.json data/advanced_vocab.js
          if git diff --cached --quiet; then
            echo "No audit or vocabulary changes to commit."
            exit 0
          fi
          git commit -m "Apply reviewed JLPT surface-form coverage additions"
          git pull --rebase origin audit/vocab-coverage-20260821
          git push origin HEAD:audit/vocab-coverage-20260821
