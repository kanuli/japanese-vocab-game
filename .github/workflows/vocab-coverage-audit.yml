name: JLPT vocabulary coverage audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/vocab-coverage-20260821
    paths:
      - tools/audit_vocab_coverage.py
      - tools/refine_vocab_audit_jmdict.py
      - tools/audit_vocab_surface_forms.py
      - tools/review_vocab_missing_quality.py
      - audit/vocab/README.md
      - audit/vocab/.run
      - .github/workflows/vocab-coverage-audit.yml
      - data/advanced_vocab.js
      - advanced_words_curated.js
      - wordaudio-data.js

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run baseline N1-N5 vocabulary coverage audit
        run: python tools/audit_vocab_coverage.py --out audit/vocab/results

      - name: Run strict written-form + reading coverage audit
        run: python tools/audit_vocab_surface_forms.py --results audit/vocab/results

      - name: Run final quality review for every strict missing form
        run: python tools/review_vocab_missing_quality.py --results audit/vocab/results

      - name: Publish summaries to workflow page
        if: always()
        run: |
          for f in \
            audit/vocab/results/README.md \
            audit/vocab/results/SURFACE_FORM_AUDIT.md \
            audit/vocab/results/QUALITY_REVIEW.md; do
            if [ -f "$f" ]; then
              printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jlpt-vocabulary-coverage-audit
          path: audit/vocab/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit reports to audit branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audit/vocab/results
          if git diff --cached --quiet; then
            echo "No audit report changes to commit."
            exit 0
          fi
          git commit -m "Update strict JLPT vocabulary coverage audit results"
          git push origin HEAD:audit/vocab-coverage-20260821
