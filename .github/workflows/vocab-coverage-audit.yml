name: JLPT vocabulary coverage audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/vocab-coverage-20260821
    paths:
      - tools/audit_vocab_coverage.py
      - tools/audit_vocab_surface_forms.py
      - tools/review_vocab_missing_quality.py
      - tools/adjudicate_source_check.py
      - tools/materialize_coverage_additions.py
      - tools/apply_coverage_additions.py
      - tools/validate_coverage_additions.py
      - data/coverage_manual_meanings.json
      - data/coverage_deferred_manual.js
      - audit/vocab/.run
      - .github/workflows/vocab-coverage-audit.yml

permissions:
  contents: write

concurrency:
  group: jlpt-vocab-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Traditional Chinese converter
        run: python -m pip install --disable-pip-version-check opencc-python-reimplemented==0.1.7

      - name: Run strict written-form plus reading audit
        run: python tools/audit_vocab_surface_forms.py --results audit/vocab/results

      - name: Rebuild final quality review from current runtime
        run: python tools/review_vocab_missing_quality.py --results audit/vocab/results

      - name: Adjudicate all 378 source-check candidates
        run: python tools/adjudicate_source_check.py --input audit/vocab/results/final_quality_review_all_missing.csv --results audit/vocab/results

      - name: Materialize approved source-check items with Traditional Chinese meanings
        run: python tools/materialize_coverage_additions.py --mode source-check --results audit/vocab/results --output data/coverage_sourcecheck_additions.json

      - name: Merge source-check additions into existing advanced bundle
        run: python tools/apply_coverage_additions.py --bundle data/advanced_vocab.js --additions data/coverage_sourcecheck_additions.json

      - name: Validate generated JavaScript
        run: node --check data/advanced_vocab.js

      - name: Validate source-check additions survive in bundle
        run: python tools/validate_coverage_additions.py --bundle data/advanced_vocab.js --additions data/coverage_sourcecheck_additions.json --report audit/vocab/results/source_check_validation.json

      - name: Re-run strict audit after source-check additions
        run: python tools/audit_vocab_surface_forms.py --results audit/vocab/results

      - name: Re-run final quality review on remaining gaps
        run: python tools/review_vocab_missing_quality.py --results audit/vocab/results

      - name: Publish summary
        if: always()
        run: |
          for f in audit/vocab/results/source_check_adjudication_summary.json audit/vocab/results/source_check_summary.json audit/vocab/results/source_check_validation.json audit/vocab/results/surface_form_summary.json audit/vocab/results/quality_review_summary.json; do
            if [ -f "$f" ]; then
              printf '\n\n## %s\n\n```json\n' "$f" >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jlpt-vocabulary-coverage-audit
          path: |
            audit/vocab/results/
            data/coverage_sourcecheck_additions.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit source-check results to audit branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- audit/vocab/results data/coverage_sourcecheck_additions.json data/advanced_vocab.js
          if git diff --cached --quiet; then
            echo "No source-check changes to commit."
            exit 0
          fi
          git commit -m "Apply source-checked JLPT surface-form additions"
          git pull --rebase origin audit/vocab-coverage-20260821
          git push origin HEAD:audit/vocab-coverage-20260821
