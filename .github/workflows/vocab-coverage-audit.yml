name: Vocabulary hosted voice coverage audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/vocab-coverage-20260821
    paths:
      - scripts/build_word_voicevox_catalog.mjs
      - scripts/build_word_shared_audio_catalog.py
      - scripts/build_word_supertonic_catalog.py
      - scripts/build_word_aivis_catalog.py
      - tools/audit_vocab_voice_coverage.py
      - data/advanced_vocab.js
      - data/coverage_deferred_manual.js
      - data/coverage_sourcecheck_manual.js
      - data/coverage_postreview_manual.js
      - .github/workflows/vocab-coverage-audit.yml

permissions:
  contents: write

concurrency:
  group: vocab-hosted-voice-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build desired exact runtime voice catalog
        env:
          CATALOG_OUT: audit/vocab/results/desired_word_voice_catalog.json
        run: node scripts/build_word_voicevox_catalog.mjs

      - name: Validate desired catalog shape
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('audit/vocab/results/desired_word_voice_catalog.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          rows=d.get('words') or []
          if int(d.get('wordCount',-1))!=len(rows): raise SystemExit('desired wordCount mismatch')
          if len({r.get('key') for r in rows})!=len(rows): raise SystemExit('duplicate desired exact keys')
          bad=[r.get('key') for r in rows if not re.fullmatch(r'[ぁ-ゖァ-ヺー・ヽヾゝゞ]+',str(r.get('reading') or ''))]
          if bad: raise SystemExit(f'invalid voice readings: {len(bad)}')
          print({'desired_word_count':len(rows),'invalid_readings':len(bad)})
          PY

      - name: Compare all hosted voice catalogs
        run: python tools/audit_vocab_voice_coverage.py --results audit/vocab/results

      - name: Publish audit summary
        run: |
          cat audit/vocab/results/voice_coverage_summary.json
          printf '\n## Hosted vocabulary voice coverage\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat audit/vocab/results/voice_coverage_summary.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload precise missing-voice reports
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-hosted-voice-coverage
          path: |
            audit/vocab/results/voice_coverage_summary.json
            audit/vocab/results/voice_missing_*.csv
            audit/vocab/results/desired_word_voice_catalog.json
          retention-days: 30

      - name: Commit audit results to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- audit/vocab/results/voice_coverage_summary.json audit/vocab/results/voice_missing_*.csv audit/vocab/results/desired_word_voice_catalog.json
          if git diff --cached --quiet; then
            echo 'Voice coverage audit already current.'
            exit 0
          fi
          git commit -m 'Audit hosted voice coverage for reviewed vocabulary'
          git pull --rebase origin audit/vocab-coverage-20260821
          git push origin HEAD:audit/vocab-coverage-20260821
