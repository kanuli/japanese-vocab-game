name: Add OneDrive VOICEVOX

on:
  push:
    paths:
      - '.github/workflows/add-onedrive-voicevox.yml'

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle Microsoft OneDrive browser client
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --save-dev @azure/msal-browser@5.17.3 esbuild@0.25.9
          mkdir -p vendor
          npx esbuild src/listening-onedrive-entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --target=es2020 \
            --minify \
            --outfile=vendor/onedrive-voicevox.js

      - name: Patch Listening page
        run: python scripts/patch-listening-onedrive-voicevox.py

      - name: Static checks
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('listening.html').read_text(encoding='utf-8')
          for x in ['engineVoicevox','voicevoxPanel','onedriveClientId','onedriveConnect','onedriveSetup','aVoiceSource','Files.ReadWrite.AppFolder']:
              assert x in s, x
          assert 'vendor/onedrive-voicevox.js' in s
          assert 'voicevox-index.json' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/listening-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/listening-inline.js
          node --check vendor/onedrive-voicevox.js

      - name: Install browser tester
        run: |
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser smoke test
        run: |
          python3 -m http.server 8765 >/tmp/server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cat > test-onedrive.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/listening.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#webStatus')?.textContent!=='載入中…',{timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#onedriveStatus')?.textContent!=='正在檢查 OneDrive 設定…',{timeout:30000});
            const radios=await page.$$eval('input[name=audioEngine]',els=>els.map(x=>x.value));
            if(radios.join(',')!=='voicevox,ai,device') throw new Error('Unexpected audio engines: '+radios.join(','));
            if(!(await page.isDisabled('#engineVoicevox'))) throw new Error('VOICEVOX should be disabled before Client ID setup');
            const od=await page.textContent('#onedriveStatus');
            if(!od.includes('Client ID')) throw new Error('OneDrive setup guidance missing: '+od);
            await page.check('#engineDevice');
            if((await page.$eval('#devicePanel',e=>getComputedStyle(e).display))==='none') throw new Error('Device panel did not open');
            await page.check('#engineAI');
            if((await page.$eval('#aiPanel',e=>getComputedStyle(e).display))==='none') throw new Error('AI panel did not open');
            await page.click('#showFirst');
            await page.click('#start');
            await page.waitForFunction(()=>document.querySelectorAll('.choice').length===4,{timeout:120000});
            const choices=await page.$$eval('.choice',els=>els.map(e=>e.textContent.replace(/^[A-D]\.\s*/,'').trim()));
            if(choices.some(x=>/[ぁ-ゖァ-ヺA-Za-z]/.test(x))) throw new Error('Learner-facing choice leaked Japanese/English: '+choices.join(' | '));
            if(errors.length) throw new Error(errors.join(' | '));
            console.log('Audio engines:',radios);
            console.log('OneDrive status:',od);
            console.log('Traditional Chinese choices:',choices);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          timeout 180s node test-onedrive.cjs

      - name: Commit verified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening.html vendor/onedrive-voicevox.js
          git commit -m 'Add direct OneDrive VOICEVOX audio support'
          git push
