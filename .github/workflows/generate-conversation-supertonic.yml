name: Generate conversation Supertonic 3 — 10 voices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.conversation-supertonic-full-trigger'

permissions:
  actions: read
  contents: write
  id-token: write

env:
  HF_DATASET_REPO: kanuli1983/japanese-listening-voicevox-backup
  RELEASE_TAG: conversation-supertonic-v1

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build exact 650-conversation utterance catalog
        run: |
          node scripts/build_conversation_audio_catalog.mjs
          node - <<'NODE'
          const d=require('./conversation-audio-catalog.json');
          if(d.sceneCount!==26||d.conversationCount!==650)throw new Error('Expected 26 scenes / 650 conversations');
          if(d.sourceLineCount!==1300)throw new Error('Expected 1,300 source lines');
          if(d.utteranceCount!==1244)throw new Error('Expected 1,244 unique utterances');
          if(d.voiceCount!==10)throw new Error('Expected 10 Supertonic voices');
          console.log(`Catalog: ${d.conversationCount} conversations / ${d.sourceLineCount} lines -> ${d.utteranceCount} unique utterances`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: conversation-audio-catalog
          path: conversation-audio-catalog.json
          retention-days: 3
          compression-level: 9

  prepare-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create persistent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title 'Supertonic 3 conversation — 10 voices' --notes 'Server-hosted Japanese situation-conversation audio generated with Supertonic 3. Ten built-in voices (F1-F5, M1-M5), covering all 1,244 unique utterances from 650 conversations. One byte-range TAR bundle per voice; browser Supertonic 3 remains an automatic fallback.'

  generate:
    needs: [catalog, prepare-storage]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        voice: [F1, F2, F3, F4, F5, M1, M2, M3, M4, M5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: conversation-audio-catalog
          path: .
      - name: Validate generator
        run: python -m py_compile scripts/generate_conversation_supertonic_bundle.py scripts/build_conversation_supertonic_index.py
      - name: Install Supertonic 3 and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --disable-pip-version-check 'supertonic==1.2.2'
      - name: Generate one complete Supertonic 3 voice bundle
        env:
          VOICE: ${{ matrix.voice }}
          CATALOG: conversation-audio-catalog.json
          OUT_DIR: conversation-supertonic-out
          SUPERTONIC_CACHE_DIR: ${{ runner.temp }}/supertonic-cache
        run: python scripts/generate_conversation_supertonic_bundle.py
      - name: Validate TAR and manifest
        env:
          VOICE: ${{ matrix.voice }}
        run: |
          python - <<'PY'
          import json, os, tarfile
          from pathlib import Path
          v=os.environ['VOICE']
          m=json.load(open(f'conversation-supertonic-out/{v}.json',encoding='utf-8'))
          assert m['voice']==v and m['count']==1244
          p=Path('conversation-supertonic-out')/m['asset']
          assert p.is_file() and p.stat().st_size>500000
          with tarfile.open(p,'r:') as tf:
              files=[x for x in tf.getmembers() if x.isfile()]
          assert len(files)==1244==len(m['members'])
          print('Validated',v,m['count'],'recordings',p.stat().st_size,'bytes')
          PY
      - name: Install Hugging Face CLI
        run: python -m pip install --quiet --disable-pip-version-check 'huggingface_hub>=1.19,<2'
      - name: Upload TAR to Hugging Face backup
        env:
          HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup
          HF_XET_HIGH_PERFORMANCE: '1'
          VOICE: ${{ matrix.voice }}
        run: hf upload "$HF_DATASET_REPO" "conversation-supertonic-out/$VOICE.tar" "conversation/supertonic/v1/$VOICE.tar" --repo-type dataset --commit-message "Supertonic 3 conversation $VOICE"
      - name: Upload TAR to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE: ${{ matrix.voice }}
        run: gh release upload "$RELEASE_TAG" "conversation-supertonic-out/$VOICE.tar" --clobber
      - name: Preserve manifest
        env:
          VOICE: ${{ matrix.voice }}
        run: |
          mkdir -p manifest-artifact
          cp "conversation-supertonic-out/$VOICE.json" manifest-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: conversation-supertonic-manifest-${{ matrix.voice }}
          path: manifest-artifact/*.json
          retention-days: 3
          compression-level: 9

  finalize:
    needs: [catalog, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: conversation-audio-catalog
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: conversation-supertonic-manifest-*
          path: conversation-supertonic-manifests
          merge-multiple: true
      - name: Build lightweight server index
        env:
          CATALOG: conversation-audio-catalog.json
          MANIFEST_DIR: conversation-supertonic-manifests
          OUT: conversation-supertonic-index.json
          GITHUB_REPO: kanuli/japanese-vocab-game
          HF_DATASET_REPO: kanuli1983/japanese-listening-voicevox-backup
          RELEASE_TAG: conversation-supertonic-v1
        run: |
          test "$(find conversation-supertonic-manifests -type f -name '*.json' | wc -l)" -eq 10
          python scripts/build_conversation_supertonic_index.py
          python - <<'PY'
          import json
          d=json.load(open('conversation-supertonic-index.json',encoding='utf-8'))
          assert d['version']==1 and d['status']=='ready' and d['voiceCount']==10
          assert d['conversationCount']==650 and d['sourceLineCount']==1300 and d['utteranceCount']==1244
          assert d['recordingCount']==12440
          assert len(d['voices'])==10
          print('Published Supertonic 3 coverage:',d['recordingCount'],'recordings')
          PY
      - name: Commit lightweight index for GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conversation-supertonic-index.json
          if git diff --cached --quiet; then
            echo 'Supertonic 3 conversation index already current'
          else
            git commit -m 'Publish full hosted Supertonic 3 conversation index'
            git pull --rebase origin main
            git push origin main
          fi
