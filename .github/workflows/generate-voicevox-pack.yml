name: Generate VOICEVOX audio pack

on:
  workflow_dispatch:
    inputs:
      jlpt:
        description: JLPT level
        required: true
        default: ALL
        type: choice
        options: [ALL, N5, N4, N3, N2, N1]
      count:
        description: Number of Hanabira sentences PER level (use ALL for every sentence)
        required: true
        default: 'ALL'
        type: string
      speaker_name:
        description: MIXED = rotate all available VOICEVOX speakers; or enter one exact speaker name
        required: true
        default: MIXED
        type: string
      style_name:
        description: ALL = rotate every available speech style; or enter one preferred style name
        required: true
        default: ALL
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Check generator syntax
        run: |
          python -m py_compile scripts/generate_voicevox_pack.py
          python -m py_compile scripts/publish_voicevox_releases.py

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Start official VOICEVOX Engine
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run --rm -d --name voicevox-engine -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              echo 'VOICEVOX Engine ready'
              break
            fi
            if [ "$i" = 120 ]; then
              docker logs voicevox-engine || true
              exit 1
            fi
            sleep 2
          done
          echo 'Available VOICEVOX speakers/styles:'
          curl -fsS http://127.0.0.1:50021/speakers | python -m json.tool

      - name: Generate compressed MP3 pack
        env:
          JLPT: ${{ inputs.jlpt }}
          COUNT: ${{ inputs.count }}
          SPEAKER_NAME: ${{ inputs.speaker_name }}
          STYLE_NAME: ${{ inputs.style_name }}
          OUTPUT_DIR: voicevox-pack
        run: python scripts/generate_voicevox_pack.py

      - name: Validate pack
        run: |
          test -f voicevox-pack/voicevox-index.json
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          p=Path('voicevox-pack/voicevox-index.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('version') == 1
          assert d.get('items')
          assert d.get('voices')
          missing=[]
          used_speakers=set()
          used_variants=set()
          for qid, rec in d['items'].items():
              f=Path('voicevox-pack') / rec['path']
              if not f.is_file() or f.stat().st_size < 500:
                  missing.append(str(f))
              assert rec.get('credit','').startswith('VOICEVOX:')
              used_speakers.add(rec.get('speaker',''))
              used_variants.add((rec.get('speaker',''), rec.get('style','')))
          assert not missing, missing

          speaker_mode='${{ inputs.speaker_name }}'.upper()
          style_mode='${{ inputs.style_name }}'.upper()
          if speaker_mode in ('MIXED','ALL','RANDOM'):
              assert len(used_speakers) > 1, f'MIXED mode produced only {used_speakers}'
          if style_mode in ('ALL','MIXED','*','ANY'):
              assert d.get('styleMode') == 'all'
              speakers=json.load(urllib.request.urlopen('http://127.0.0.1:50021/speakers'))
              if speaker_mode in ('MIXED','ALL','RANDOM'):
                  expected={(str(sp.get('name','')).strip(), str(st.get('name','')).strip())
                            for sp in speakers for st in (sp.get('styles') or []) if str(sp.get('name','')).strip()}
                  indexed={(v.get('speaker',''), v.get('style','')) for v in d['voices']}
                  assert indexed == expected, f'Indexed {len(indexed)} variants; engine exposes {len(expected)}'
                  assert d.get('speakerCount') == len({x[0] for x in expected})
                  assert d.get('voiceVariantCount') == len(expected)
          print('Validated', len(d['items']), 'audio files;', d.get('speakerCount'), 'speakers;', d.get('voiceVariantCount'), 'speaker-style variants')
          PY

      - name: Publish MP3 files to public GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_DIR: voicevox-pack
          INDEX_OUT: voicevox-release-index.json
          RELEASE_NAMESPACE: voicevox-v1
          RELEASE_MAX_ASSETS: '800'
          REPLACE_LEVELS: ${{ inputs.count == 'ALL' && '1' || '0' }}
        run: python scripts/publish_voicevox_releases.py

      - name: Validate public release index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('voicevox-release-index.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('version') == 2
          assert d.get('storage') == 'github-releases'
          assert d.get('items')
          for qid, rec in d['items'].items():
              assert rec.get('url','').startswith('https://github.com/kanuli/japanese-vocab-game/releases/download/'), (qid, rec)
              assert rec.get('credit','').startswith('VOICEVOX:')
          print('Public index contains', len(d['items']), 'questions')
          PY

      - name: Commit updated public index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add voicevox-release-index.json
          if git diff --cached --quiet; then
            echo 'Public VOICEVOX index unchanged'
          else
            git commit -m 'Update public VOICEVOX release index'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Stop engine
        if: always()
        run: docker stop voicevox-engine || true
