name: Install listening game
on:
  push:
    paths:
      - '.github/workflows/install-listening-game.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install listening game
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload=''
          Path('listening.html').write_bytes(gzip.decompress(base64.b64decode(payload)))

          nav='<div style="display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px"><a href="./index.html" style="text-decoration:none;border:1px solid #dfe4ec;background:#fff;border-radius:999px;padding:8px 11px;font-weight:700;font-size:13px">📚 單字</a><a href="./grammar.html" style="text-decoration:none;border:1px solid #dfe4ec;background:#fff;border-radius:999px;padding:8px 11px;font-weight:700;font-size:13px">📝 文法</a><a href="./listening.html" style="text-decoration:none;border:1px solid #3568dd;background:#eef3ff;border-radius:999px;padding:8px 11px;font-weight:700;font-size:13px">🎧 聽解</a></div>'
          for name in ('index.html','grammar.html'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if 'href="./listening.html"' not in s:
                  s=s.replace('<div class="wrap">','<div class="wrap">'+nav,1)
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening.html index.html grammar.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add JLPT listening game'
            git push
          fi
