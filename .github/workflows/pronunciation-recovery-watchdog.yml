name: Pronunciation Hosted Audio Recovery Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: write

jobs:
  ensure-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check completion state
        id: state
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return {}
          st=load('pronunciation-supertonic-original-index.json')
          vv=load('pronunciation-voicevox-original-index.json')
          st_ready=(st.get('status')=='ready' and st.get('questionCount')==6690 and st.get('voiceCount')==10 and st.get('recordingCount')==66900)
          vv_ready=(vv.get('status')=='ready' and vv.get('questionCount')==6690 and vv.get('speakerCount')==43 and vv.get('recordingCount')==287670)
          complete=st_ready and vv_ready
          print(f'Supertonic ready={st_ready}; VOICEVOX ready={vv_ready}; complete={complete}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('complete='+('true' if complete else 'false')+'\n')
          PY

      - name: Check whether recovery is already active
        if: steps.state.outputs.complete != 'true'
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IN_PROGRESS=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/recover-pronunciation-hosted-audio.yml/runs?status=in_progress&per_page=10" --jq '.total_count')
          QUEUED=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/recover-pronunciation-hosted-audio.yml/runs?status=queued&per_page=10" --jq '.total_count')
          TOTAL=$((IN_PROGRESS + QUEUED))
          echo "Active recovery runs: in_progress=$IN_PROGRESS queued=$QUEUED total=$TOTAL"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Dispatch targeted recovery if needed
        if: steps.state.outputs.complete != 'true' && steps.active.outputs.total == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run recover-pronunciation-hosted-audio.yml --ref main
          echo 'Dispatched targeted pronunciation hosted-audio recovery.'

      - name: No action needed
        if: steps.state.outputs.complete == 'true'
        run: echo 'Pronunciation hosted audio is already fully ready; watchdog will not dispatch recovery.'
