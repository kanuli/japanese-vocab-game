name: Pronunciation Recovery State — manual audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pronunciation-recovery-state-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm hosted coverage is complete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          st=load('pronunciation-supertonic-original-index.json')
          vv=load('pronunciation-voicevox-original-index.json')
          status=load('pronunciation-hosted-status.json')

          assert (st.get('status'),st.get('questionCount'),st.get('voiceCount'),st.get('recordingCount'))==('ready',6690,10,66900)
          assert (vv.get('status'),vv.get('questionCount'),vv.get('speakerCount'),vv.get('recordingCount'))==('ready',6690,43,287670)
          assert status.get('status')=='ready' and status.get('sentenceCount')==10000
          assert status.get('supertonic',{}).get('recordingCount')==100000
          assert status.get('voicevox',{}).get('recordingCount')==430000
          print('Pronunciation hosted coverage is complete; automatic recovery is retired.')
          PY

      - name: Confirm no active recovery run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/recover-pronunciation-hosted-audio.yml/runs?per_page=20" > /tmp/runs.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/runs.json',encoding='utf-8'))
          active_states={'queued','in_progress','waiting','requested','pending'}
          active=[r for r in (data.get('workflow_runs') or []) if r.get('status') in active_states]
          if active:
              raise SystemExit('Active recovery runs remain: '+str([(r.get('id'),r.get('status')) for r in active]))
          print('No active pronunciation recovery runs.')
          PY
