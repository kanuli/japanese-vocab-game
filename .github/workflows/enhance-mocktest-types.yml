name: Align JLPT mock item types

on:
  push:
    paths:
      - '.github/workflows/enhance-mocktest-types.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch level-specific reading and listening types
        run: python .github/scripts/enhance_mocktest_types.py

      - name: Validate JavaScript
        run: node --check mocktest.js

      - name: Verify official-style type labels
        run: |
          grep -q '統合理解' mocktest.js
          grep -q '主題理解' mocktest.js
          grep -q '課題理解' mocktest.js
          grep -q '概要理解' mocktest.js
          grep -q '発話表現' mocktest.js
          grep -q '即時応答' mocktest.js

      - name: Commit enhancement
        run: |
          if git diff --quiet; then
            echo "Mock test types already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mocktest.js
          git commit -m "Align mock test item types with JLPT levels"
          git push

# Triggered after preserving JavaScript escape sequences in the patch script.
