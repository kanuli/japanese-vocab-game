name: Recover Pronunciation VOICEVOX — HF source-of-truth v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.pronunciation-recovery-trigger'

permissions:
  contents: write
  actions: write
  id-token: write

env:
  HF_DATASET_REPO: kanuli1983/japanese-listening-voicevox-backup
  RELEASE_NAMESPACE: pronunciation-voicevox-original-v1

concurrency:
  group: pronunciation-voicevox-recovery-v4
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_pronunciation_original_audio_catalog.py
      - name: Validate 6,690 source sentences
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pronunciation-original-audio-catalog.json',encoding='utf-8'))
          q=d.get('questions') or {}
          assert len(q)==6690, len(q)
          levels={k:sum(1 for x in q.values() if x.get('level')==k) for k in ['N1','N2','N3','N4','N5']}
          assert sum(levels.values())==6690
          print('Catalog ready:',len(q),levels)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pronunciation-original-audio-catalog-v4
          path: pronunciation-original-audio-catalog.json
          retention-days: 7

  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      speakers: ${{ steps.matrix.outputs.speakers }}
    steps:
      - uses: actions/checkout@v4
      - name: Start official VOICEVOX Engine and discover canonical 43 speakers
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run --rm -d --name voicevox-engine -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then break; fi
            if [ "$i" = 120 ]; then docker logs voicevox-engine || true; exit 1; fi
            sleep 2
          done
      - id: matrix
        run: |
          curl -fsS http://127.0.0.1:50021/speakers -o /tmp/speakers.json
          python - <<'PY'
          import json,os
          speakers=json.load(open('/tmp/speakers.json',encoding='utf-8')); rows=[]; preferred=('ノーマル','Normal','NORMAL','通常')
          for i,sp in enumerate(speakers,1):
              name=str(sp.get('name','')).strip(); styles=list(sp.get('styles') or [])
              if not name or not styles: continue
              style=next((x for x in styles if str(x.get('name','')).strip() in preferred),styles[0])
              rows.append({'key':f's{i:02d}','name':name,'style_id':int(style['id']),'style':str(style.get('name','')).strip()})
          if len(rows)!=43: raise SystemExit(f'Expected 43 speakers, got {len(rows)}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('speakers='+json.dumps(rows,ensure_ascii=False,separators=(',',':'))+'\n')
          print('Canonical speakers:',len(rows))
          PY
      - if: always()
        run: docker stop voicevox-engine >/dev/null 2>&1 || true

  recover:
    needs: [catalog,discover]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        speaker: ${{ fromJSON(needs.discover.outputs.speakers) }}
        level: [N1,N2,N3,N4,N5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: pronunciation-original-audio-catalog-v4
          path: .
      - name: Recover this bundle from Hugging Face; synthesize only when truly missing
        env:
          K: ${{ matrix.speaker.key }}
          N: ${{ matrix.speaker.name }}
          STYLE_ID: ${{ matrix.speaker.style_id }}
          STYLE_NAME: ${{ matrix.speaker.style }}
          L: ${{ matrix.level }}
          HF_OIDC_RESOURCE: datasets/kanuli1983/japanese-listening-voicevox-backup
          HF_XET_HIGH_PERFORMANCE: '1'
        run: |
          set -euo pipefail
          OUT=pronunciation-voicevox-original-out
          mkdir -p "$OUT"
          ASSET="$K-$L.tar"
          URL="https://huggingface.co/datasets/$HF_DATASET_REPO/resolve/main/pronunciation/voicevox/original-v1/$K/$ASSET"
          echo "Checking HF source: $K/$L"
          if curl -fL --retry 7 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 1800 -o "$OUT/$ASSET" "$URL"; then
            echo "HF HIT $K/$L"
            ENGINE_KIND=voicevox \
            ASSET_PATH="$OUT/$ASSET" \
            MANIFEST_OUT="$OUT/$K-$L.json" \
            LEVEL="$L" \
            SPEAKER_KEY="$K" \
            SPEAKER_NAME="$N" \
            STYLE_ID="$STYLE_ID" \
            STYLE_NAME="$STYLE_NAME" \
            python scripts/rebuild_pronunciation_manifest_from_tar.py
          else
            echo "HF MISS $K/$L — generating only this missing bundle"
            rm -f "$OUT/$ASSET"
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            docker pull voicevox/voicevox_engine:cpu-latest
            docker run --rm -d --name voicevox-engine -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
            trap 'docker stop voicevox-engine >/dev/null 2>&1 || true' EXIT
            for i in $(seq 1 120); do
              if curl -fsS http://127.0.0.1:50021/version >/dev/null; then break; fi
              if [ "$i" = 120 ]; then docker logs voicevox-engine || true; exit 1; fi
              sleep 2
            done
            JLPT="$L" SPEAKER_KEY="$K" SPEAKER_NAME="$N" STYLE_ID="$STYLE_ID" STYLE_NAME="$STYLE_NAME" OUTPUT_DIR="$OUT" \
              python scripts/generate_pronunciation_voicevox_original_level.py
            python -m pip install --quiet --disable-pip-version-check 'huggingface_hub>=1.19,<2'
            OK=0
            for n in 1 2 3 4 5 6 7; do
              if hf upload "$HF_DATASET_REPO" "$OUT/$ASSET" "pronunciation/voicevox/original-v1/$K/$ASSET" --repo-type dataset --commit-message "Recover pronunciation VOICEVOX $K $L"; then OK=1; break; fi
              echo "HF upload retry $n for $K/$L"
              sleep $((n*10))
            done
            test "$OK" -eq 1
            docker stop voicevox-engine >/dev/null 2>&1 || true
            trap - EXIT
          fi

          python - <<'PY'
          import json,os,tarfile
          from pathlib import Path
          k,l=os.environ['K'],os.environ['L']; out=Path('pronunciation-voicevox-original-out')
          m=json.load(open(out/f'{k}-{l}.json',encoding='utf-8'))
          p=out/m['asset']
          assert p.is_file() and p.stat().st_size>100000
          assert m['count']==len(m['members']) and m['count']>0
          with tarfile.open(p,'r:') as tf:
              files=[x for x in tf.getmembers() if x.isfile() and x.name.endswith('.mp3')]
          assert len(files)==m['count']
          print('VALID',k,l,m['count'],p.stat().st_size)
          PY
      - name: Preserve one authoritative manifest
        run: |
          mkdir -p manifest-artifact
          cp "pronunciation-voicevox-original-out/${{ matrix.speaker.key }}-${{ matrix.level }}.json" manifest-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: pronunciation-v4-manifest-${{ matrix.speaker.key }}-${{ matrix.level }}
          path: manifest-artifact/*.json
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs: [catalog,discover,recover]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: pronunciation-original-audio-catalog-v4
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: pronunciation-v4-manifest-*
          path: pronunciation-voicevox-original-manifests
          merge-multiple: true
      - name: Require all 215 speaker-level manifests
        run: |
          COUNT=$(find pronunciation-voicevox-original-manifests -name '*.json' | wc -l)
          echo "VOICEVOX manifests: $COUNT / 215"
          test "$COUNT" -eq 215
      - name: Build exact 287,670-recording VOICEVOX index
        run: |
          python scripts/build_pronunciation_voicevox_original_index.py
          python - <<'PY'
          import json
          d=json.load(open('pronunciation-voicevox-original-index.json',encoding='utf-8'))
          assert d['status']=='ready'
          assert d['questionCount']==6690
          assert d['speakerCount']==43
          assert d['recordingCount']==287670
          assert len(d.get('questions') or {})==6690
          assert len(d.get('speakers') or {})==43
          assert {x['questionCount'] for x in d['speakers'].values()}=={6690}
          print('VOICEVOX READY:',d['questionCount'],d['speakerCount'],d['recordingCount'])
          PY
      - name: Verify complete 10,000-sentence Supertonic + VOICEVOX coverage
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          def load(p):
              with open(p,encoding='utf-8') as f:return json.load(f)
          old_st=load('listening-supertonic-index.json')
          new_st=load('pronunciation-supertonic-original-index.json')
          old_vv=load('voicevox-full-index.json')
          new_vv=load('pronunciation-voicevox-original-index.json')
          def qcount(d):
              q=d.get('questions')
              if isinstance(q,dict) and q:
                  return len(q)
              for key in ('questionCount','indexed','count'):
                  try:
                      n=int(d.get(key) or 0)
                  except (TypeError,ValueError):
                      n=0
                  if n:
                      return n
              return 0
          def entity_count(d):
              x=d.get('voices') or d.get('speakers') or {}
              if isinstance(x,dict) and x:
                  return len(x)
              for key in ('voiceCount','speakerCount'):
                  try:
                      n=int(d.get(key) or 0)
                  except (TypeError,ValueError):
                      n=0
                  if n:
                      return n
              return 0
          assert qcount(old_st)==3310, qcount(old_st)
          assert qcount(new_st)==6690, qcount(new_st)
          assert new_st.get('status')=='ready'
          assert new_st.get('recordingCount')==66900
          assert qcount(old_vv)==3310, qcount(old_vv)
          assert qcount(new_vv)==6690, qcount(new_vv)
          assert new_vv.get('status')=='ready'
          assert new_vv.get('recordingCount')==287670
          assert qcount(old_st)+qcount(new_st)==10000
          assert qcount(old_vv)+qcount(new_vv)==10000
          assert entity_count(new_st)==10, entity_count(new_st)
          assert entity_count(new_vv)==43, entity_count(new_vv)
          status={
            'version':1,
            'status':'ready',
            'checkedAt':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'sentenceCount':10000,
            'supertonic':{'sentenceCount':10000,'voiceCount':10,'recordingCount':100000,'old3310':3310,'new6690':6690},
            'voicevox':{'sentenceCount':10000,'speakerCount':43,'recordingCount':430000,'old3310':3310,'new6690':6690}
          }
          with open('pronunciation-hosted-status.json','w',encoding='utf-8') as f:json.dump(status,f,ensure_ascii=False,indent=2);f.write('\n')
          print('PRONUNCIATION HOSTED AUDIO READY: 10,000 sentences')
          PY
      - name: Publish final index and completion status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pronunciation-voicevox-original-index.json pronunciation-hosted-status.json
          if git diff --cached --quiet; then
            echo 'Final files already current.'
          else
            git commit -m 'Complete pronunciation VOICEVOX 10,000 hosted coverage'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Deploy Pages and verify Hugging Face backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-static-pages.yml --ref main
          gh workflow run verify-huggingface-backup.yml --ref main
          echo 'Dispatched Pages deployment and HF integrity verification.'
