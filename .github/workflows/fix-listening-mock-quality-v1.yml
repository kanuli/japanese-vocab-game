name: Fix listening and mock question quality v3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-listening-mock-quality-v1.yml'
      - '.github/scripts/fix_listening_mock_quality_v1.py'
      - '.github/scripts/fix_listening_mock_quality_v2.py'
      - '.github/scripts/fix_listening_mock_quality_v3.py'
      - '.github/scripts/audit_listening_mock_quality_v3.mjs'
  pull_request:
    branches:
      - main
    paths:
      - 'data/listening_mock_quality_v1_trigger.txt'
      - '.github/workflows/fix-listening-mock-quality-v1.yml'
      - '.github/scripts/fix_listening_mock_quality_v1.py'
      - '.github/scripts/fix_listening_mock_quality_v2.py'
      - '.github/scripts/fix_listening_mock_quality_v3.py'
      - '.github/scripts/audit_listening_mock_quality_v3.mjs'
      - 'listening.html'
      - 'mocktest.js'
      - 'mocktest.html'

permissions:
  contents: write

jobs:
  repair-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0
      - name: Patch listening and mock exam quality v3
        run: python3 .github/scripts/fix_listening_mock_quality_v3.py
      - name: Validate JavaScript syntax
        run: node --check mocktest.js
      - name: Full listening and N1-N5 mock quality audit
        run: node .github/scripts/audit_listening_mock_quality_v3.mjs
      - name: Check whitespace
        run: git diff --check
      - name: Commit validated quality fixes to PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening.html mocktest.js mocktest.html data/listening_mock_quality_v2_report.json data/listening_mock_quality_v3_report.json
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Finalize listening and mock question quality v3'
          git push origin HEAD:${{ github.head_ref }}
      - name: Commit validated quality fixes on main
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening.html mocktest.js mocktest.html data/listening_mock_quality_v2_report.json data/listening_mock_quality_v3_report.json
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Finalize listening and mock question quality v3'
          git push
