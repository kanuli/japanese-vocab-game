name: Fix listening and mock question quality v1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-listening-mock-quality-v1.yml'
      - '.github/scripts/fix_listening_mock_quality_v1.py'
      - '.github/scripts/audit_listening_mock_quality_v1.mjs'

permissions:
  contents: write

jobs:
  repair-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Patch listening and mock exam quality
        run: python3 .github/scripts/fix_listening_mock_quality_v1.py
      - name: Validate JavaScript syntax
        run: node --check mocktest.js
      - name: Audit listening catalog and repeated N1-N5 mock generation
        run: node .github/scripts/audit_listening_mock_quality_v1.mjs
      - name: Check whitespace
        run: git diff --check
      - name: Commit validated quality fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listening.html mocktest.js mocktest.html data/listening_mock_quality_v1_report.json
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Fix listening and mock question quality'
          git push
