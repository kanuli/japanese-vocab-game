name: Install Situation Conversation page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.conversation-install-trigger'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate Situation Conversation files
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('.github/situation-conversation-bootstrap.txt').write_text('bootstrap',encoding='utf-8')
          PY
      - name: Commit bootstrap marker
        run: |
          echo "Bootstrap workflow installed."
