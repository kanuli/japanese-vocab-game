name: Install Situation Conversation page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.conversation-install-trigger'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize navigation
        run: python .github/patch-conversation-nav.py
      - name: Validate Situation Conversation build
        run: |
          node --check conversation.js
          node - <<'NODE'
          global.window=global;
          for (let i=1;i<=5;i++) require(`./conversation-data-${i}.js`);
          const scenes=global.SITUATION_SCENES||[];
          const dialogues=scenes.reduce((n,s)=>n+s.items.length,0);
          const lines=scenes.reduce((n,s)=>n+s.items.reduce((m,x)=>m+x.lines.length,0),0);
          if(scenes.length<25||dialogues<125||lines<250) throw new Error(`Unexpected coverage ${scenes.length}/${dialogues}/${lines}`);
          console.log(`Validated ${scenes.length} scenes, ${dialogues} dialogues, ${lines} spoken lines`);
          NODE
      - name: Commit synchronized navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html wordaudio.html wordlist.html grammar.html listening.html mocktest.html translator.html
          if git diff --cached --quiet; then
            echo "Navigation already current"
          else
            git commit -m "Add Situation Conversation to site navigation"
            git pull --rebase origin main
            git push origin main
          fi
