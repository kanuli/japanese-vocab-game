<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日本語單字挑戰 Plus</title><style>:root{--b:#3568dd;--bg:#f5f7fb;--line:#dfe4ec;--ok:#137a4b;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.row,.stats{display:flex;gap:7px;flex-wrap:wrap}.btn,.pill{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:700}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{border-radius:999px;font-size:13px}.sub,.muted{font-size:13px;color:#6c7483}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 35px rgba(20,35,70,.08)}h1{margin:0;font-size:clamp(26px,4vw,38px)}h2{font-size:17px;margin:0 0 10px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.levels input,.radios input{position:absolute;opacity:0}.levels label,.radios label{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px}.levels input:checked+label,.radios input:checked+label{background:#eef3ff;border-color:var(--b);color:var(--b);font-weight:800}.radios{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.radios.two{grid-template-columns:1fr 1fr}.section{margin-top:18px}.notice{margin-top:12px;padding:10px;border:1px solid #f0d68b;background:#fff8e7;border-radius:10px;font-size:13px}.start{width:100%;margin-top:12px;padding:13px}.source{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px}.counts{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.count{background:#f2f4f8;border-radius:999px;padding:4px 7px;font-size:12px}.quiz{display:none}.qhead{display:flex;justify-content:space-between;gap:8px}.question{text-align:center;font:850 clamp(42px,10vw,76px)/1.2 "Yu Mincho",serif;margin:28px 0 6px}.prompt{text-align:center;color:#6c7483;margin-bottom:16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:64px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-weight:700}.choice.correct{border-color:var(--ok);background:#edf9f2;color:var(--ok)}.choice.wrong{border-color:var(--bad);background:#fff0ee;color:var(--bad)}.backdrop{display:none;position:fixed;inset:0;background:#18203333;z-index:20}.sheet{display:none;position:fixed;z-index:21;left:50%;bottom:12px;transform:translateX(-50%);width:min(620px,calc(100% - 20px));background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 20px 60px #18203344}.result{font-size:20px;font-weight:900}.answer{display:grid;grid-template-columns:82px 1fr;gap:6px 10px;margin-top:10px}.tag{display:inline-block;border-radius:999px;padding:3px 7px;font-size:11px;font-weight:800}.core{background:#e9f0ff;color:#2f5bc8}.est{background:#fff0d8;color:#985900}.end{display:none;text-align:center}.review{display:grid;gap:8px;text-align:left;margin-top:18px}.ri{border:1px solid var(--line);border-radius:11px;padding:11px}.ri.bad{background:#fff0ee;border-color:#efb4ae}.ri.good{background:#edf9f2;border-color:#b9dfca}.rw{font:800 21px "Yu Mincho",serif}@media(max-width:720px){.grid{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.radios{grid-template-columns:1fr 1fr}.wrap{padding:12px}}</style><script src="./mobile-supertonic-guard.js?v=20260817v4"></script>

</head><body><div class="wrap"><div class="top"><div><h1>🇯🇵 日本語單字挑戰 Plus</h1><div class="sub">JLPT核心詞 + 進階補充詞（推定 N1–N5）</div></div><span id="total" class="pill">📚 0</span></div><div id="setup" class="grid"><section class="card"><h2>1. JLPT 等級</h2><div class="levels"><div><input id="n1" type="checkbox" value="N1"><label for="n1">N1</label></div><div><input id="n2" type="checkbox" value="N2"><label for="n2">N2</label></div><div><input id="n3" type="checkbox" value="N3" checked><label for="n3">N3</label></div><div><input id="n4" type="checkbox" value="N4" checked><label for="n4">N4</label></div><div><input id="n5" type="checkbox" value="N5" checked><label for="n5">N5</label></div></div><div class="row" style="margin-top:8px"><button class="btn preset" data-l="N1,N2,N3,N4,N5">全部</button><button class="btn preset" data-l="N3,N4,N5">N3–N5</button><button class="btn preset" data-l="N4,N5">N4–N5</button></div><div class="section"><h2>2. 題數</h2><div class="radios"><div><input id="q10" name="q" type="radio" value="10"><label for="q10">10</label></div><div><input id="q20" name="q" type="radio" value="20" checked><label for="q20">20</label></div><div><input id="q50" name="q" type="radio" value="50"><label for="q50">50</label></div><div><input id="q0" name="q" type="radio" value="0"><label for="q0">無限</label></div></div></div><div class="section"><h2>3. 模式</h2><div class="radios two"><div><input id="all" name="mode" type="radio" value="all" checked><label for="all">全部</label></div><div><input id="wrong" name="mode" type="radio" value="wrong"><label for="wrong">錯題</label></div></div></div><div id="availability" class="notice">載入中…</div><button id="start" class="btn primary start" disabled>開始 START</button></section><aside class="card"><h2>單字來源</h2><div class="source"><b>🌐 JLPT核心詞</b><div id="coreStatus" class="muted">載入中…</div><div id="counts" class="counts"></div><button id="reload" class="btn" style="margin-top:8px">重新載入</button></div><div class="source"><b>➕ 進階補充詞</b><div id="advStatus" class="muted">準備中…</div><div class="muted">現代常用詞；等級標示「推定」。</div></div><div class="source"><a class="btn" href="./index.html">← 返回原版單字頁</a></div></aside></div><section id="quiz" class="card quiz"><div class="qhead"><button id="quit" class="btn">← 返回</button><div class="stats"><span id="progress" class="pill"></span><span id="score" class="pill">✅0</span></div></div><div id="question" class="question"></div><div class="prompt">請選擇正確的繁體中文意思</div><div id="choices" class="choices"></div><div id="end" class="end"><h2 id="final"></h2><div id="summary"></div><div id="review" class="review"></div><div class="row" style="justify-content:center;margin-top:16px"><button id="retry" class="btn primary">只重練本回合錯題</button><button id="again" class="btn">返回設定</button></div></div></section></div><div id="backdrop" class="backdrop"></div><div id="sheet" class="sheet"><div id="result" class="result"></div><div class="answer"><div>漢字</div><div id="ak"></div><div>讀音</div><div id="ar"></div><div>等級</div><div id="al"></div><div>意思</div><div id="am"></div></div><div class="row" style="margin-top:12px"><button id="speak" class="btn">🔊 發音</button><button id="next" class="btn primary" style="flex:1">下一題 →</button></div></div><script src="./advanced_words.js?v=20260825v3"></script><script>(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],URLS=["https://raw.githubusercontent.com/5mdld/anki-jlpt-decks/main/deck-source/notes.csv","https://cdn.jsdelivr.net/gh/5mdld/anki-jlpt-decks@main/deck-source/notes.csv"];let core=[],adv=Array.isArray(window.ADVANCED_WORDS)?window.ADVANCED_WORDS:[],wrong=new Set(JSON.parse(localStorage.getItem("jpquiz_wrong")||"[]")),game=null;const F=["Notetype","Deck","NoteID","VocabKanji","VocabPitch","VocabPoS","VocabFurigana","VocabDefSC","VocabDefTC","VocabPlus","VocabAudio","SentType1","SentKanji1","SentFurigana1","SentDefSC1","SentDefTC1","SentAudio1","SentType2","SentKanji2","SentFurigana2","SentDefSC2","SentDefTC2","SentAudio2","SentType3","SentKanji3","SentFurigana3","SentDefSC3","SentDefTC3","SentAudio3","SentType4","SentKanji4","SentFurigana4","SentDefSC4","SentDefTC4","SentAudio4","Sort","Alt1","Alt2","Tags"];function strip(s){const d=document.createElement("div");d.innerHTML=String(s||"").replace(/\[sound:[^\]]+\]/gi,"");return(d.textContent||"").trim()}function hasK(s){return/[\u3400-\u9fff々]/.test(s||"")}function rd(f,w){let s=String(f||w||"").replace(/[\u3400-\u9fff々]+\[([^\]]+)\]/g,"$1").replace(/\[([^\]]+)\]/g,"$1");s=strip(s).replace(/\s+/g,"");return hasK(s)?"":s}function parse(t){let rows=[],r=[],f="",q=false,d=t.startsWith("#separator:comma")?",":"\t";for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===d){r.push(f);f=""}else if(c==='\n'){r.push(f);rows.push(r);r=[];f=""}else if(c!=='\r')f+=c}return rows}function obj(r){if(r.length===F.length+1)r=r.slice(1);if(r.length!==F.length)return null;return Object.fromEntries(F.map((x,i)=>[x,r[i]||""]))}function key(w){return`${w.reading}|${w.kanji||w.displayWord}`}function uniq(a){const s=new Set;return a.filter(w=>{let k=key(w);if(s.has(k))return false;s.add(k);return true})}function words(rows){let out=[];for(const r of rows){if(!r.length||String(r[0]).startsWith("#"))continue;const o=obj(r);if(!o)continue;const m=`${o.Deck} ${o.Tags}`.match(/N([1-5])/i),w=strip(o.VocabKanji),reading=rd(o.VocabFurigana,w),meaning=strip(o.VocabDefTC);if(!m||!w||!reading||!meaning)continue;out.push({id:`core-${o.NoteID||out.length}`,level:`N${m[1]}`,reading,kanji:hasK(w)?w:"",displayWord:w,meaning,estimated:false})}return uniq(out)}function merge(){return uniq([...core,...adv])}function dedup(){const s=new Set(core.map(key));adv=uniq(adv).filter(w=>!s.has(key(w)))}async function loadCore(force=false){$("#coreStatus").textContent="載入約10,600個核心詞…";let e;for(const u of URLS){try{const r=await fetch(u,{cache:force?"reload":"default"});if(!r.ok)throw Error(r.status);const x=words(parse(await r.text()));if(x.length<1000)throw Error(`只解析到${x.length}`);core=x;dedup();$("#coreStatus").textContent=`✅ 核心詞 ${core.length.toLocaleString()} 個`;$("#advStatus").textContent=`✅ 補充 ${adv.length.toLocaleString()} 個（已去重）`;update();return}catch(err){e=err}}$("#coreStatus").textContent=`⚠️ 核心詞載入失敗：${e?.message||"未知"}`;$("#advStatus").textContent=`✅ 補充 ${adv.length.toLocaleString()} 個仍可使用`;update()}function levels(){return $$(".levels input:checked").map(x=>x.value)}function pool(){let p=merge().filter(w=>levels().includes(w.level));if($("input[name=mode]:checked").value==="wrong")p=p.filter(w=>wrong.has(w.id));return p}function update(){const a=merge(),c={N1:0,N2:0,N3:0,N4:0,N5:0};a.forEach(w=>c[w.level]++);$("#total").textContent=`📚 ${a.length.toLocaleString()}`;$("#counts").innerHTML=Object.entries(c).map(([k,v])=>`<span class=count>${k}:${v}</span>`).join("");const p=pool(),n=p.filter(w=>w.estimated).length;$("#availability").textContent=p.length>=4?`可開始：${p.length.toLocaleString()}詞，其中${n}詞為進階補充。`:`可用詞不足。`;$("#start").disabled=p.length<4}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function cat(m){if(/現在|以後|以前|未來|直到|後來/.test(m))return"time";if(/網路|網站|資料|雲端|人工智能|加密|驗證|串流|演算法/.test(m))return"tech";if(/工作|招聘|面試|轉職|副業/.test(m))return"work";if(/氣候|能源|碳|環境|回收/.test(m))return"green";if(/購物|付款|收據|優惠|價格/.test(m))return"shop";return""}function choices(c,p){const cc=cat(c.meaning),same=shuffle(p.filter(w=>w.id!==c.id&&w.meaning!==c.meaning&&cc&&cat(w.meaning)===cc)),rest=shuffle(p.filter(w=>w.id!==c.id&&w.meaning!==c.meaning&&(!cc||cat(w.meaning)!==cc)));let out=[c],seen=new Set([c.meaning]);for(const w of [...same,...rest]){if(seen.has(w.meaning))continue;seen.add(w.meaning);out.push(w);if(out.length===4)break}return shuffle(out)}function start(){let p=pool(),n=+$('input[name=q]:checked').value;game={pool:p,order:shuffle(p),limit:n,infinite:n===0,index:0,score:0,current:null,answered:false,history:[],roundWrong:[]};$("#setup").style.display="none";$("#quiz").style.display="block";$("#end").style.display="none";next()}function next(){hide();if(!game)return;if(!game.infinite&&game.index>=game.limit)return finish();if(game.index>=game.order.length)game.order=shuffle(game.pool);const c=game.order[game.index%game.order.length],cs=choices(c,game.pool);game.current=c;game.answered=false;$("#question").style.display="block";$("#choices").style.display="grid";$("#question").textContent=c.reading;$("#choices").innerHTML=cs.map((w,i)=>`<button class=choice data-id="${w.id}"><b>${String.fromCharCode(65+i)}.</b> ${w.meaning}</button>`).join("");$$('.choice').forEach(b=>b.onclick=()=>answer(b.dataset.id));stats()}function answer(id){if(game.answered)return;game.answered=true;const c=game.current,s=game.pool.find(w=>w.id===id)||c,ok=id===c.id;if(ok){game.score++;wrong.delete(c.id)}else{wrong.add(c.id);if(!game.roundWrong.includes(c.id))game.roundWrong.push(c.id)}localStorage.setItem("jpquiz_wrong",JSON.stringify([...wrong]));game.history.push({ok,c,selected:s.meaning});$$('.choice').forEach(b=>{b.disabled=true;if(b.dataset.id===c.id)b.classList.add("correct");else if(b.dataset.id===id)b.classList.add("wrong")});$("#result").textContent=ok?"✅ 正確！":"❌ 不正確";$("#ak").textContent=c.kanji||"— 沒有常用漢字 —";$("#ar").textContent=c.reading;$("#al").innerHTML=c.estimated?`<span class="tag est">推定 ${c.level}</span>`:`<span class="tag core">${c.level}</span>`;$("#am").textContent=c.meaning;game.index++;stats();show()}function stats(){$("#progress").textContent=game.infinite?`第${game.index+1}題`:`${Math.min(game.index+1,game.limit)}/${game.limit}`;$("#score").textContent=`✅${game.score}`}function show(){$("#backdrop").style.display="block";$("#sheet").style.display="block"}function hide(){$("#backdrop").style.display="none";$("#sheet").style.display="none"}function finish(){hide();$("#question").style.display=$("#choices").style.display="none";$("#end").style.display="block";$("#final").textContent=`${game.score}/${game.limit}`;$("#summary").textContent=`正確率 ${Math.round(game.score/game.limit*100)}%`;$("#retry").disabled=!game.roundWrong.length;$("#review").innerHTML=game.history.map(x=>`<div class="ri ${x.ok?'good':'bad'}"><div class=rw>${x.c.kanji||x.c.reading}</div><div class=muted>${x.c.kanji?x.c.reading+' · ':''}${x.c.estimated?'推定 ':''}${x.c.level}</div><div>${x.ok?'✅ '+x.c.meaning:`❌ 你的答案：${x.selected}<br>✅ 正確：${x.c.meaning}`}</div></div>`).join("")}function retry(){const ids=new Set(game.roundWrong),a=game.pool.filter(w=>ids.has(w.id));game={pool:game.pool,order:shuffle(a),limit:a.length,infinite:false,index:0,score:0,current:null,answered:false,history:[],roundWrong:[]};$("#end").style.display="none";next()}function quit(){hide();game=null;$("#quiz").style.display="none";$("#setup").style.display="grid";update()}$$('.preset').forEach(b=>b.onclick=()=>{const s=new Set(b.dataset.l.split(','));$$('.levels input').forEach(x=>x.checked=s.has(x.value));update()});$$('.levels input').forEach(x=>x.onchange=update);$$('input[name=mode]').forEach(x=>x.onchange=update);$("#start").onclick=start;$("#next").onclick=next;$("#quit").onclick=quit;$("#again").onclick=quit;$("#retry").onclick=retry;$("#reload").onclick=()=>loadCore(true);$("#speak").onclick=()=>{if(!game?.current||!("speechSynthesis"in window))return;const u=new SpeechSynthesisUtterance(game.current.displayWord||game.current.reading);u.lang="ja-JP";speechSynthesis.cancel();speechSynthesis.speak(u)};$("#advStatus").textContent=`已準備 ${adv.length} 個補充詞，等待核心詞去重。`;update();loadCore()})();</script></body></html>
