<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本語單字挑戰 Plus</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:#f5f7fb;color:#182033;margin:0}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dfe4ec;border-radius:16px;padding:18px;margin-bottom:14px}.btn{display:inline-block;border:1px solid #3568dd;background:#3568dd;color:white;border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:700}.muted{color:#6c7483;font-size:13px}.list{display:grid;gap:7px}.item{border:1px solid #dfe4ec;border-radius:10px;padding:10px}.tag{display:inline-block;background:#fff0d8;color:#985900;border-radius:999px;padding:3px 7px;font-size:11px;font-weight:800}</style><script src="./mobile-supertonic-guard.js?v=20260817v4"></script>

</head><body><div class="wrap"><div class="card"><h1>🇯🇵 日本語單字挑戰 Plus</h1><p>這是進階補充詞資料庫的檢查頁。JLPT核心詞維持原有資料；下方補充詞的 N1–N5 均為學習用推定等級。</p><div id="summary" class="muted">載入中…</div><p><a class="btn" href="./index.html">返回目前單字遊戲</a></p></div><div class="card"><h2>進階補充詞</h2><div id="list" class="list"></div></div></div><script src="./advanced_words.js?v=20260825v3"></script><script>const a=Array.isArray(window.ADVANCED_WORDS)?window.ADVANCED_WORDS:[];document.getElementById('summary').textContent=`已載入 ${a.length} 個進階補充詞。`;document.getElementById('list').innerHTML=a.slice(0,300).map(w=>`<div class="item"><b>${w.kanji||w.reading}</b>　${w.reading}<br>${w.meaning}　<span class="tag">推定 ${w.level}</span></div>`).join('');</script></body></html>
